const hydrantPoints = {"type": "FeatureCollection", "name": "fire_hydrants", "crs": {"type": "name", "properties": {"name": "urn:ogc:def:crs:OGC:1.3:CRS84"}}, "features": [{"type": "Feature", "properties": {"시설번호": "동부-지산-동부-25", "시설유형코드": "6 ", "시도명": "광주광역시", "시군구명": "동구", "시군구코드": "62901", "소재지도로명주소": "광주광역시 동구 동계로 13번길 18-2", "소재지지번주소": "광주광역시 동구 동명동 209-53", "위도": 35.1534417444, "경도": 126.9225468786, "상세위치": "", "안전센터명": "지산110안전센터", "보호틀유무": "N", "설치연도": "2019", "출수압력": "3.3", "관할기관명": "동부소방서", "관할기관전화번호": "062-606-4257", "데이터기준일자": "2024-02-07", "제공기관코드": "1661000", "제공기관명": "소방청"}, "geometry": {"type": "Point", "coordinates": [126.9225468786, 35.1534417444]}}]};
const fireStation = {"lat": 35.13601, "lng": 126.922737, "name": "광주동부소방서", "address": "전남광주 동구 제봉로 210"};

const statusColor = {
  BLUE: '#2b6cb0', GREEN: '#3fae4e', YELLOW: '#e0b400',
  ORANGE: '#e8791a', RED: '#d64545', GRAY: '#8a8a8a'
};

window.addEventListener('load', () => {
  if (typeof naver === 'undefined') return; // 토큰 없으면 여기서 중단

  // ⚠ CSS top/bottom 계산이 안 먹혀서(height:0) 강제로 픽셀 실측값을 인라인으로 박아넣음
  const mapEl = document.getElementById('map');
  function fixMapSize() {
    mapEl.style.height = (window.innerHeight - 56) + 'px';
    mapEl.style.width = window.innerWidth + 'px';
  }
  fixMapSize();
  window.addEventListener('resize', fixMapSize);

  const map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(35.1400, 126.9245),
    zoom: 15,
    // 최소 UI: 기본 컨트롤 최소화 (Style Editor로 만든 커스텀 스타일 ID는 여기 mapId 파라미터로 나중에 교체)
    zoomControl: true,
    zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT },
    logoControl: false,
    mapDataControl: false,
    scaleControl: false
  });

  // ⚠ Naver Maps는 생성 시점에 컨테이너 크기를 못 읽으면 0px로 렌더링되는 경우가 있음 -> 강제 리사이즈 트리거
  naver.maps.Event.trigger(map, 'resize');
  window.addEventListener('resize', () => naver.maps.Event.trigger(map, 'resize'));
  setTimeout(() => naver.maps.Event.trigger(map, 'resize'), 300);

  // 도로 세그먼트 - GeoJSON 자동파서(addGeoJson) 대신 직접 Polyline 생성 (CRS 메타데이터 등으로 자동파서가 조용히 실패하는 문제 회피)
  const roadInfoWindow = new naver.maps.InfoWindow({ content: '' });
  segments.features.forEach((f) => {
    const p = f.properties;
    const color = statusColor[p.current_status] || '#000';
    const geomType = f.geometry.type;
    // LineString은 좌표 배열 하나, MultiLineString은 여러 개(끊긴 구간들) -> 각각 별도 Polyline
    const lineArrays = geomType === 'MultiLineString' ? f.geometry.coordinates : [f.geometry.coordinates];

    lineArrays.forEach((coords) => {
      const path = coords.map(([lng, lat]) => new naver.maps.LatLng(lat, lng));
      const polyline = new naver.maps.Polyline({
        map: map,
        path: path,
        strokeColor: color,
        strokeWeight: 5,
        strokeOpacity: 0.95,
        strokeLineCap: 'round'
      });
      naver.maps.Event.addListener(polyline, 'click', (e) => {
        roadInfoWindow.setContent(
          `<div style="padding:6px 10px;font-size:12px;">
            <b>${p.road_name || '(무명)'}</b><br>
            폭: ${p.road_bt}m · tier: ${p.tier}<br>
            상태: ${p.current_status}</div>`
        );
        roadInfoWindow.open(map, e.coord);
      });
    });
  });

  // CCTV
  cctvPoints.features.forEach(f => {
    const [lng, lat] = f.geometry.coordinates;
    new naver.maps.Marker({
      position: new naver.maps.LatLng(lat, lng), map: map,
      icon: { content: '<div style="width:10px;height:10px;border-radius:50%;background:#2b6cb0;border:1.5px solid #fff;"></div>' }
    });
  });

  // 소화전
  hydrantPoints.features.forEach(f => {
    const [lng, lat] = f.geometry.coordinates;
    new naver.maps.Marker({
      position: new naver.maps.LatLng(lat, lng), map: map,
      icon: { content: '<div style="width:12px;height:12px;border-radius:50%;background:#c0392b;border:1.5px solid #fff;"></div>' }
    });
  });

  // 소방서
  const stationMarker = new naver.maps.Marker({
    position: new naver.maps.LatLng(fireStation.lat, fireStation.lng), map: map,
    icon: { content: '<div style="width:16px;height:16px;border-radius:50%;background:#c0392b;border:2px solid #fff;"></div>' }
  });
  new naver.maps.InfoWindow({
    content: `<div style="padding:6px 10px;font-size:12px;"><b>🚒 ${fireStation.name}</b><br>${fireStation.address}</div>`
  }).open(map, stationMarker);
});
