# gitleaks 설정. 기본 규칙을 그대로 쓰고 allowlist 만 더한다.
#
# 주의 — TOML 여러줄 문자열 안에서는 백슬래시가 이스케이프로 해석된다.
#   2026-09-13 에 백틱을 감싸려고 넣은 백슬래시가 "invalid escaped
#   character U+0020" 로 파싱을 깨뜨렸고, 설정이 통째로 안 읽혔다.
#   설정이 안 읽히면 조용히 기본값으로 도니까 더 나쁘다. 백슬래시를 쓰지 않는다.
#   (아래 '''…''' 는 TOML 리터럴 문자열이라 이스케이프를 안 한다 — 정규식은 거기에만 쓴다.)
#
# ★ 2026-09-21 (DECISIONS §209). **allowlist 마다 regexTarget 을 명시한다.**
#   기본값은 "secret"(비밀값 자체)이다. 첫 allowlist 의 정규식은 'key: ' 로
#   시작하는데 비밀값에는 'key: ' 가 없으므로 **한 번도 맞은 적이 없었다.**
#   2026-09-10 부터 죽어 있었고, 그 설명이 이름까지 들어 푼다고 적은
#   tools/batches/b2_*.py 두 건이 이력 전수 스캔에서 그대로 걸렸다.
#   CI 가 초록이었던 것은 그 파일들이 이미 지워져 push 범위에 안 들어왔기
#   때문이다 — 틀린 이유로 초록이었다. tests/test_gitleaks_allowlist.py 가
#   regexTarget 누락을 잡는다.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = """
sources.yaml 대장의 데이터셋 키다. 비밀이 아니다.

  tools/batches/b2_final.py:105   key: juso_spotaddr_geom_2608
  tools/batches/b2_close.py:196   같음

generic-api-key 규칙이 'key:' 뒤의 영숫자를 본다. 대장 YAML 이 'key:' 를
필드명으로 쓰므로 전부 걸린다. 엔트로피 3.9 로 낮다.

규칙 전체를 끄지 않는다. 대장 키의 형태만 막는다 —
<제공기관>_<자료>_<연월> 이고 소문자·숫자·밑줄뿐이다.
진짜 키는 대문자나 하이픈이 섞여 이 정규식에 안 맞는다.

V-World 키는 별건이다. web/config.js 에 평문으로 있었고 2026-09-13 에
web/key.js(생성물)로 뺐다. 이력에는 남지만 무료·도메인 고정이고 그 키는
폐기됐다 — DECISIONS §146 · SECURITY.md.

★ 2026-10-03 정정 (DECISIONS §376). 이 자리에 「그쪽은 아직 이 스캔에 안
  걸렸다」고 적혀 있었다. **둘 다 틀렸다** —

  ① **걸린다.** gitleaks 8.28 의 generic-api-key 가 엔트로피로 문다
     (실측 3.663). 안 걸린 것이 아니라 **아무 관문도 그 자리를 안 봤다.**
  ② 「이력에는 남지만」이 범위를 좁게 적었다. §209 가 센 네 자리 중
     web/config.js · web/index.html 둘은 2026-09-13 에 비웠지만
     **sources.yaml 은 작업 트리에 그대로 있었다.** 이력과 트리는 다른
     사실이다 — 이력은 캐야 나오고, 트리는 복제하면 같이 간다.

  값은 §376 이 들어냈고, 트리 전수는 `tools/verify.sh` 의
  「비밀값 — 작업 트리 전수」 단계가 든다. 이 예외는 안 넓혔다.
"""
regexTarget = "match"
regexes = ['''key: [a-z][a-z0-9_]{8,}''']

[[rules.allowlists]]
description = """
봉인(data/dms/SEAL.json)의 파일 지문이다. 비밀이 아니다 — DECISIONS §209.

  "src/firelane/segkey.py": "fb1d88a1…"   (sha256 64자)

generic-api-key 가 파일 이름의 'key' 뒤 영숫자를 본다. segkey.py 하나가 걸렸다.
2026-09-21 v0.29 방송의 A-0 이 찍은, 파일별 지문을 담은 첫 봉인에서 났다.

경로와 줄 모양이 **둘 다** 맞아야 푼다(condition AND). 줄 모양은
「"경로": "소문자 16진 16자 또는 64자"」 하나뿐이다 — 지문의 두 길이다.
진짜 토큰은 대문자나 접두어(ghp_ · AKIA …)가 섞여 이 모양에 안 맞는다.
"""
condition = "AND"
paths = ['''^data/dms/SEAL\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[\w./@-]+": "(?:[0-9a-f]{16}|[0-9a-f]{64})",?\s*$''']

# ★ 2026-10-03 (DECISIONS §376). **전역 예외 — 키가 있어야 하는 자리.**
#
# `tools/verify.sh` 의 「비밀값 — 작업 트리 전수」가 디스크를 훑는다. 디스크에는
# gitignore 된 파일도 있고, 그중 **하나는 비밀값을 담는 것이 제 일**이다 —
#
#     .env          비밀값이 있어야 하는 자리. 사람이 손으로 쓴다
#
# ★ `web/key.js` 는 **안 뺐다.** 그것은 2026-09-22 에 생성이 멈춘 찌꺼기이고
#   `deploy.yml` 은 남아 있으면 **실패**시키며 `tidy.py` 는 지운다. 예외로
#   빼면 지워야 할 파일이 조용해진다 — 걸리는 것이 맞는 신호다.
#
# 이것을 안 빼면 트리 전수가 **제 기계에서 영원히 빨갛고**, 그러면 사람이
# 그 단계를 끈다(§73 — 오탐은 사람에게 `--force` 를 쓰게 만든다).
#
# ★ **이 예외가 안전한 이유는 다른 관문이 들고 있다.** 「추적되지 않는다」는
#   `tools/treecheck.py` 의 T2(gitignore 인데 추적 중)가 든다 — 그것이
#   커밋되는 순간 T2 가 운다. 이 예외는 「무시되는 동안만」 유효하고, 그
#   전제가 깨지면 **다른 관문이 먼저 운다.**
#   `tests/test_gitleaks_allowlist.py` 가 이것이 `.gitignore` 에 있는지를
#   본다 — 예외와 전제가 갈리면 거기서 운다.
#
# ★ 규칙을 끄지 않고 **경로만** 뺀다. 추적되는 파일은 전부 그대로 본다.
[[allowlists]]
description = "비밀값이 있어야 하는 자리 — gitignore 된 `.env` (DECISIONS §376)"
paths = ['''^\.env$''', '''^\.env\.''']
