[project]
name = "fire-lane"
version = "0.1.0"
description = "소방차 진입곤란 구간 자동 판정 및 우회 경로 탐색 (인공지능사관학교 7기 파이널)"
requires-python = ">=3.11"

# 전체 프로젝트 의존성. 팀원은 이 파일 하나만 보면 된다.
# 스택이 바뀌면 여기만 고치고 devcontainer를 리빌드하면 전원에게 전파된다.
#
# ★ 2026-08-23. `requirements-etl.txt` 를 삭제했다. "GIS 만 만지는 사람의
#   최소 세트" 라는 명분이었는데, 08-21 에 API·vision 9종을 extras 로 내리면서
#   **아래 dependencies 가 곧 그 최소 세트**가 됐다. 손대장이 둘이 되면 반드시
#   어긋난다(§18-3) — 실제로 어긋나 있었다.
#
#     requirements-etl 에 없는데 ETL 이 import 하던 것
#       rasterio   terrain.py · ortho.py · quiet_gdal.py
#       pillow     terrain.py · ortho.py
#
#   즉 그 파일로 설치하면 `fire-lane` 이 terrain 단계에서 ImportError 로 죽는다.
#   참조하는 곳은 0곳이었다(Dockerfile 도 devcontainer 도 `uv sync` 를 쓴다).
#   `tests/test_guards.py::test_etl_imports_are_declared` 가 재발을 막는다.
dependencies = [
    # ── GIS / ETL (현재 파이프라인이 실제로 쓰는 것) ──
    "geopandas>=1.1,<2",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "pyogrio>=0.13",          # geopandas의 SHP 리더. bbox 필터가 이걸로 동작
    "pandas>=2.2",
    "numpy>=1.26",
    "networkx>=3.3",
    "PyYAML>=6.0",
    "rasterio>=1.4.4",
    "pillow>=12.3.0",
    "ruamel-yaml>=0.19.1",
    # ★ tools/docx_check.py · docx_fix.py 가 import 한다. 기획서는 문서 넷 중
    #   유일하게 외부가 읽는데 시제 규칙 밖이라 강제자가 없어 낡았다.
    #   그 검사가 verify.sh 에서 도므로 코어다 — extras 로 내리면
    #   "선언은 있고 설치는 없는" 상태가 다시 생긴다.
    "python-docx>=1.1",
    # ★ 계약 계층. GIS·CV·인프라 세 파트가 모두 import 한다.
    #   src/contracts/ 가 파트 간 유일한 접점이므로 extras 가 아니라 코어다.
    "pydantic>=2.7,<3",
]

# ★ 2026-08-21. 종전 dependencies 에 fastapi·uvicorn·python-multipart·
#   SQLAlchemy·psycopg2-binary·GeoAlchemy2·opencv-python·ultralytics·requests
#   9종이 있었는데 src·tools·tests 어디에서도 import 0회였다. src/api/ 는
#   존재하지 않고 PostGIS 는 안 쓰기로 결정했다(HANDOFF §4).
#   안 쓰는 의존성은 devcontainer 리빌드 시간이고, 더 나쁘게는
#   "이 프로젝트가 DB 를 쓴다"는 거짓 신호다. 쓰기 시작할 때 올린다.
[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
vision = [
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    # torch 는 ultralytics 의 전이 의존성이지만 여기에 직접 적는다.
    # [tool.uv.sources] 는 직접 의존성에만 적용되므로, 선언하지 않으면
    # CPU 인덱스 지정이 무시되고 CUDA 휠이 깔린다.
    "torch>=2.4",
    "torchvision>=0.19",
]
# ★ GPU 없는 기기에서 `uv sync --all-extras` 를 돌리지 마라.
#   ultralytics 가 torch 를 끌고 오고 torch 가 CUDA 휠 3~5GB 를 끌고 온다.
#   GIS·인프라 담당은 vision 이 필요 없다.
#
#       GPU 있는 기기   uv sync --all-extras
#       GPU 없는 기기   uv sync --extra api --extra dev
#
#   CPU 전용 토치를 쓰려면 아래 주석을 풀어라. 휠이 200MB 대로 떨어진다.
#
#       [[tool.uv.index]]
#       name = "pytorch-cpu"
#       url = "https://download.pytorch.org/whl/cpu"
#       explicit = true
#
#       [tool.uv.sources]
#       torch = [{ index = "pytorch-cpu" }]
#       torchvision = [{ index = "pytorch-cpu" }]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pre-commit>=3.8",
]

# ★ 단일 진입점. `python src/etl/pipeline.py` 는 cwd 에 따라 깨졌다.
[project.scripts]
fire-lane = "firelane.pipeline:main"

# ── src 레이아웃 ──────────────────────────────────────────────
# ★ 2026-08-21. 종전에는 패키지가 아니라 스크립트 더미였고, 모듈이 서로를
#   찾으려고 sys.path.insert 를 17군데(src 14 · tests 3) 하고 있었다.
#   그 결과 (1) import 가 코드 뒤에 와서 noqa: E402 가 12개 붙었고
#   (2) 순환을 피하려고 함수 안에서 import 하는 자리가 생겼으며
#   (3) 계층 규칙을 강제할 수단이 없었다 — 순수 기하 모듈이 인프라 경로를
#   그냥 import 할 수 있었다. 패키지가 되면 순환은 import 시점에 죽는다.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ★ 2026-08-22. CI 에 ruff 를 넣어놓고 한 번도 초록불이 아니었다(155개).
#   진짜 위험한 것만 남기고 스타일 취향은 끈다. 아래 여섯은 **고치면
#   diff 400줄인데 얻는 게 없는** 규칙이다. 끄는 근거를 각각 적는다.
#
#   ★ 대신 켜둔 채로 통과시킨 것들이 중요하다. 특히 B905(zip strict).
#     zip 은 길이가 다르면 짧은 쪽에 맞춰 **조용히 자른다** — 이 저장소가
#     계속 겪은 "조용한 실패" 와 같은 부류다. 7곳 전부 strict= 를 명시했고,
#     segkey.py 의 seg_uid 생성이 그중 제일 위험했다.
ignore = [
    # 이 코드베이스의 일관된 스타일이다. `A.append(a); S.append(sc)` 처럼
    # 짝을 이루는 짧은 문장을 한 줄에 둔다. 가독성이 더 낫다.
    "E702",   # 세미콜론으로 한 줄에 여러 문장
    "E701",   # 콜론 뒤 한 줄

    # 표 출력 서식 문자열이 대부분이다. 쪼개면 오히려 읽기 나쁘다.
    "E501",   # 줄 길이

    # `l` `I` `O`. 좁은 스코프의 수학 표기라 의미가 명확하다.
    "E741",   # 모호한 변수명

    # `n = lambda v: ...` 같은 지역 포맷터. def 로 바꾸면 장황해진다.
    "E731",   # lambda 대입

    # sys.stdout.reconfigure 처럼 import 전에 와야 하는 런타임 설정 뒤에 온다.
    "E402",   # import 가 파일 최상단이 아님
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ★ tools/ 는 패키지가 아니라 단독 스크립트 모음이다(commit_policy · golden ·
#   docnum_check ...). 그걸 테스트하려고 test_commit_policy.py 가
#   sys.path.insert 를 하고 있었다. 선언으로 옮긴다 — 테스트 파일이
#   경로를 조작하기 시작하면 다음 테스트도 따라 한다.
# ★ src 를 더한다. `src/contracts/` 는 파트 간 계약 계층이고
#   테스트가 import 한다. 테스트 파일에서 sys.path 를 조작하면
#   test_layering 이 막는다 — 경로 조작은 선언으로 옮긴다.
pythonpath = ["tools", "src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "olefile>=0.47",
]



# ── 토치 인덱스 ────────────────────────────────────────────────
# ★ 2026-08-27. CPU 전용으로 고정했다. 기본 인덱스의 torch 는 CUDA 휠
#   3~5GB 를 끌고 오는데 팀 5인 중 4인이 그램(GPU 없음)이고 CI 러너도
#   GPU 가 없다. 다섯 중 넷과 CI 가 받자마자 버린다. CPU 휠은 200MB 대다.
#   이 설정으로 전원이 `uv sync --all-extras` 하나만 쓴다.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
