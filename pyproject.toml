[project]
name = "fire-lane"
version = "0.1.0"
description = "소방차 진입로 판정 및 우회경로 탐색 서비스 (인공지능사관학교 7기 3반 AI보안반 파이널 프로젝트)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "opencv-python>=4.9.0.80",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "ultralytics>=8.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "networkx>=3.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "geoalchemy2>=0.14.0",
    "requests>=2.31.0",
    "pyshp>=2.3.0",
    "scipy>=1.13.0",
    "rasterio>=1.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
]
