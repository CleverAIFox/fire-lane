<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{title}</title>
<!--
  ★ 이것은 **와꾸**다. 내용은 한 글자도 없다 — `docs/proposal.md` 가 정본이고
    `tools/build_proposal.py` 가 아래 자리표시자 일곱을 채워 `web/proposal.html`
    을 굽는다. 손으로 고치는 것은 **이 파일**이고 생성물이 아니다.

  ★ 왜 와꾸를 렌더러 밖으로 뺐나 — 토트는 HTML 와꾸를 `html.js` 안에 문자열로
    들고 있어서 스타일 한 줄을 고치려면 조립 코드를 열어야 했다. 하토르는
    `proposal.template.html` 로 뗐고 그쪽이 맞다: **와꾸를 고치는 손과 조립을
    고치는 손이 다르다.**

  자리표시자 일곱 — 하나라도 없으면 굽는 쪽이 터진다
    title · stamp · built · tabs · toc · panes · script

  ★ 이 주석에 자리표시자를 **중괄호째 적지 않는다.** 처음에 적었더니 굽는 쪽의
    `replace` 가 주석까지 채워서 **표 56이 112, 그림 24가 48** 로 나왔다.
    완전성 자가 그것을 잡았다 — 바이트 대조였으면 「커밋된 것과 재생성 결과가
    같이 틀려서」 영원히 조용했을 자리다.
-->
<!-- ★ 글꼴 스택의 정본은 `tools/svg_fit.py` 의 FONT 하나다(MASTER §17-1).
     여기서 다른 글꼴을 고르면 그림과 화면이 갈린다 — 처음 판은 Google Fonts 에서
     딴 글꼴을 들고 왔고 `test_sources_of_truth` 가 그것을 물었다. 내려받는 자리도
     종전 뷰어가 쓰던 jsdelivr 그대로 둔다 — 새 바깥집을 안 만든다. -->
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#1e293b; --dim:#64748b; --line:#e2e8f0;
    --head:#0f172a; --accent:#e8562f; --soft:#f8fafc; --code:#f1f5f9;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.78 Pretendard, system-ui, sans-serif;
    letter-spacing:-.011em; -webkit-font-smoothing:antialiased;
  }
  code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:.88em; letter-spacing:0}
  code{background:var(--code); padding:.1em .35em; border-radius:3px}

  /* ── 머리 ── */
  header{border-bottom:1px solid var(--line); padding:26px 0 18px}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px}
  h1.doc{margin:0; font-size:30px; font-weight:700; color:var(--head);
    letter-spacing:-.02em}
  .meta{margin-top:8px; color:var(--dim); font-size:12.5px}
  .meta b{color:var(--ink); font-weight:600}
  .dl a{color:var(--accent); text-decoration:none; font-weight:600}
  .dl a:hover{text-decoration:underline}

  /* ── 칸(탭) — CSS 라디오. 자바스크립트가 없어도 선다 ── */
  .tabs{display:flex; gap:4px; margin-top:18px; flex-wrap:wrap}
  .tabs label{padding:8px 16px; border:1px solid var(--line); border-bottom:none;
    border-radius:7px 7px 0 0; cursor:pointer; font-size:13.5px; font-weight:600;
    color:var(--dim); background:var(--soft)}
  input[name=pane]{position:absolute; opacity:0; pointer-events:none}
  .pane{display:none}

  /* ★ 2026-10-19. **칸을 켜는 규칙이 없었다.** 아래 본문의 §526 주석이
       규칙을 `#tN:checked ~ main #pN` 이라고 적어뒀는데 CSS 에 그 줄이
       없어, `.pane{display:none}` 만 남아 **네 칸이 전부 꺼진 채** 떴다.
       화면은 하얗고 콘솔은 깨끗하고 관문 셋은 초록이었다 — 아무것도
       안 깨졌다. 그냥 없었다. 주석이 규칙을 기억하고 실물이 안 들고
       있는 것은 §534-4(`SPAN_INVERSION`)와 같은 병이다.
     ★ 넷으로 **열거**한다. 다섯째 Part 가 생기면 이 줄들은 조용히 그
       칸을 안 켠다 — 그래서 PLAN `proposal-renders` 가 지어진 화면의
       `.pane` 수와 이 규칙 수를 **센다.** 열거는 세는 관문과 함께만 둔다. */
  #t0:checked ~ main #p0,
  #t1:checked ~ main #p1,
  #t2:checked ~ main #p2,
  #t3:checked ~ main #p3{display:block}

  /* ★ 보루. 라디오에 `checked` 가 하나도 안 붙어도 첫 칸은 켠다.
       **빈 화면은 내보내지 않는다.** 위 열거가 빗나가는 날에도 사람은
       무언가를 본다 — 조용한 하얀 화면보다 낫다. */
  body:not(:has(input[name=pane]:checked)) #p0{display:block}

  /* ★ 켜진 탭이 어느 것인지 보이게. 안 그러면 네 칸 중 어디에 있는지
       사람이 못 센다 — 그것도 화면이 거짓말하는 쪽이다. */
  #t0:checked ~ header label[for=t0],
  #t1:checked ~ header label[for=t1],
  #t2:checked ~ header label[for=t2],
  #t3:checked ~ header label[for=t3]{
    color:var(--head); background:var(--bg); border-color:var(--dim)}

  /* ── 본문 ── */
  main{display:grid; grid-template-columns:260px minmax(0,1fr); gap:38px;
    max-width:1180px; margin:0 auto; padding:26px 24px 80px}
  nav{position:sticky; top:18px; align-self:start; max-height:88vh; overflow:auto;
    font-size:13px; border-left:2px solid var(--line); padding-left:14px}
  nav a{display:block; color:var(--dim); text-decoration:none; padding:3px 0}
  nav a:hover{color:var(--accent)}
  nav .d3{font-weight:600; color:var(--ink); margin-top:10px}
  nav .d4{padding-left:12px; font-size:12.5px}

  article h2{font-size:23px; font-weight:700; color:var(--head);
    margin:46px 0 14px; padding-bottom:9px; border-bottom:2px solid var(--head)}
  article h3{font-size:18.5px; font-weight:700; color:var(--head); margin:38px 0 12px}
  article h4{font-size:15.5px; font-weight:600; color:var(--head); margin:26px 0 9px}
  article h5{font-size:14px; font-weight:600; color:var(--dim); margin:18px 0 7px}
  article p{margin:0 0 11px}
  article img{max-width:100%; height:auto; display:block; margin:16px auto;
    border:1px solid var(--line); border-radius:5px}

  table{border-collapse:collapse; width:100%; margin:16px 0; font-size:13.3px}
  th,td{border:1px solid var(--line); padding:7px 10px; text-align:left;
    vertical-align:top}
  th{background:var(--soft); font-weight:600; color:var(--head)}
  tbody tr:nth-child(even){background:#fcfdfe}

  footer{border-top:1px solid var(--line); padding:20px 0 40px; color:var(--dim);
    font-size:12px}

  @media print{
    nav,.tabs,header .meta{display:none}
    .pane{display:block !important}
    article h2{page-break-before:always}
    main{display:block; padding:0}
  }
  @media (max-width:900px){
    main{grid-template-columns:1fr} nav{display:none}
  }
</style>
</head>
<body>
<!-- ★ 2026-10-14 (DECISIONS §526). 라디오는 **여기** 산다 — `<header>` 안이 아니다.
     칸을 켜는 규칙이 `#tN:checked ~ main #pN` 이고 `~` 는 **뒤 형제**만 본다.
     `<header>` 안에 두면 `main` 은 input 의 형제가 아니라 header 의 형제라
     규칙이 아무것도 안 맞고 **네 칸이 전부 꺼진 채** 발행됐다. -->
{radios}
<header><div class="wrap">
  <h1 class="doc">{title}</h1>
  <!-- ★ 2026-10-09 (§440-8). 여기 있던 「정본 docs/proposal.md · 이 화면은
       생성물이다 · sha256:… · 구운 날」 한 줄을 **지웠다.** 이 화면을 읽는
       사람은 심사위원이고, 그에게 정본이 어디 있고 누가 굽는지는 **일이 아니다.**
       날짜는 표지(`docs/proposal.md` 의 「작성 … · 최종 수정 …」)가 이미 든다.
       지문은 아무도 안 읽었다 — `build_proposal --check` 는 화면을 **다시 구워**
       통째로 대므로 심은 지문이 말해 주는 것이 없었다. -->
  <!-- ★ 2026-10-09 (DECISIONS §444 · PLAN #142). 내려받기 두 줄을 뺐다.
       종전에는 PDF · DOCX 가 **제출용 내려받기**로 남아 `stage_pages.py` 가
       배포 때 둘을 올렸다. 둘 다 은퇴했으므로 그 자리는 **404 로 가는 링크**다 —
       심사위원이 누를 자리이므로 빈 링크를 두지 않는다. 인쇄가 필요하면
       브라우저 인쇄로 뜨고, 그 자리를 다시 만들 때는 굽는 도구가 먼저다. -->
  <div class="tabs">{tabs}</div>
</div></header>

<main>
  <nav>{toc}</nav>
  <article>{panes}</article>
</main>

<footer><div class="wrap">
  Fire-Lane · 소방차 진입 가능 경로 판정 지원 시스템 ·
  이 문서가 드는 수치의 정본은 <code>data/golden/segments.fingerprint.json</code> 이다.
</div></footer>
{script}
</body>
</html>
