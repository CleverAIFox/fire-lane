# 엄격 린트 설정의 정본. CI(contract-strict)와 tools/verify.sh 가 함께 읽는다.
#
# ★ 2026-09-02 신설. 종전에는 contract.yml 이 인자를 들고 verify.sh 가
#   grep 으로 긁었다. 그 grep 이 주석의 "손대장 110 → 8" 을 규칙 이름으로
#   물어 죽었다 — **텍스트를 긁는 것 자체가 또 하나의 사본**이었다.
#
#   같은 사고를 세 층에서 세 번 겪었다.
#     2026-08-23  verify.sh 가 CI 검사 다섯을 안 돌았다        값을 손으로 채움
#     2026-09-02  verify.sh 가 contract-strict 를 안 돌았다    값을 손으로 채움
#     2026-09-02  그 인자를 grep 으로 긁다 주석을 물었다        구조를 고침
#   두 번은 우연이고 세 번은 구조다.
#
# ★ `@인자파일` 이 아니라 TOML 이다. ruff 의 `@파일` 은 주석을 **경로로**
#   읽어서 "왜" 를 적을 수 없다. 이 저장소는 값 옆에 근거를 둔다.
#
# ── 왜 --select ALL 이 아닌가 (2026-08-30) ──────────────────
#   재보니 1,694건이었고 상위 5개가 전부 오탐이었다 —
#   S101 445(테스트의 assert) · PLC0415 197(의도된 지연 import) ·
#   PLR2004 142(params.py 가 정본인 상수) · N806 121(수학 관례 대문자) ·
#   CPY001 101(안 쓰기로 한 저작권 헤더).
#   끌 것을 나열하지 않고 켤 것을 고른다. 손대장 110 → 8 이 됐다.
#
# ── 왜 이 여덟만 끄나 ───────────────────────────────────────
#   RUF001 · RUF002 · RUF003   한글 문서·주석의 전각 문자(글·docstring·주석).
#           우리 코드는 한글로 쓴다 — 전각 괄호·따옴표가 **의도**다.
#           ★ 2026-10-03. 종전에는 `RUF001·002·003` 으로 줄여 적었다. 줄이면
#             `RUF002` 를 grep 해도 안 나오고, 그러면 사유가 적혀 있어도
#             **찾을 수가 없다.** `test_strict_lint_ignores_carry_a_reason`
#             이 이 줄에서 제 첫 빨간불을 냈다 — 새 관문이 **옛 빚**을 물었다.
#   PTH123          open() → Path.open(). 표준 관용이라 바꿀 이유가 없다
#   RUF005          리스트 이어붙이기 스타일
#   RUF007          zip(strict=) 권고. 길이가 같음이 이미 보장된 자리
#   RUF059          안 쓰는 언패킹 변수
#   RUF100          안 쓰는 noqa. 환경마다 달라 오탐이 난다
# ★ pyproject.toml 을 잇는다. `--config` 는 설정을 **대체**하므로 이 줄이
#   없으면 [tool.ruff.lint.isort] 등 기존 설정을 잃고 I001 이 오탐으로
#   쏟아진다. CI 의 CLI 인자 방식은 pyproject 위에 얹히는 것이었는데
#   --config 는 갈아끼우는 것이라 동작이 다르다. 2026-09-02 리허설이 잡았다.
extend = "pyproject.toml"

# ── 보안 규칙 S (bandit) 을 켠 사유 — 2026-10-03, DECISIONS §371 ─
#   이 저장소는 **평문 키를 커밋한 적이 있다.** 그 사고 뒤로 `gitleaks` ·
#   `.env` 분리 · `key.js` 생성이 붙었지만, 그것들은 전부 **비밀이 새는
#   경로**만 본다. 「코드가 위험한 꼴로 쓰였는가」를 보는 관문은 0 이었다.
#
#   켜기 전에 쟀다 — 3,094건. 그중 2,900이 `S101`(테스트의 assert)이고
#   174가 `S603/S607`(부분경로 subprocess)이다. 남은 **스물**이 실물이고,
#   그 스물을 이 배치가 다 처리한 뒤에 켰다. 켤 때 빨간불이면 아무도 안 켠다.
#
#   처리 방식은 셋이었다 — **고치고 · 여미고 · 사유를 적고.**
#     고침   `dupcheck` md5 에 `usedforsecurity=False` · `serve.py` 기본을
#            `127.0.0.1` 로 (능력은 `--host` 로 남긴다)
#     여밈   `shardseal._ident`(쌍따옴표 배가) · `docx_figs._xml`(DTD·엔티티 거부)
#            · `matchcheck` url 접두 검사
#     사유   삼키는 except 일곱 자리에 **왜 삼키는지**를 적었다. `S110/S112`
#            는 1족(무음 통과)의 ruff 쪽 이름이고, 사유 없는 삼킴은
#            `suppress` 래칫이 따로 센다 — 두 관문이 같은 축을 양쪽에서 든다.
#
# ★ **이 ignore 목록은 저절로 자라지 못한다.** `test_guards.py::
#   test_strict_lint_ignores_carry_a_reason` 가 「모든 끈 규칙이 이 파일 안
#   주석에 이름으로 적혀 있는가」를 든다. 사유를 안 적으면 빨간불이다 —
#   `.ruff-strict.toml` 이 「끄는 근거를 각각 적는다」고 선언한 것의 강제자다.
#
# ── 왜 이 셋만 끄나 (S) ─────────────────────────────────────
#   S101    테스트의 `assert`. 2,900건 중 2,892가 tests/ 이고, 남은 여덟은
#           `jsonkeys._selftest` 의 넷과 `spec and spec.loader` 불변식 셋,
#           `actionpin` 정규식 불변식 하나다. **`-O` 로 안 돌린다** —
#           돌리는 자리가 CI·verify·Dockerfile 어디에도 없다
#   S603    `subprocess` 호출 자체. 이 저장소의 174건은 전부 **목록 인자**
#           꼴이고 `shell=True` 가 0 이다(`test_guards` 가 따로 든다).
#           목록 인자는 셸을 안 거치므로 주입면이 없다
#   S607    부분 경로(`git` 말고 `/usr/bin/git`). 절대경로를 박으면 WSL ·
#           macOS · CI 컨테이너에서 **갈린다.** 이식성이 더 중요하다
[lint]
select = ["B", "RUF", "PTH", "I", "UP", "DTZ", "S"]
ignore = ["RUF001", "RUF002", "RUF003", "PTH123",
          "RUF005", "RUF007", "RUF059", "RUF100",
          "S101", "S603", "S607"]

# ── 파일별 — 사유를 옆에 둔다 ───────────────────────────────
#   S311  의사난수. tests/ 의 둘은 **정규식 두 꼴이 갈리는지** 60,000번
#         흔드는 자리다(`test_docx_targets`). 씨앗을 박아 재현한다.
#         암호 용도가 아니다 — `tools/matchcheck` 쪽은 노출된 자리라
#         여기 안 넣고 그 줄에 사유를 적었다
#   S606  `os.execvp`. `test_k2` 가 **가상 터미널(pty)** 을 띄워 `ask` 가
#         사람 입력을 어떻게 받는지 본다. `pty.fork` 뒤의 자식은 exec 밖에
#         할 일이 없고, 셸을 거치면 그 시험이 재는 것이 사라진다
[lint.per-file-ignores]
"tests/**" = ["S311", "S606"]
