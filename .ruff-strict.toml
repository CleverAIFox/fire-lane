# 엄격 린트 설정의 정본. CI(contract-strict)와 tools/verify.sh 가 함께 읽는다.
#
# ★ 2026-09-02 신설. 종전에는 contract.yml 이 인자를 들고 verify.sh 가
#   grep 으로 긁었다. 그 grep 이 주석의 "손대장 110 → 8" 을 규칙 이름으로
#   물어 죽었다 — **텍스트를 긁는 것 자체가 또 하나의 사본**이었다.
#
#   같은 사고를 세 층에서 세 번 겪었다.
#     2026-08-23  verify.sh 가 CI 검사 다섯을 안 돌았다        값을 손으로 채움
#     2026-09-02  verify.sh 가 contract-strict 를 안 돌았다    값을 손으로 채움
#     2026-09-02  그 인자를 grep 으로 긁다 주석을 물었다        구조를 고침
#   두 번은 우연이고 세 번은 구조다.
#
# ★ `@인자파일` 이 아니라 TOML 이다. ruff 의 `@파일` 은 주석을 **경로로**
#   읽어서 "왜" 를 적을 수 없다. 이 저장소는 값 옆에 근거를 둔다.
#
# ── 왜 --select ALL 이 아닌가 (2026-08-30) ──────────────────
#   재보니 1,694건이었고 상위 5개가 전부 오탐이었다 —
#   S101 445(테스트의 assert) · PLC0415 197(의도된 지연 import) ·
#   PLR2004 142(params.py 가 정본인 상수) · N806 121(수학 관례 대문자) ·
#   CPY001 101(안 쓰기로 한 저작권 헤더).
#   끌 것을 나열하지 않고 켤 것을 고른다. 손대장 110 → 8 이 됐다.
#
# ── 왜 이 여덟만 끄나 ───────────────────────────────────────
#   RUF001·002·003  한글 문서·주석의 전각 문자. 우리 코드는 한글로 쓴다
#   PTH123          open() → Path.open(). 표준 관용이라 바꿀 이유가 없다
#   RUF005          리스트 이어붙이기 스타일
#   RUF007          zip(strict=) 권고. 길이가 같음이 이미 보장된 자리
#   RUF059          안 쓰는 언패킹 변수
#   RUF100          안 쓰는 noqa. 환경마다 달라 오탐이 난다
# ★ pyproject.toml 을 잇는다. `--config` 는 설정을 **대체**하므로 이 줄이
#   없으면 [tool.ruff.lint.isort] 등 기존 설정을 잃고 I001 이 오탐으로
#   쏟아진다. CI 의 CLI 인자 방식은 pyproject 위에 얹히는 것이었는데
#   --config 는 갈아끼우는 것이라 동작이 다르다. 2026-09-02 리허설이 잡았다.
extend = "pyproject.toml"

[lint]
select = ["B", "RUF", "PTH", "I", "UP", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003", "PTH123",
          "RUF005", "RUF007", "RUF059", "RUF100"]
