# React 내비를 배포한다.
#
# ★ 왜 별도 워크플로인가
#   Pages 는 저장소당 사이트 하나라 어느 워크플로가 돌든 web/ **전체**를
#   올린다. 그래도 **무엇이 바뀌면 다시 올릴 것인가**는 갈라야 한다 —
#   `proposal.yml` 머리말이 적은 그대로다. 내비만 고쳤는데 아무 워크플로도
#   안 돌면 뷰어가 낡은 앱을 본다. 2026-09-02 에 기획서가 그 상태였다.
#
# ★ 넷이 같은 `concurrency: group: pages` 로 직렬화된다. 부분 배포가 서로를
#   덮던 2026-08-31 사고의 해소책은 "워크플로를 줄이는 것"이 아니라
#   "전부 web/ 전체를 올리는 것"이었다. 그 규약을 그대로 따른다.
#
# ★ 빌드는 `.github/actions/build-navi` 가 정본이다. 넷이 같이 쓴다 —
#   블록을 복붙하면 정본이 넷이 되고 반드시 어긋난다(R3).
name: 내비 배포

on:
  push:
    branches: [main]
    paths:
      - 'web/navi/**'
      - '.github/actions/build-navi/action.yml'
      - '.github/workflows/navi.yml'
  workflow_dispatch:

# ★ 2026-09-18 (W1). 본문을 `_deploy.yml` 로 옮겼다. 넷이 job 을 바이트 동일하게
#   들고 있었고 `VWORLD_KEY` 만 pages 에 있었다 — 그래서 셋 중 하나가 나중에
#   돌면 배경지도가 죽은 사이트가 초록으로 배포됐다. 본문이 하나면 불가능해진다.
#   concurrency · 시크릿은 `_deploy.yml` 이 선언한다. **permissions 는 못 한다.**
#
# ★ 2026-09-19. GitHub 은 재사용 워크플로에 **호출자보다 큰 권한을 주지 않는다.**
#   `_deploy.yml` 이 `pages: write` · `id-token: write` 를 선언해도 호출자가 안 주면
#   워크플로 **파일 자체가 무효**가 된다 —
#     Invalid workflow file: ... is requesting 'pages: write, id-token: write',
#     but is only allowed 'pages: none, id-token: none'
#   권한은 위임이 안 되므로 네 호출자가 같은 블록을 든다. **W1 이 없앤 중복과 다르다 —
#   이것은 GitHub 이 강제한 중복이다.** 줄이려면 저장소 기본 권한을 올려야 하는데
#   그건 전 워크플로에 쓰기를 주는 것이라 더 나쁘다(DECISIONS §196).
# ★ 2026-09-19 (2차). 사슬이 **세 칸**이었다 —
#     배포 넷 → `_deploy.yml` → `contract.yml`
#   `_deploy.yml` 이 배포 전에 `contract.yml` 을 재사용 워크플로로 부르고
#   `contract.yml` 은 브리핑 코멘트용 `pull-requests: write` 를 요구한다.
#   권한은 **사슬의 모든 칸이 들어야** 맨 아래가 선다. 두 칸만 고쳤더니
#   같은 오류가 한 칸 아래에서 다시 났다(DECISIONS §196-4).
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      url-suffix: "navi/"
    # ★ 손으로 나열하지 않는다. 나열하면 그것이 다시 넷이 되고 같은 버그가 난다.
    secrets: inherit
