# 기획서 화면을 배포한다.
#
# ★ 액션 단에서 책임을 가른다. Pages 는 저장소당 사이트 하나라 어느
#   워크플로가 돌든 web/ **전체**를 올리지만, **무엇이 바뀌면 다시 올릴
#   것인가**는 갈라야 한다. 기획서를 고쳤는데 아무 워크플로도 안 돌면
#   뷰어가 낡은 파일을 보여준다 — 2026-09-02 에 그 상태였다.
#
# ★ 정본은 docs/proposal.docx 다. 사본을 커밋하지 않고 배포 직전에 옮긴다
#   (tools/stage_pages.py). workflow.html 과 같은 관계다.
name: 기획서 배포

on:
  push:
    branches: [main]
    paths: ['docs/proposal.docx', 'web/proposal.html', 'tools/stage_pages.py']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}proposal.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-extras
      - name: MASTER §12 → web/workflow.html
        run: uv run python tools/render_workflow.py
      - name: 배포 준비 (docs/proposal.docx → web/)
        run: uv run python tools/stage_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
