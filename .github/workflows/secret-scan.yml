name: secret-scan

# 자격증명 유출 검사. **훅과 다른 자리를 맡는다.**
#
#   ~/.githooks/credential-check   커밋 전 · 내 기계 · 스테이지된 것만
#   이 워크플로                     push 후 · 모든 기여자 · **이력 전체**
#
# 겹치는 게 아니다. 훅은 `--no-verify` 로 뚫리고 다른 기계에서는 아예 안 돈다.
# 이쪽은 이미 올라간 뒤에 잡는다. 둘 다 있어야 한다.
#
# ★ fetch-depth: 0 이 핵심이다. 기본값 1 로 받으면 마지막 커밋만 본다.
#   이 저장소에는 V-World 키가 있고, 유출은 과거 커밋에 묻혀 있을 수 있다.
#   지운 커밋도 이력에 남는다 — 그래서 이력 전체를 받는다.
#
# ★ 규칙이 훅과 갈리면 안 된다. 어느 쪽을 믿을지 몰라지기 때문이다.
#   `.gitleaks.toml` 을 두게 되면 `~/.githooks/credential-check` 의 패턴과
#   같은 것을 보게 하고, 한쪽만 고치지 마라.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
