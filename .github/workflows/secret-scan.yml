name: secret-scan

# 자격증명 유출 검사. **훅과 다른 자리를 맡는다.**
#
#   ~/.githooks/credential-check   커밋 전 · 내 기계 · 스테이지된 것만
#   이 워크플로                     push 후 · 모든 기여자 · **그 push/PR 의 커밋 범위**
#   verify.sh 「작업 트리 전수」     지금 트리에 **있나 없나** (§376)
#
# 겹치는 게 아니다. 훅은 `--no-verify` 로 뚫리고 다른 기계에서는 아예 안 돈다.
# 이쪽은 이미 올라간 뒤에 잡는다. 둘 다 있어야 한다.
#
# ★ 2026-10-03 (DECISIONS §376). **셋째 줄이 없었고, 그 빈자리가 실물을 놓쳤다.**
#   위 둘은 **변화량**만 본다 — 훅은 스테이지, 이쪽은 커밋 범위. 그러면
#   「훅이 생기기 전에 이미 트리에 있던 값」은 **둘 다에게 영원히 안 보인다.**
#   §209 가 네 자리를 세고 이력 쪽만 다룬 뒤, `sources.yaml` 의 V-World 키가
#   2026-10-03 까지 작업 트리에 남아 있었다. 트리 전수를 `verify.sh` 가
#   들게 했고(`gitleaks dir`), 그래서 아래 `local-exempt` 선언을 **지웠다**
#   — gitleaks 는 더 이상 로컬에서 못 도는 검사기가 아니다.
#
# ★ 2026-09-21 정정 (DECISIONS §209). 이 자리에 「이력 전체」라고 적혀 있었다.
#   **거짓이었다.** gitleaks-action 은 push 이벤트면 `before..after`, PR 이면
#   그 PR 의 커밋만 본다. `fetch-depth: 0` 은 그 범위를 계산하려고 받는 것이지
#   전부를 훑는 것이 아니다. 범위가 이름보다 좁고 그것이 선언돼 있지 않았다.
#
#   이력 전수는 로컬에서 잰다 ——
#       gitleaks git --config .gitleaks.toml --log-opts="origin/main" --redact
#   2026-09-21 실측 — **값 하나가 네 자리에** 있다. V-World 키
#   (web/config.js · web/index.html · sources.yaml · sources.yaml.bak_20260817,
#   2026-08-09~08-17). DECISIONS §146 이 감수한 그것이고 그 밖에는 없다.
#   이 워크플로를 이력 전체로 넓히면 그 넷 때문에 영원히 빨갛다 — 그래서
#   **범위를 넓히지 않고 선언을 좁혔다.**
#
#   ★ 2026-10-03 (§376). 그 판단은 **이력에 대해서는 지금도 맞다.** 틀린 것은
#     네 자리를 세고 **「이력」으로만 적은 것**이다. 넷 중 `sources.yaml` 은
#     이력이 아니라 **작업 트리**였다 — 그래서 §146 의 비용·이득 계산(되쓰기가
#     공개 해시를 다 바꾼다)이 애초에 적용되지 않는 자리였고, 그냥 한 줄
#     고치면 되는 것이었다. 2026-10-03 에 고쳤다.
#     이력 넷 중 남은 셋은 그대로 감수한다 — 폐기된 키이고 되쓰기 비용이 크다.
#
# ★ 규칙이 훅과 갈리면 안 된다. 어느 쪽을 믿을지 몰라지기 때문이다.
#   `.gitleaks.toml` 을 두게 되면 `~/.githooks/credential-check` 의 패턴과
#   같은 것을 보게 하고, 한쪽만 고치지 마라.

on:
  # ★ 2026-10-12 (DECISIONS §504). **push 에 가지 필터를 건다.** 종전에는
  #   필터가 아예 없어서 **새로 만든 가지의 첫 푸시**에도 깨어났다. 그 판은
  #   이벤트가 주는 `before` 가 전부 0인 SHA 고, `gitleaks-action` 은 그 값으로
  #   커밋 범위를 만든다(머리말 셋째 줄 — 「그 push/PR 의 커밋 범위」).
  #   범위가 안 서면 그 단계가 **12~18초에 죽는다.**
  #
  #   봉인 가지(`feat/seal-<sha>`)는 **매 판 새로 만들어 한 번만 미는** 가지라
  #   언제나 첫 푸시다 — 그래서 봉인만 빨갰다. 2026-10-12 에 PR #321(12초) ·
  #   #322(16초) · #323(18초) 이 연달아 죽었고, 열차는 그때마다 봉인 PR 을
  #   닫았다. **봉인이 part/infra 에 세 판 연속 안 들어갔다.**
  #
  #   같은 커밋의 `pull_request` 판은 **초록이었다**(#322 의 `#1479`). 범위가
  #   base..head 로 서기 때문이다. 그물이 안 줄고 push 판만 없어진다.
  #
  #   ★ `part/**` 는 남긴다 — `part/*` 직접 커밋은 룰셋을 우회하므로(MASTER §4)
  #     PR 이 없고, 그 push 판이 **유일한 그물**이다. `contract.yml` 이 같은
  #     이유로 같은 자리를 남겨 뒀다.
  push:
    branches: [main, dev, 'part/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ★ 2026-10-10 (DECISIONS §457). 이 파일에 `concurrency` 블록이 **아예 없었다**
#   (워크플로 넷 중 유일). `on: push:` · `pull_request:` 둘 다 가지 필터가 없어서
#   **PR 이 열린 가지에 푸시하면 gitleaks-action 과 `treescan.sh` 넷이 두 벌 돌았다.**
#   `contract.yml` 이 W1(§344)에서 닫은 길이 여기 그대로 열려 있었다.
# ★ 취소해도 안전하다 — 마지막 푸시의 결과만 의미가 있다(§344 와 같은 사유).
# ★ 2026-10-12 (DECISIONS §505). `github.event_name` 을 더한다 — 사유는
#   `contract.yml` 의 같은 자리에.
concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15      # ★ 상한. 사유는 `contract.yml` 의 `contract-shared` 머리에
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: { fetch-depth: 0 }
      # ★ 2026-10-03 (§376). 종전 이 자리에 `# local-exempt: gitleaks` 가 있었다. 지웠다 — `verify.sh` 가 「비밀값 — 작업 트리 전수」로 같은 검사기를 로컬에서 돈다. 범위는 여전히 다르다(여기는 커밋 범위 · 거기는 트리) 그러나 `gate_parity` 는 **검사기 단위**로 맞추므로, 로컬에서 도는 검사기를 「로컬에서 못 돈다」고 적으면 그 선언이 거짓말이 된다. 커밋 시점 방어는 전역 훅 `~/.githooks/credential-check` 가 들고, 그 훅이 실제로 불리는지는 `verify.sh` 의 「훅 전역 연결」 단계와 `dms.py::hook` 이 본다
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ★ 2026-10-04 (§381). **범위가 다른 둘을 같은 문으로 돌린다.** 위 액션은
      #   커밋 범위를 보고, 아래는 **작업 트리 전수**를 본다 — 훅보다 먼저 들어온
      #   값은 범위로는 영원히 안 보인다(§376 이 V-World 키로 겪은 그것이다).
      #   로컬과 **같은 스크립트**를 부른다. 다른 명령을 적으면 둘이 갈린다.
      - name: 비밀값 — 작업 트리 전수
        run: |
          # ★ 2026-10-06 (DECISIONS §406 · PLAN #152). 판을 여기 안 적는다.
          #   정본은 `tools/treescan.sh` 의 `GITLEAKS_VER` 하나이고 그 도구가
          #   스스로 깐다 — 종전에는 이 줄이 8.28 을 깔고 사람 기계는 apt 의
          #   8.16 으로 돌아 **같은 트리를 다른 규칙 엔진이 봤다.**
          bash tools/treescan.sh --install
          bash tools/treescan.sh --engine
          bash tools/treescan.sh --selftest
          bash tools/treescan.sh
