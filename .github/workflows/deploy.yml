# deploy.yml — 배포. **워크플로 하나, 본문 하나.**
#
# ── 왜 하나인가 (2026-09-23 · DECISIONS §224) ────────────────────────────────
#   종전에는 여섯이었다 —
#       사이트 배포 (입구 · 데이터)   pages.yml
#       내비 배포                     navi.yml
#       협업 방침 배포                docs.yml
#       기획서 배포                   proposal.yml
#       배포 시운전                   deploy-dry.yml
#       Deploy — shared body (0 runs) _deploy.yml
#
#   **여섯이 같은 사이트 한 벌을 올렸다.** Pages 는 저장소당 사이트가 하나라
#   어느 것이 돌든 `web/` 을 통째로 올린다(08-31 부분 배포 사고의 해소책이
#   그것이었다). 그래서 이름들이 가리킨 것은 **배포 대상이 아니라 촉발
#   조건**이었는데, 화면에는 「무엇을 배포하는가」 처럼 보였다. 실제로
#   2026-09-23 에 「데이터 배포를 왜 해야 하느냐」 는 물음이 나왔다 —
#   **이름이 거짓을 말하면 사람이 구조를 오해한다.**
#
#   그리고 촉발 조건은 `paths` 한 블록이면 된다. 워크플로를 가를 이유가
#   아니었다. 가른 값은 컸다 —
#     · 본문 4벌 중복(W1 이 `_deploy.yml` 로 봉합) · 권한 블록 6벌
#     · 데이터와 코드가 같이 바뀌면 둘이 큐에 들어가 하나가 취소(⊘)됐다
#     · `_deploy.yml` 이 `0 workflow runs` 로 사이드바에 상주(§101-4)
#     · 「배포 시운전」 이 **배포가 아닌데** 배포 목록에 섞여 있었다
#
#   하나면 그 전부가 사라진다. 본문이 하나이므로 **W1 이 닫은 2족(정본 넷)이
#   구조적으로 되살아날 수 없다** — 재사용 워크플로로 뺄 중복 자체가 없다.
#
# ── push 와 PR 이 같은 파일이다 ────────────────────────────────────────────
#   `push`(main)  → 짓고 **올린다**. 앞에 `contract` 게이트가 선다.
#   `pull_request` → 짓고 **안 올린다**(시운전). 배포 본문이 main 에 닿기 전에
#                    깨진 것을 본다 — v0.18 에서 배포 넷이 함께 죽고서야
#                    알았던 그 자리다(§196 · §217-5).
#   시운전을 **별도 워크플로로 두지 않는다.** 배포가 아닌 것이 배포 목록에
#   서면 목록이 거짓이 되고, 본문이 갈라지면 「PR 에서 통과한 것」과
#   「main 에서 도는 것」이 달라진다.
#
# ── 지우지 마라 ────────────────────────────────────────────────────────────
#   ★ `permissions` 는 여기 있어야 한다. GitHub 은 재사용 워크플로
#     (`contract.yml`)에 **호출자보다 큰 권한을 주지 않는다.** 모자라면 경고가
#     아니라 **파일 무효**다(§196 · §196-4).
#   ★ `secrets: inherit` 를 쓴다. 손으로 나열하면 목록이 곧 갈린다 —
#     `VWORLD_KEY` 가 `pages.yml` 에만 있던 그 버그다(§216-5).
#   ★ `concurrency: group: pages` 를 뺀 채 `workflow_dispatch` 를 겹쳐 돌리면
#     같은 사이트를 동시에 덮어쓴다.
name: 배포

on:
  push:
    branches: [main]
    # ★ 여기 적힌 것은 **「무엇이 바뀌면 다시 올리는가」** 다. 무엇을 올리는지가
    #   아니다 — 올리는 것은 언제나 `web/` 전체다(§12-7).
    # ★ `web/data` 를 빼지 마라. 서버가 없다. 파이프라인이 정적 JSON 을
    #   `web/data` 에 쓰고 내비 · 관제가 `../data/` 로 읽으므로, **데이터를
    #   갱신하는 길은 재배포 하나뿐이다.** 빼면 코드만 새것이고 화면은 옛
    #   판정을 든다.
    # ★ 공유 액션(`build-navi` · `stage-site`)을 넣는다. 그것이 깨지면 배포가
    #   죽는데, 고쳐도 `paths` 에 없으면 **빨간 채로 남는다** — 09-15 에 셋이
    #   다섯 시간 그 상태였다.
    paths:
      - 'web/**'
      - 'docs/MASTER.md'
      - 'docs/proposal.docx'
      - 'tools/render_workflow.py'
      - 'tools/stage_pages.py'
      # ★ 2026-09-24 (PLAN §13 W13-10). `stage_pages` 가 **import 로** 부르는
      #   파일이라 경로 리터럴이 워크플로에 없었고, 그래서 `gate_parity` 도
      #   못 봤다. 이것만 고친 PR 은 그 코드가 **한 번도 안 돈 채** 초록이다.
      - 'tools/proposal_pdf.py'
      - '.github/actions/build-navi/action.yml'
      - '.github/actions/stage-site/action.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    # ★ 시운전은 범위를 넓게 잡는다. 올리지 않으므로 값이 CI 시간뿐이고,
    #   배포를 깨뜨리는 변경은 `.github/**` 어디서든 나온다.
    branches: [main, dev, 'part/**']
    paths:
      - '.github/**'
      - 'web/**'
      - 'docs/MASTER.md'
      - 'docs/proposal.docx'
      - 'tools/render_workflow.py'
      - 'tools/stage_pages.py'
      # ★ 2026-09-24 (PLAN §13 W13-10). `stage_pages` 가 **import 로** 부르는
      #   파일이라 경로 리터럴이 워크플로에 없었고, 그래서 `gate_parity` 도
      #   못 봤다. 이것만 고친 PR 은 그 코드가 **한 번도 안 돈 채** 초록이다.
      - 'tools/proposal_pdf.py'
  # ★ 머지 전에 가지를 골라 태워볼 수 있다. 2026-09-19 에 권한 오류를 두 번
  #   연달아 **릴리즈로** 발견했는데 이것을 쓰면 릴리즈 없이 봤다.
  #   dispatch 는 진짜로 배포하므로 정적 검사가 먼저고 이것은 보조다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

# ★ 사이트가 하나다. 동시에 덮어쓰지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ★ 2026-09-18 (W2). 배포가 검사를 지나게 한다.
  #   종전 실참 — 배포 4종에 `needs:` 도 `workflow_run:` 도 **0건**이었고
  #   contract 와 **병렬로** 돌았다. `workflow_dispatch` 는 검사 0건으로
  #   임의 배포였다. 룰셋이 PR 에는 contract 를 걸지만 그것은
  #   **플랫폼이 배포를 막은 것이 아니다** — 1인 `--admin` bypass ·
  #   수동 실행이 그 밖에 있었다.
  # ★ 검사를 복사하지 않는다. `contract.yml` 을 그대로 부른다 —
  #   PR 이 통과한 것과 **같은** 검사여야 게이트가 뜻이 있다.
  # ★ PR 에서는 안 부른다. contract 는 PR 트리거를 자기가 들고 있어서
  #   여기서 또 부르면 같은 검사가 두 번 돈다.
  gate:
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/contract.yml
    secrets: inherit

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: gate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # ★ 정본은 `.python-version` 하나다 (W3-17). 배포가 게이트와 다른
          #   런타임에서 돌면 초록불이 배포를 보증하지 않는다.
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"          # ★ 핀. 종전에는 셋 다 "그날의 최신" 이었다
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-extras

      - uses: ./.github/actions/stage-site
        with:
          mapbox-token: ${{ secrets.MAPBOX_TOKEN }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5

  # ★ 시운전 — 배포 **직전까지** 같은 본문을 태운다(§217-5 · 옛 PLAN W3-15).
  #   환경(github-pages)을 안 쓴다 — 보호 규칙이 main 밖을 막고, 시운전은
  #   배포가 아니다. 시크릿이 없는 PR(봇 · 포크)에서도 돌도록 토큰이 비면
  #   가짜 pk 로 짓는다 — 어차피 업로드하지 않는다.
  dry:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-extras
      - uses: ./.github/actions/stage-site
        with:
          mapbox-token: ${{ secrets.MAPBOX_TOKEN || 'pk.dry-run-no-secret' }}
      - name: 지은 사이트가 배포할 모양인가
        run: |
          set -e
          for f in index.html workflow.html proposal.html proposal.docx navi/index.html data/navi_graph.json; do
            test -f "web/$f" || { echo "★ web/$f 가 없다 — 배포하면 빠진다"; exit 1; }
          done
          # ★ 2026-09-22. 옛 GIS 지도를 걷어냈다. 입구(index.html)는 관제로 넘기는 한 쪽이다.
          grep -q 'url=navi/?view=ops' web/index.html \
            || { echo "★ web/index.html 이 관제(navi/?view=ops)로 안 넘긴다"; exit 1; }
          for f in js style.css key.js; do
            test ! -e "web/$f" || { echo "★ web/$f 가 남았다 — 옛 지도는 걷어냈다"; exit 1; }
          done
          for f in playbook.html README.md; do
            test ! -e "web/$f" || { echo "★ web/$f 가 남았다 — 배포에 안 실을 것이다(§216-5)"; exit 1; }
          done
          echo "시운전 OK — $(du -sh web | cut -f1)"
