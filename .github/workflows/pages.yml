# 지도를 GitHub Pages 로 배포한다.
#
# 왜 필요한가
#   지혜님도, 심사위원도, 소방서 담당자도 clone·서버실행 없이 URL 하나로 본다.
#   file:// 로 열어 빈 화면을 보는 사고도 원천 차단된다.
#
# 배포되는 것
#   web/ 폴더 전체. index.html + data/*.geojson (약 1.2MB)
#   docs/workflow.html 도 빌드 때 web/ 으로 복사해 함께 올린다 —
#   팀이 매일 읽는 문서라 URL 하나로 열려야 한다(2026-08-31).
#   data/raw 는 .gitignore 로 저장소에 없으므로 애초에 올라가지 않는다.
#
# 켜는 법 (1회)
#   Settings > Pages > Source 를 "GitHub Actions" 로 변경
#   그러면 main 브랜치에 푸시할 때마다 자동 갱신된다.
#   ★ 2026-08-27. gis 트렁크 폐기. 배포 게이트는 main 단독이다 —
#     dev 는 트렁크, main 은 배포 스냅샷이다.
name: 지도 배포

on:
  push:
    branches: [main]
    paths: ['web/**', 'docs/workflow.html']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true      # 연달아 푸시하면 마지막 것만 배포

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 캐시 무효화 스탬프 주입
        # ★ 2026-08-24 신설. 종전에는 publish_web.py 가 저장소의
        #   index.html 을 직접 고쳤다. 그 파일은 CODEOWNERS 상 UI 담당과
        #   공동 소유라, GIS 가 파이프라인만 돌려도 UI 리뷰가 걸렸다.
        #   스탬프가 내용 해시라 **판정이 바뀐 그 순간에만** 걸린다.
        #
        #   저장소는 ?v=BUILD 로 두고 여기서 찍는다. 값은 view.json 의
        #   build 로, publish_web.py 가 쓰고 js/data.js 가 읽는 그 값이다.
        #   정본이 하나다.
        run: |
          B=$(sed -n 's/.*"build": *"\([0-9a-f]*\)".*/\1/p' web/data/view.json)
          test -n "$B" || { echo "view.json 에 build 가 없다"; exit 1; }
          echo "스탬프 $B"
          sed -i "s/?v=BUILD/?v=$B/g" web/index.html
          grep -c "?v=$B" web/index.html

      - name: 협업 방침 문서 동봉
        # ★ 2026-08-31 신설. `docs/workflow.html` 은 팀이 매일 읽는 문서인데
        #   저장소 안에만 있어서 **클론하거나 raw 로 열어야 했다.** HTML 인데
        #   렌더링이 안 되는 상태였다.
        #
        #   ★ 복사는 CI 가 한다. 사람이 손으로 두 곳을 유지하면 그것이 곧
        #     낡을 자리다 — `web/config.js` 가 `seg/params.py` 의 사본인 것과
        #     같은 관계이되(R3), 여기서는 **사람이 사본을 만들지 않는다.**
        #   ★ 정본은 `docs/workflow.html` 이다. `web/workflow.html` 은
        #     빌드 산출물이며 저장소에 커밋하지 않는다.
        run: |
          cp docs/workflow.html web/workflow.html
          echo "동봉: $(wc -c < web/workflow.html) bytes"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
