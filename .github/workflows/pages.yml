# 지도와 협업 방침 문서를 GitHub Pages 로 배포한다.
#
# 왜 필요한가
#   지혜님도, 심사위원도, 소방서 담당자도 clone·서버실행 없이 URL 하나로 본다.
#   file:// 로 열어 빈 화면을 보는 사고도 원천 차단된다.
#
# 배포되는 것
#   web/ 폴더 전체. index.html + data/*.geojson (약 1.2MB)
#   web/workflow.html 은 `docs.yml` 이 MASTER §12 에서 생성해 커밋한다.
#   여기서는 배포만 한다 — 생성과 배포를 가르지 않으면 Pages 사이트
#   하나를 두 워크플로가 덮어쓴다(2026-08-31).
#   data/raw 는 .gitignore 로 저장소에 없으므로 애초에 올라가지 않는다.
#
# 켜는 법 (1회)
#   Settings > Pages > Source 를 "GitHub Actions" 로 변경
#   그러면 main 브랜치에 푸시할 때마다 자동 갱신된다.
#   ★ 2026-08-27. gis 트렁크 폐기. 배포 게이트는 main 단독이다 —
#     dev 는 트렁크, main 은 배포 스냅샷이다.
name: 지도 배포

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false     # 협업 방침 배포와 직렬화한다

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-extras

      - name: MASTER §12 → web/workflow.html
        # ★ 여기서도 생성한다. 이 워크플로도 web/ 전체를 올리므로
        #   생성하지 않으면 낡은 협업 방침이 배포된다.
        run: uv run python tools/render_workflow.py

      - name: 캐시 무효화 스탬프 주입
        # ★ 2026-08-24 신설. 종전에는 publish_web.py 가 저장소의
        #   index.html 을 직접 고쳤다. 그 파일은 CODEOWNERS 상 UI 담당과
        #   공동 소유라, GIS 가 파이프라인만 돌려도 UI 리뷰가 걸렸다.
        #   스탬프가 내용 해시라 **판정이 바뀐 그 순간에만** 걸린다.
        #
        #   저장소는 ?v=BUILD 로 두고 여기서 찍는다. 값은 view.json 의
        #   build 로, publish_web.py 가 쓰고 js/data.js 가 읽는 그 값이다.
        #   정본이 하나다.
        run: |
          B=$(sed -n 's/.*"build": *"\([0-9a-f]*\)".*/\1/p' web/data/view.json)
          test -n "$B" || { echo "view.json 에 build 가 없다"; exit 1; }
          echo "스탬프 $B"
          sed -i "s/?v=BUILD/?v=$B/g" web/index.html
          grep -c "?v=$B" web/index.html

      - name: 배포 준비 (docs/proposal.docx → web/)
        run: uv run python tools/stage_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
