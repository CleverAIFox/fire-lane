# _deploy.yml — Pages 배포의 **정본**. 네 워크플로가 이것을 부른다.
#
# ★ 왜 생겼나 (2026-09-18 · W1)
#   (2026-09-22 — 옛 GIS 지도와 그 V-World 키 `web/key.js` 는 걷어냈다. 아래는 경위다.)
#   `pages` · `docs` · `navi` · `proposal` 넷이 job 본문을 **바이트 동일**하게
#   들고 있었다(334줄). 다른 것은 넷뿐 — 이름 · paths · environment.url 접미사 ·
#   그리고 **VWORLD_KEY 가 pages.yml 에만 있었다.**
#
#   `stage_pages.py` 는 키가 없으면 경고만 찍고 빈 `web/key.js` 를 쓰고 rc=0 을
#   낸다. 넷 다 `web/` 전체를 업로드하므로, 나머지 셋 중 하나가 나중에 돌면
#   **배경지도가 죽은 사이트가 배포되고 워크플로는 초록**이었다.
#   `docs.yml` 머리말이 "어느 쪽이 나중에 돌아도 결과가 완전하다" 고 적었는데
#   이 축에서 거짓이었다 — 09-05 내비 누락과 같은 형태다.
#
#   본문이 하나가 되면 그 사고가 **구조적으로 불가능**해진다. 정본이 넷이면
#   반드시 어긋난다(MASTER §18-3).
#
# ★ `secrets: inherit` 를 쓴다. 호출부마다 시크릿을 손으로 나열하면 그것이
#   다시 넷이 되고, 이번에 잡은 버그가 그대로 재발한다.
#
# ★ Actions 사이드바에 항목 하나가 는다(§101-4 가 경계한 그 화면). 대신
#   중복 본문 4벌이 사라진다. `_` 접두사로 배포 넷과 시각적으로 가른다.
#   이 파일은 `workflow_call` 전용이라 사람이 직접 돌릴 수 없다.
# ★ Actions 사이드바에 **항상 뜨고 항상 `0 workflow runs`** 다. 고장이 아니다 —
#   재사용 워크플로는 호출자의 run 안에서 돌기 때문이다. 그리고 재사용
#   워크플로는 `.github/workflows/` 밖에 못 둔다(GitHub 규칙). 지우면 배포
#   4종에 같은 본문이 4벌 복사되어 W1 이 닫은 2족이 되살아난다.
#   이름으로 배포들 옆에 세우고 왜 0 runs 인지를 이름에 적는다.
name: Deploy — shared body (0 runs by design)

on:
  workflow_call:
    inputs:
      url-suffix:
        description: "environment.url 에 붙일 접미사 (입구='' · workflow.html · navi/ · proposal.html)"
        type: string
        required: false
        default: ""
      dry-run:
        description: "true 면 배포 직전까지만(업로드 · 배포 없음) — PR 시운전(§217-5)"
        type: boolean
        required: false
        default: false

# ★ 2026-09-19 (2차). 사슬이 **세 칸**이었다 —
#     배포 넷 → `_deploy.yml` → `contract.yml`
#   `_deploy.yml` 이 배포 전에 `contract.yml` 을 재사용 워크플로로 부르고
#   `contract.yml` 은 브리핑 코멘트용 `pull-requests: write` 를 요구한다.
#   권한은 **사슬의 모든 칸이 들어야** 맨 아래가 선다. 두 칸만 고쳤더니
#   같은 오류가 한 칸 아래에서 다시 났다(DECISIONS §196-4).
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

# ★ 넷이 같은 group 을 쓴다. Pages 사이트 하나를 동시에 덮어쓰지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ★ 2026-09-18 (W2). 배포가 검사를 지나게 한다.
  #   종전 실참 — 배포 4종에 `needs:` 도 `workflow_run:` 도 **0건**이었고
  #   contract 와 **발대로** 돌았다. `workflow_dispatch` 는 검사 0건으로
  #   임의 배포였다. 룰셋이 PR 에는 contract 를 걸지만 그것은
  #   **플랫폼이 배포를 막은 것이 아니다** — 1인 `--admin` bypass ·
  #   수동 실행이 그 밖에 있었다.
  # ★ 검사를 복사하지 않는다. `contract.yml` 을 그대로 부른다 —
  #   PR 이 통과한 것과 **같은** 검사여야 게이트가 물지한다.
  # ★ 값: 배포마다 contract 가 한 번 더 돌아 ~2분 느려진다.
  #   릴리즈당 몇 번이니 받을 값이다.
  gate:
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/contract.yml
    secrets: inherit

  deploy:
    if: ${{ !inputs.dry-run }}
    needs: gate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ inputs.url-suffix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # ★ 정본은 `.python-version` 하나다 (W3-17). 배포가 게이트와 다른
          #   런타임에서 돌면 초록불이 배포를 보증하지 않는다.
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"          # ★ 핀. 종전에는 셋 다 "그날의 최신" 이었다
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-extras

      - uses: ./.github/actions/stage-site
        with:
          mapbox-token: ${{ secrets.MAPBOX_TOKEN }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5

  # ★ 2026-09-22 (§217-5 · PLAN W3-15 닫음). PR 시운전 — 배포 **직전까지** 같은 본문을 태운다.
  #   환경(github-pages)을 안 쓴다 — 보호 규칙이 main 밖을 막고, 시운전은 배포가 아니다.
  #   시크릿이 없는 PR(봇 · 포크)에서도 돌도록 토큰이 비면 가짜 pk 로 짓는다 — 업로드하지 않는다.
  dry:
    if: ${{ inputs.dry-run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-extras
      - uses: ./.github/actions/stage-site
        with:
          mapbox-token: ${{ secrets.MAPBOX_TOKEN || 'pk.dry-run-no-secret' }}
      - name: 지은 사이트가 배포할 모양인가
        run: |
          set -e
          for f in index.html workflow.html proposal.html proposal.docx navi/index.html data/navi_graph.json; do
            test -f "web/$f" || { echo "★ web/$f 가 없다 — 배포하면 빠진다"; exit 1; }
          done
          # ★ 2026-09-22. 옛 GIS 지도를 걷어냈다. 입구(index.html)는 관제로 넘기는 한 쪽이다.
          grep -q 'url=navi/?view=ops' web/index.html \
            || { echo "★ web/index.html 이 관제(navi/?view=ops)로 안 넘긴다"; exit 1; }
          for f in js style.css key.js; do
            test ! -e "web/$f" || { echo "★ web/$f 가 남았다 — 옛 지도는 걷어냈다"; exit 1; }
          done
          for f in playbook.html README.md; do
            test ! -e "web/$f" || { echo "★ web/$f 가 남았다 — 배포에 안 실을 것이다(§216-5)"; exit 1; }
          done
          echo "시운전 OK — $(du -sh web | cut -f1)"
