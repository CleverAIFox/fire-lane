# 협업 방침 화면을 MASTER §12 에서 생성해 배포한다.
#
# ★ 2026-09-01 구조 변경. 종전에는 생성물을 봇이 main 에 커밋했다.
#   보호 브랜치에 봇이 밀려면 룰셋에 구멍이 필요했다. 그 구멍을 없애려고
#   배포 시점에 생성한다. 커밋된 web/workflow.html 은 그대로 두며
#   contract 가 재생성 결과와 같은지 본다(test_workflow_html_sync).
#
# ★ Pages 는 저장소당 사이트 하나다. `pages.yml` 과 이 워크플로는 둘 다
#   web/ **전체**를 올린다. 그래서 어느 쪽이 나중에 돌아도 결과가 완전하다.
#   부분 배포가 서로를 덮던 2026-08-31 사고의 해소책이다.
#
# ★ 2026-09-07. 내비 빌드를 여기에도 넣었다. 이 워크플로도 web/ **전체**를
#   올리는데 `web/navi/dist` 는 .gitignore 라 저장소에 없다. 빌드하지
#   않고 올리면 `/navi/` 가 404 가 된다 — 2026-08-31 부분 배포 사고와
#   같은 형태이며, 09-05 에 내비가 생긴 뒤로 계속 그 상태였다.
name: 협업 방침 배포

on:
  push:
    branches: [main]
      # ★ 2026-09-15. **공유 액션을 paths 에 넣는다.** 배포 넷이 전부
      #   `build-navi` 를 부르는데(action.yml 머리말) 그 액션이 깨지면
      #   넷 다 죽는다. 그런데 고쳐도 자기 paths 가 안 걸리면 **빨간 채로
      #   남는다** — 09-15 에 셋이 다섯 시간 그 상태였고, 화면은 멀쩡한데
      #   Actions 목록만 빨개서 진짜 실패와 구별이 안 됐다.
      #   `navi.yml` 은 이미 이렇게 돼 있다. 셋을 맞춘다.
    paths:
      - 'docs/MASTER.md'
      - 'tools/render_workflow.py'
      - '.github/actions/build-navi/action.yml'
  workflow_dispatch:

# ★ 2026-09-18 (W1). 본문을 `_deploy.yml` 로 옮겼다. 넷이 job 을 바이트 동일하게
#   들고 있었고 `VWORLD_KEY` 만 pages 에 있었다 — 그래서 셋 중 하나가 나중에
#   돌면 배경지도가 죽은 사이트가 초록으로 배포됐다. 본문이 하나면 불가능해진다.
#   concurrency · 시크릿은 `_deploy.yml` 이 선언한다. **permissions 는 못 한다.**
#
# ★ 2026-09-19. GitHub 은 재사용 워크플로에 **호출자보다 큰 권한을 주지 않는다.**
#   `_deploy.yml` 이 `pages: write` · `id-token: write` 를 선언해도 호출자가 안 주면
#   워크플로 **파일 자체가 무효**가 된다 —
#     Invalid workflow file: ... is requesting 'pages: write, id-token: write',
#     but is only allowed 'pages: none, id-token: none'
#   권한은 위임이 안 되므로 네 호출자가 같은 블록을 든다. **W1 이 없앤 중복과 다르다 —
#   이것은 GitHub 이 강제한 중복이다.** 줄이려면 저장소 기본 권한을 올려야 하는데
#   그건 전 워크플로에 쓰기를 주는 것이라 더 나쁘다(DECISIONS §196).
# ★ 2026-09-19 (2차). 사슬이 **세 칸**이었다 —
#     배포 넷 → `_deploy.yml` → `contract.yml`
#   `_deploy.yml` 이 배포 전에 `contract.yml` 을 재사용 워크플로로 부르고
#   `contract.yml` 은 브리핑 코멘트용 `pull-requests: write` 를 요구한다.
#   권한은 **사슬의 모든 칸이 들어야** 맨 아래가 선다. 두 칸만 고쳤더니
#   같은 오류가 한 칸 아래에서 다시 났다(DECISIONS §196-4).
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      url-suffix: "workflow.html"
    # ★ 손으로 나열하지 않는다. 나열하면 그것이 다시 넷이 되고 같은 버그가 난다.
    secrets: inherit
