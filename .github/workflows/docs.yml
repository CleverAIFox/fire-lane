# 협업 방침 화면을 MASTER §12 에서 생성해 배포한다.
#
# ★ 2026-09-01 구조 변경. 종전에는 생성물을 봇이 main 에 커밋했다.
#   보호 브랜치에 봇이 밀려면 룰셋에 구멍이 필요했다. 그 구멍을 없애려고
#   배포 시점에 생성한다. 커밋된 web/workflow.html 은 그대로 두며
#   contract 가 재생성 결과와 같은지 본다(test_workflow_html_sync).
#
# ★ Pages 는 저장소당 사이트 하나다. `pages.yml` 과 이 워크플로는 둘 다
#   web/ **전체**를 올린다. 그래서 어느 쪽이 나중에 돌아도 결과가 완전하다.
#   부분 배포가 서로를 덮던 2026-08-31 사고의 해소책이다.
name: 협업 방침 배포

on:
  push:
    branches: [main]
    paths: ['docs/MASTER.md', 'tools/render_workflow.py']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}workflow.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-extras
      - name: MASTER §12 → web/workflow.html
        run: uv run python tools/render_workflow.py
      - name: 캐시 무효화 스탬프 주입
        run: |
          B=$(sed -n 's/.*"build": *"\([0-9a-f]*\)".*/\1/p' web/data/view.json)
          test -n "$B" || { echo "view.json 에 build 가 없다"; exit 1; }
          sed -i "s/?v=BUILD/?v=$B/g" web/index.html
      - name: 배포 준비 (docs/proposal.docx → web/)
        run: uv run python tools/stage_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
