# GIS ↔ UI 계약 검증
#
# 값(폭·판정)은 실측 후 바뀐다. 구조는 안 바뀐다. 그 경계를 여기서 지킨다.
# 깨지면 GIS 쪽이 UI 를 말없이 부순 것이다.
#
# job 이름을 contract 로 고정한다. 브랜치 보호의
# "Require status checks to pass" 목록에 이 이름으로 뜬다.
#
# ★ 2026-08-21 변경 4건
#   1. 트리거를 main 으로 단일화. gis 를 트렁크로 쓰던 것을 정리했다.
#      롱리브드 브랜치는 머지를 이벤트로 만들고, 이벤트가 되면 안 하게 된다.
#   2. ruff 추가. pyproject 에 설정을 다 해놓고 CI 에서 안 돌렸다.
#      로컬에서만 도는 린터는 안 도는 린터다.
#   3. JS 검사를 glob 으로. app.js 를 모듈로 쪼개도 전부 잡힌다.
#      → 2026-08-21 실제로 쪼갰다(web/js/). ES 모듈이라 `node --check` 로는
#        import 해석까지는 못 본다. 그래서 아래에 순환 import 검사를 붙였다.
#   4. web/data 상한 60MB → 40MB. ortho z19 를 버려 31MB → 4MB 가 됐으므로
#      60 은 열 배 여유다. 여유가 크면 경보가 안 울린다.
name: contract

# ★ 2026-08-23. 트리거가 [main] 단독으로 되돌아가 있었다. 두 번째다.
#   08-22 에 `gis` 를 추가하자마자 세 건(ruff 155 · web/data 계보 · 문서 숫자)을
#   잡았다는 기록이 DECISIONS 에 남아 있는데, 워크플로는 main 만 본다.
#   README · MASTER §8 · §12 · CODEOWNERS 는 전부 `gis` 를 정본으로 적고
#   pages.yml 은 [main, gis] 둘 다 배포한다 — 셋이 갈려 있었다.
#   실제 PR 이 gis 로 가는 한, main 단독 트리거는 **검사가 죽은 채 뜨는 초록불**이다.
on:
  push:
    branches: [main, gis]
  pull_request:
    branches: [main, gis]

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 의존성 — uv.lock 이 정본이다
        # ★ 2026-08-24 교체. 종전에는 이랬다.
        #
        #       pip install pytest shapely numpy ruff pyyaml
        #       pip install -e . --no-deps
        #
        #   사유는 "geopandas·rasterio 전부 받으면 CI 가 몇 분씩 늘어난다.
        #   여기서 도는 테스트들은 shapely·numpy 밖에 안 쓴다" 였다.
        #   **그 전제가 이미 거짓이었다** — 로컬 283 vs CI 216. 67개가 CI 에서
        #   한 번도 안 돌았고, 그중 하나가 PR #40 이 2,468줄을 지운 것을 잡을
        #   수 있었다.
        #
        #   그리고 이 목록은 **손으로 관리하는 두 번째 정본**이다. 새 모듈을
        #   쓰는 검사가 들어올 때마다 여기를 같이 고쳐야 했고, 08-23 에
        #   pyyaml 을 뒤늦게 붙인 것이 그 증거다. 이 저장소가 계보·판정·문서·
        #   계층에서 반복해 배운 그것이다 — **정본이 둘이면 반드시 어긋난다.**
        #
        #   `uv.lock` 이 이미 저장소에 있다. 락을 쓰면 CI 와 로컬이 구조적으로
        #   같아지고, 캐시가 걸리면 첫 실행 뒤로는 시간 근거도 사라진다.
        #   `test_ci_env.py` 가 이 구조를 지킨다.
        run: uv sync --frozen --all-extras


      - name: 커밋 정책
        # ★ pre-commit 훅을 안 쓰는 사람·다른 기계를 여기서 막는다.
        #   훅은 로컬 설정이라 클론에 자동 적용되지 않는다.
        run: uv run python tools/commit_policy.py --tracked

      - name: 인코딩·개행
        # ★ .gitattributes 는 커밋 시점에만 개입한다. 이미 들어온 것은
        #   못 잡는다. BOM 이 붙은 CSV 는 첫 컬럼명이 '\ufeffw_ngi' 가
        #   되고, 그것을 아무도 모른 채 파이프라인이 돈다.
        run: uv run python tools/encoding_check.py

      - name: 파이썬 린트
        run: uv run ruff check src tools tests

      - name: JS 문법 검사 (클래식 스크립트)
        # config.js 처럼 모듈이 아닌 파일만 여기서 본다.
        # ★ web/js/**(ES 모듈)은 `node --check` 로 검사되지 않는다 —
        #   Node 는 .js 를 CommonJS 로 읽고 export 에서 실패하면 조용히
        #   넘어간다. 실측: `export const a=1; const b={{{;` → 종료코드 0.
        #   모듈은 아래 js_graph_check 가 --input-type=module 로 본다.
        run: |
          find web -maxdepth 1 -name '*.js' -print0 \
            | xargs -0 -r -n1 -I{} sh -c 'node --check "{}" && echo "OK  {}"'

      - name: JS 부팅 스모크
        # ★ 문법·그래프 검사가 통과해도 실행하면 죽는 경우가 있다.
        #   app.js 분리 중 실제로 2건 나왔다(모듈 최상단 부수효과 ·
        #   스코프를 넘어간 상수 참조). 자세한 것은 도구 헤더 참조.
        run: |
          npm install --no-save jsdom
          node tools/web_boot_check.mjs

      - name: JS 모듈 그래프 검사
        # ★ app.js 1,260줄을 web/js/ 로 쪼갠 뒤 필요해졌다. 파일이 늘면
        #   순환 import 가 생기고, 브라우저에서는 그것이 "지도가 안 뜬다"로만
        #   보인다. 문법 검사로는 안 잡힌다.
        run: node tools/js_graph_check.mjs

      - name: web/data 용량 검사
        run: |
          SIZE=$(du -sm web/data | cut -f1)
          echo "web/data ${SIZE}MB"
          if [ "$SIZE" -ge 40 ]; then
            echo "::error::web/data 가 40MB 를 넘었다. 타일 줌 단계를 줄이거나 외부 호스팅으로 옮길 것"
            exit 1
          fi

      - name: web/data 계보 검사
        # ★ 신설. web/data 는 publish_web.py 산출물인데 계보가 없었다.
        #   ★ 2026-08-22. 이 검사가 오늘 처음 돌았다(CI 가 main 에서만
        #     돌고 실제 작업은 gis 였다). 켜자마자 web/data 와 매니페스트가
        #     어긋난 것을 잡았다. 원인은 tools/web_manifest.py 를 사람이
        #     따로 돌려야 하는 구조였고, 이제 publish 가 직접 쓴다.
        #   data/processed/_manifest.json 은 source_sha256 까지 박아놨으면서
        #   표출 계층에서 그 원칙이 끊겼다. R5(생성물은 입력 지문으로 관리)의
        #   구멍이다. 타일이 어느 정사영상에서 나왔는지 기록이 없었다.
        run: |
          if [ -f web/data/_manifest.json ]; then
            uv run python tools/web_manifest.py --check
          else
            echo "::warning::web/data/_manifest.json 없음 — publish_web.py 실행 필요"
          fi

      - name: web/data 계약 검증
        run: uv run pytest tests/test_contract.py -v

      - name: 방어 로직 · 문서 규약 · 저장소 위생
        # ★ 2026-08-26. 파일을 열거하던 것을 전량으로 바꿨다. `test_doc_style`
        #   이 MASTER §0-1 의 강제자로 지목돼 있는데 CI 가 부르지 않았고,
        #   `test_web_ownership` 등 6개도 같은 상태였다. 열거식은 테스트가
        #   늘 때마다 여기를 고쳐야 하고, 안 고치면 조용히 빠진다.
        run: uv run pytest tests/ -q

      - name: 문서 숫자 대조
        run: |
          if [ -f data/processed/segments.geojson ]; then
            uv run python tools/docnum_check.py
          else
            echo "data/processed 없음 — 로컬에서 확인할 것"
          fi
