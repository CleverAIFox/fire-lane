name: GIS 계약 검증

on:
  push:
    branches: [gis, main]
  pull_request:
    branches: [gis, main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: web/data 계약 검증
        run: pytest tests/test_contract.py -v
