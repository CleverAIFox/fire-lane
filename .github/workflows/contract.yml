# GIS ↔ UI ↔ CV ↔ API 계약 검증
#
# 값(폭·판정)은 실측 후 바뀐다. 구조는 안 바뀐다. 그 경계를 여기서 지킨다.
#
# ★ 2026-08-27. 5인 체제 전환. 변경 3건.
#
#   1. 브랜치 4단. `gis` 트렁크를 폐기하고
#      main ← dev ← part/* ← feat/* 로 간다.
#      ★ 접두사를 갈랐다. part/* 는 보호되는 파트 통합 브랜치,
#        feat/* 는 자유로운 임시 브랜치다. 둘 다 feat/ 로 두면
#        룰셋이 구분하지 못한다.
#      배포 게이트는 main 단독이다(pages.yml). dev 는 트렁크,
#      main 은 배포 스냅샷이다.
#
#      ★ 트리거에서 part/** 를 빼지 마라. 파트 통합 브랜치를 CI 가
#        안 보면 검사를 비껴간 코드가 dev 까지 올라온다. 이 저장소는
#        같은 사고를 **두 번** 겪었다(08-22 · 08-23). 세 번째는 없다.
#
#   2. job 을 둘로 쪼갠다.
#
#        contract-shared   전 경로. 전원이 통과해야 하는 최소선
#        contract-strict   CODEOWNERS 단독 소유 경로만. 엄격 검사
#
#      엄격 검사를 전 경로에 걸면 신규 인원이 첫 주 내내 빨간불만
#      본다. 그러면 사람이 검사를 우회하기 시작하고, 우회가 습관이
#      되면 강제자 전체가 무력해진다. **범위를 좁혀서 강도를 유지한다.**
#
#      범위의 정본은 CODEOWNERS 하나다. `tools/owned_paths.py` 가
#      읽는다. 소유권과 검사 강도가 한 파일에서 같이 움직인다 —
#      정본이 둘이면 반드시 어긋난다(MASTER §18-3).
#
#   3. `contract-shared` 를 필수 체크로, `contract-strict` 도 필수로
#      건다. strict 가 선택이면 안 도는 것과 같다.
name: contract

on:
  push:
    branches: [main, dev, 'part/**', 'feat/**']
  pull_request:
    branches: [main, dev, 'part/**', 'feat/**']

jobs:
  # ── 전원 공통. 여기가 최소선이다 ─────────────────────────────
  contract-shared:
    name: contract-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 의존성 — uv.lock 이 정본이다
        run: uv sync --frozen --all-extras

      - name: ★ 소유권 — 미소유 경로가 없는가
        # 제일 먼저 돈다. 새 공용 파일이 소유자 없이 들어오는 것을
        # 그 PR 에서 막는다. 목록을 미리 관리하지 않아도 되는 이유다.
        run: uv run pytest tests/test_ownership.py -q

      - name: ★ PR 본문 — 리뷰 지목이 있는가
        # ★ 필수 체크 이름을 새로 만들지 않는다. 별도 job 으로 빼면
        #   룰셋에 이름을 추가해야 하고, 그 이름이 존재하기 전까지
        #   모든 PR 이 "Waiting for status to be reported" 로 영구 대기한다.
        #   2026-08-27 에 실제로 그 데드락을 겪었다. 스텝으로 붙인다.
        if: github.event_name == 'pull_request'
        run: uv run python tools/pr_body_check.py

      - name: 커밋 정책
        run: uv run python tools/commit_policy.py --tracked

      - name: 인코딩·개행
        run: uv run python tools/encoding_check.py

      - name: 파이썬 린트 (공용 최소 룰셋)
        # pyproject 의 [tool.ruff.lint] 그대로. 엄격판은 strict job 이 돈다.
        run: uv run ruff check src tools tests

      - name: JS 문법 검사 (클래식 스크립트)
        run: |
          find web -maxdepth 1 -name '*.js' -print0 \
            | xargs -0 -r -n1 -I{} sh -c 'node --check "{}" && echo "OK  {}"'

      - name: JS 부팅 스모크
        run: |
          npm install --no-save jsdom
          node tools/web_boot_check.mjs

      - name: JS 모듈 그래프 검사
        run: node tools/js_graph_check.mjs

      - name: web/data 용량 검사
        run: |
          SIZE=$(du -sm web/data | cut -f1)
          echo "web/data ${SIZE}MB"
          if [ "$SIZE" -ge 40 ]; then
            echo "::error::web/data 가 40MB 를 넘었다. 타일 줌 단계를 줄이거나 외부 호스팅으로 옮길 것"
            exit 1
          fi

      - name: 계약 테스트 — 파트 경계
        # ★ 여기가 CV·API 파트가 GIS 코드를 안 보고 붙을 수 있는 근거다.
        run: uv run pytest tests/test_contract.py -v

      - name: 전체 테스트
        run: uv run pytest tests/ -q

  # ── 단독 소유 경로만. 강도를 유지하는 자리 ───────────────────
  contract-strict:
    name: contract-strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 의존성
        run: uv sync --frozen --all-extras

      - name: 검사 범위 표시
        # ★ 범위가 0건이면 이 job 은 아무것도 안 하고 초록불이 된다.
        #   tests/test_ownership.py::test_strict_scope_is_not_empty 가
        #   그것을 막지만, 여기서도 눈에 보이게 찍는다.
        run: |
          N=$(uv run python tools/owned_paths.py --py-only | wc -l)
          echo "엄격 검사 대상 ${N}개 파일"
          uv run python tools/owned_paths.py --py-only | head -40
          test "$N" -gt 0 || { echo "::error::엄격 검사 대상이 0건이다"; exit 1; }

      - name: 엄격 린트
        # ★ per-file-ignores 는 규칙을 **약하게** 하는 방향이라
        #   반대 용도로 못 쓴다. 그래서 파일 목록을 넘겨 별도 실행한다.
        #   ANN·D 는 지금 코드베이스와 안 맞아 뺀다. 나머지는 전부 켠다.
        run: |
          FILES=$(uv run python tools/owned_paths.py --py-only)
          test -n "$FILES" || exit 0
          uv run ruff check $FILES \
            --select ALL \
            --ignore ANN,D,COM812,ISC001,E501,E701,E702,E741,E731,E402,T201,ERA001,RUF001,RUF002,RUF003,TRY003,EM101,EM102,PLR2004,C901,PLR0911,PLR0912,PLR0915,PLC0415,CPY001,FBT001,FBT003,S101,N801,N802,N803,N806,N812,N818,PLC2401,S603,S607,S112,PLW1510,BLE001,FURB167,FURB171,FURB192,PERF401,RUF005,RUF059,C420,PT018,INP001,PLR0913,PLR0917,PLW2901,SIM102,SIM103,TC001,TC002,TC003,Q000,Q003,RET504,TRY300,ARG001,PLC0206,PLC0207,PLC1802,PLR1714,PLW0108,PTH110,RUF010,RUF034,S104,SIM114,SIM115,SIM300,ISC002,ISC004,RUF100,RUF007,RUF046,RUF021,C408,PLW0603,PTH123,PTH207,FBT002,PERF102,S110,SIM105,PD011,PIE810,PLR0124,PLR1736,PT006,RET503,DTZ011,FURB188,ICN001,EXE001,EXE002

      - name: 문서 규약 · 재현성
        run: uv run pytest tests/test_doc_style.py tests/test_reproducibility.py -q

      - name: 방어 로직 · 계보
        run: uv run pytest tests/test_guards.py tests/test_declaration_sync.py -q

      - name: 문서 숫자 대조
        run: |
          if [ -f data/processed/segments.geojson ]; then
            uv run python tools/docnum_check.py
          else
            echo "data/processed 없음 — 로컬에서 확인할 것"
          fi

