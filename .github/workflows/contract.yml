# GIS ↔ UI 계약 검증
#
# 값(폭·판정)은 실측 후 바뀐다. 구조는 안 바뀐다. 그 경계를 여기서 지킨다.
# 깨지면 GIS 쪽이 UI 를 말없이 부순 것이다.
#
# job 이름을 contract 로 고정한다. 브랜치 보호의
# "Require status checks to pass" 목록에 이 이름으로 뜬다.
name: contract

on:
  push:
    branches: [gis, main]
  pull_request:
    branches: [gis, main]

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: web/data 계약 검증
        run: pytest tests/test_contract.py -v
