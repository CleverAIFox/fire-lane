# GIS ↔ UI ↔ CV ↔ API 계약 검증
#
# 값(폭·판정)은 실측 후 바뀐다. 구조는 안 바뀐다. 그 경계를 여기서 지킨다.
#
# ★ 2026-08-27. 5인 체제 전환. 변경 3건.
#
#   1. 브랜치 4단. `gis` 트렁크를 폐기하고
#      main ← dev ← part/* ← feat/* 로 간다.
#      ★ 접두사를 갈랐다. part/* 는 보호되는 파트 통합 브랜치,
#        feat/* 는 자유로운 임시 브랜치다. 둘 다 feat/ 로 두면
#        룰셋이 구분하지 못한다.
#      배포 게이트는 main 단독이다(pages.yml). dev 는 트렁크,
#      main 은 배포 스냅샷이다.
#
#      ★ 트리거에서 part/** 를 빼지 마라. 파트 통합 브랜치를 CI 가
#        안 보면 검사를 비껴간 코드가 dev 까지 올라온다. 이 저장소는
#        같은 사고를 **두 번** 겪었다(08-22 · 08-23). 세 번째는 없다.
#
#   2. job 을 둘로 쪼갠다.
#
#        contract-shared   전 경로. 전원이 통과해야 하는 최소선
#        contract-strict   CODEOWNERS 단독 소유 경로만. 엄격 검사
#
#      엄격 검사를 전 경로에 걸면 신규 인원이 첫 주 내내 빨간불만
#      본다. 그러면 사람이 검사를 우회하기 시작하고, 우회가 습관이
#      되면 강제자 전체가 무력해진다. **범위를 좁혀서 강도를 유지한다.**
#
#      범위의 정본은 CODEOWNERS 하나다. `tools/owned_paths.py` 가
#      읽는다. 소유권과 검사 강도가 한 파일에서 같이 움직인다 —
#      정본이 둘이면 반드시 어긋난다(MASTER §18-3).
#
#   3. `contract-shared` 를 필수 체크로, `contract-strict` 도 필수로
#      건다. strict 가 선택이면 안 도는 것과 같다.
name: contract

# ★ 브리핑 코멘트를 달려면 필요하다. 나머지는 읽기만 한다 —
#   최소 권한으로 둔다.
permissions:
  contents: read
  pull-requests: write

# ★ 2026-09-18 (W1). 배포 넷은 concurrency 가 있는데 contract 만 없었다.
#   `feat/**` 는 push 와 pull_request 양쪽에 걸려 **같은 커밋을 2회** 돌았다.
#   진행 중인 실행을 취소해도 안전하다 — 마지막 푸시의 결과만 의미가 있다.
concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev, 'part/**', 'feat/**']
  pull_request:
    branches: [main, dev, 'part/**', 'feat/**']
    # ★ edited 가 없으면 본문을 고쳐도 검사가 다시 돌지 않는다.
    #   실패 메시지는 편집하면 다시 돈다고 안내하므로 그 안내가 거짓이 된다.
    types: [opened, synchronize, reopened, edited]
  # ★ 2026-09-18 (W2). 다른 워크플로가 **이것을 그대로 부를 수 있게** 한다.
  #   `_deploy.yml` 이 배포 전에 게이트로 부른다. 검사를 **복사하지 않고**
  #   재사용한다 — 복사하면 그자리가 정본이 둘이 되고, 배포가 PR 이 통과한
  #   것과 다른 검사를 지나게 된다.
  # ★ PR 전용 스텝들은 `if: github.event_name == 'pull_request'` 로 받으므로
  #   `workflow_call` 로 들어오면 자동으로 건너낌다. 보토가 아니다.
  workflow_call:

jobs:
  # ── 전원 공통. 여기가 최소선이다 ─────────────────────────────
  contract-shared:
    name: contract-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # ★ 2026-09-19 (W3-17). 판을 **여기 적지 않는다.** 정본은
          #   `.python-version` 하나이고 `uv` 도 같은 파일을 읽는다.
          #   종전에는 `"3.11"` 이 여기·`:314`·`_deploy.yml` 셋에 손으로
          #   적혀 있었고, `Dockerfile` 은 W8-2 로 **3.14** 가 됐다.
          #   **배포되는 런타임과 게이트가 도는 런타임이 달랐다** —
          #   내비 노드 22 vs 20 과 같은 형태의 파이썬 판이다(§186-2).
          #   `tests/test_ci_env.py` 가 판이 한 곳에서 오는지 강제한다.
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 의존성 — uv.lock 이 정본이다
        run: uv sync --frozen --all-extras

      - name: ★ 소유권 — 미소유 경로가 없는가
        # 제일 먼저 돈다. 새 공용 파일이 소유자 없이 들어오는 것을
        # 그 PR 에서 막는다. 목록을 미리 관리하지 않아도 되는 이유다.
        run: uv run pytest tests/test_ownership.py -q

      - name: base 와의 간극
        # ★ 2026-08-31 신설. 그날 `part/gis` 가 `dev` 를 20커밋 안 받은 채로
        #   PR 을 냈고 충돌 10건이 났다. 아침 머지는 로컬 행위라 CI 가 막을
        #   수 없지만, **얼마나 뒤처졌는지는 잴 수 있다.**
        #
        #   ★ 5에서 경고하고 20에서 막는다. 근거는 실측 하나뿐이라 잠정이며,
        #     몇 주 데이터가 쌓이면 다시 정한다(MASTER §17 — 측정이 안 되면
        #     원인을 찾는다). 아무도 안 민 날에 우는 것은 소음이므로
        #     하루치(1~4)는 조용히 지나간다.
        #
        #   `checkout@v4` 는 fetch-depth 1 이라 히스토리가 없다. base 만
        #   따로 받아서 센다 — 전체를 받으면 CI 가 느려진다.
        if: github.event_name == 'pull_request'
        run: |
          # ★ 2026-08-31. 처음엔 `--depth=50` 으로 base 만 얕게 받고
          #   `HEAD..FETCH_HEAD` 를 셌다. **270 이 나왔다.** checkout 이
          #   fetch-depth 1 이라 HEAD 쪽 히스토리가 없어 공통 조상을 못 찾고
          #   base 의 받은 커밋을 거의 전부 센 것이다. 첫 시험에서 오탐으로
          #   PR 을 막았다 — 잘못된 경보는 진짜 경보를 못 믿게 만든다(§18-13).
          #
          #   `--deepen` 으로 양쪽을 넓혀 merge-base 가 잡힐 때까지 받는다.
          #   못 찾으면 세지 않는다. **모를 때 막지 않는다.**
          git fetch --no-tags --deepen=100 origin "+${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
          git fetch --no-tags --deepen=100 origin "+${{ github.head_ref }}" || true
          BASE=$(git merge-base HEAD "origin/${{ github.base_ref }}" 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            # ★ 2026-09-18. `exit 0` 은 그대로 둔다 — 「모를 때 막지 않는다」는
            #   위 주석의 의도된 결정이고 오탐이 진짜 경보를 죽인다(§18-13).
            #   다만 **조용히** 통과하지는 않는다. 종전에는 이 검사가 사라진
            #   것을 PR 화면에서 알 길이 없었다. 경보가 아니라 기록이 목적이다.
            echo "::warning::공통 조상을 못 찾아 base 간극을 세지 못했다 (얕은 클론). 이 PR 에서 간극 검사는 돌지 않았다"
            exit 0
          fi
          N=$(git rev-list --count "$BASE..origin/${{ github.base_ref }}")
          echo "이 브랜치는 ${{ github.base_ref }} 보다 $N 커밋 뒤처져 있다"
          if [ "$N" -ge 20 ]; then
            echo "::error::$N 커밋 뒤처졌다. 머지 전에 base 를 받아라 — git merge origin/${{ github.base_ref }}"
            exit 1
          elif [ "$N" -ge 5 ]; then
            echo "::warning::$N 커밋 뒤처졌다. 아침에 base 를 받는 습관이 없으면 곧 대형 충돌이 난다"
          fi

      - name: 흡수 대상 브리핑 — 리뷰어가 볼 표
        # ★ 승인이 형식이 되는 이유는 리뷰어가 무엇을 흡수하는지 모르기
        #   때문이다(DECISIONS §109). 사람이 복사·붙여넣기 하지 않는다.
        #
        # ★ **별도 워크플로로 빼지 않는다.** Actions 사이드바는
        #   `.github/workflows/` 를 전부 나열하고 숨길 수 없어, 배포 셋이
        #   서 있는 자리에 성격이 다른 항목이 끼면 그 화면의 뜻이
        #   약해진다(§101-4). 스텝으로 붙이면 목록이 안 는다.
        #
        # ★ **코멘트를 쌓지 않는다.** 같은 표식을 가진 코멘트를 찾아
        #   갱신한다. 매 푸시마다 새 코멘트가 달리면 PR 이 더러워지고,
        #   더러워지면 아무도 안 읽는다.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          BASE: ${{ github.base_ref }}
        run: |
          MARK='<!-- fire-lane:brief -->'
          git fetch -q origin "$BASE"
          { echo "$MARK"
            uv run python tools/release_brief.py --base "$BASE" --md
          } > /tmp/brief.md
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
                 --jq "[.[] | select(.body | startswith(\"$MARK\"))] | .[0].id // empty")
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" \
              -F body=@/tmp/brief.md > /dev/null
            echo "브리핑 갱신 (comment $ID)"
          else
            gh pr comment "$PR" --body-file /tmp/brief.md
            echo "브리핑 신규"
          fi

      - name: ★ PR 본문 — 리뷰 지목이 있는가
        # ★ 필수 체크 이름을 새로 만들지 않는다. 별도 job 으로 빼면
        #   룰셋에 이름을 추가해야 하고, 그 이름이 존재하기 전까지
        #   모든 PR 이 "Waiting for status to be reported" 로 영구 대기한다.
        #   2026-08-27 에 실제로 그 데드락을 겪었다. 스텝으로 붙인다.
        # ★ 2026-09-18. **이 검사는 「사람이 쓴 PR」을 전제한다.** 그 전제가
        #   선언돼 있지 않아서 W1 이 들인 dependabot 의 PR 열 건이 전부
        #   영구 빨강이 됐다(#79~#88). 봇은 템플릿을 못 채운다 — 「리뷰어가
        #   볼 곳」도 체크박스도 봇이 쓸 수 있는 것이 아니다.
        #   `doc_fsck ⑥` 과 같은 형태다(DECISIONS §191-5) — 환경이 갖추지
        #   못한 전제를 요구하는 검사를 그 환경에 걸었다. 전제를 선언한다.
        # ★ 봇 PR 이 무검사로 통과하는 것이 아니다. 같은 job 의 나머지
        #   전부(린트·테스트·계약·문서)는 그대로 돈다. **사람이 쓴 본문**만
        #   묻지 않는다.
        # ★ 2026-09-18 정정. 처음엔 `user.login != 'dependabot[bot]'` 로 썼는데
        #   **안 먹었다** — 표기가 `app/dependabot` · `dependabot[bot]` 둘로 돌고
        #   `renovate` 가 오면 또 난다. **종류로 본다** — GitHub 이 봇 계정에
        #   `type: Bot` 을 준다. 그 판단은 이제 `pr_body_check.py` 안에 있다.
        # ★ 2026-09-20 (W3-12). **봇 조건을 여기서 뺐다.** 전제는 검사가 든다.
        #   경계는 이것이다 — 워크플로는 **언제** 돌지를 정하고(`pull_request`
        #   일 때만), 검사는 **자기 전제가 서는지**를 정한다(본문을 사람이
        #   썼는가). 전제를 워크플로가 대신 들면 정본이 둘이고, 검사를 다른
        #   자리에서 부를 때 전제가 안 따라온다.
        if: github.event_name == 'pull_request'
        run: uv run python tools/pr_body_check.py

      - name: 커밋 정책
        run: uv run python tools/commit_policy.py --tracked

      - name: 인코딩·개행
        run: uv run python tools/encoding_check.py

      - name: ★ pre-commit 전수 — 로컬 훅과 **같은 파일**을 읽는다
        # ★ 2026-09-18 (W1). `.pre-commit-config.yaml` 하나를 두 소보자가 읽는다 —
        #   전역 훅(~/.githooks/pre-commit → pre-commit run)과 이 스텝.
        #   규칙을 어느 쪽에도 **복사하지 않는다** — 복사하는 순간 정본이 둘이 된다.
        # ★ 새 job 을 만들지 않는다. 필수 체크 이름이 늘면 룰셋에 등록할 때까지
        #   모든 PR 이 영구 대기한다(2026-08-27 데드록). 스텝으로 붙인다.
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # ── 2026-09-18 (W2). 로컬 전용이던 검사를 CI 로 옮긴다 ──────────
      # ★ 고른 기준은 "중요한가" 가 아니라 **"레이크 없이 도는가"** 다.
      #   레이크(2.5GB 외장)가 필요한 것은 CI 에서 원리적으로 못 돈다 —
      #   lakecheck · sweep · firelane.lake · 파이프라인 전량이 그것이다.
      #   나머지는 커밋된 파일만 읽으므로 여기서 돌 수 있었는데 안 돌았다.
      # ★ `web_manifest` 가 이 목록의 이유다. `verify.sh` 주석이 그것을 두고
      #   **"CI 가 본다"** 고 적어놨는데 CI 에 없었다. 주석이 거짓이 된 것을
      #   잡은 검사가 없었다 — 이제 gate_parity 가 잡는다.
      - name: 환경변수 선언↔실물
        run: uv run python tools/env_check.py
      - name: 문서 ↔ 문서
        run: uv run python tools/doc_fsck.py
      # ★ 2026-09-18 되돌렸다. W2 가 3족(관문이 갈림)을 닫겠다고 `refcheck.py` 를
      #   여기 넣었는데 **이 검사는 레이크가 있어야 돈다** — `⑧ layers 선언 →
      #   디렉터리` 가 `data/raw` 를 required 로 요구한다. CI 에는 레이크가 없으므로
      #   구조적으로 영원히 빨강이다(PR #75 에서 실측 · DECISIONS §191-4).
      #   레이크 없는 모드가 생기기 전까지 로컬 전용이다 — PLAN §13 W3-10.
      - name: 트리 전수 대조 (저장소만)
        run: uv run python tools/treecheck.py --repo
      - name: web/data 계보
        run: uv run python tools/web_manifest.py --check
      # ★ 출동 대상지(동명동) 밖으로 스코프가 얼마나 벗어났는가 — PLAN §1 #62.
      #   커밋된 segments.geojson 속성만 읽어 레이크가 필요 없다. 래칫이다.
      - name: 스코프 벗어남 (래칫)
        run: uv run python tools/scopecheck.py
      - name: 그림 ↔ 정본
        run: uv run python tools/render_figures.py --check
      - name: ★ 검사가 죽었는가 (메타 가드)
        run: uv run python tools/deadcheck.py --selftest

      - name: ★ 관문 동등 — 로컬과 CI 가 같은 것을 보는가
        # ★ 3족의 클래스 가드다. 새 검사를 로컬에만 붙이면 여기서 걸린다.
        #   래칫이라 수는 줄기만 한다 — 줄었으면 숫자를 내리라고 요구한다.
        # ★ 2026-09-20 (W3-11). **숫자를 여기 안 적는다.** 종전에는 `--max 19` 가
        #   여기와 `tools/verify.sh` 둘에 손으로 적혀 있었고, 2026-09-18 에
        #   verify.sh 만 고쳐서 **로컬 초록 · CI 빨강**이 났다. 이제 기본값이
        #   `gate_parity.py` 의 `RATCHET` 이고 부르는 쪽은 인자를 안 적는다.
        # ★ 2026-09-20 (W3-10). 면제 칸이 생겼다 — 레이크·기계 설정을 요구해
        #   CI 에서 원리적으로 못 도는 검사는 `verify.sh` 의 `# ci-exempt:` 가
        #   사유와 함께 선언한다. 래칫은 **미선언만** 센다. **미선언이 실패다.**
        run: uv run python tools/gate_parity.py

      - name: 파이썬 린트 (공용 최소 룰셋)
        # pyproject 의 [tool.ruff.lint] 그대로. 엄격판은 strict job 이 돈다.
        run: uv run ruff check src tools tests

      - name: JS 문법 검사 (클래식 스크립트)
        run: |
          find web -maxdepth 1 -name '*.js' -print0 \
            | xargs -0 -r -n1 -I{} sh -c 'node --check "{}" && echo "OK  {}"'

      - name: JS 부팅 스모크
        run: |
          npm install --no-save jsdom
          node tools/web_boot_check.mjs

      - name: JS 모듈 그래프 검사
        run: node tools/js_graph_check.mjs

      - name: 내비 노드 — 배포 액션과 같은 판으로
        uses: actions/setup-node@v4
        with:
          node-version-file: web/navi/.nvmrc
          cache: npm
          cache-dependency-path: web/navi/package-lock.json

      - name: ★ 내비 타입 검사 (web/navi)
        # ★ 2026-09-15 신설. 위의 JS 셋은 전부 `web/*.js` 클래식 스크립트만
        #   본다 — `find web -maxdepth 1` 이라 `web/navi` 는 한 번도 안 열린다.
        #   내비를 컴파일하는 곳은 `.github/actions/build-navi` 하나뿐이고
        #   그건 **push:main 에서만** 돈다. 그래서 maplibre-gl 5→6 ·
        #   vite 5→6 이 PR 초록 · 0 vulnerabilities 로 통과해 main 에
        #   들어갔고, 거기서 `TS1192 has no default export` 로 죽었다.
        #   릴리즈가 죽을 때까지 아무도 몰랐다 — 이 저장소가 반복해 겪은
        #   "초록불인데 실제로는 안 되는" 그 형태다.
        #
        # ★ 빌드가 아니라 **타입만** 본다. `vite build` 는 MAPBOX_TOKEN 이
        #   필요하고 그 시크릿은 배포 환경에만 있다. 이번 사고는 타입
        #   단계에서 잡혔으므로 게이트는 여기까지가 맞다. 빌드는 배포
        #   액션이 계속 맡는다(정본을 둘로 만들지 않는다 — R3).
        #
        # ★ `npm ci` 다. `install` 은 잠금을 갱신할 수 있다.
        #
        # ★ 2026-09-18 (DECISIONS §186-2). 바로 위에서 노드를 `.nvmrc` 로 맞춘다.
        #   이 잡의 머리 `setup-node` 는 22 이고 배포 액션은 20 이었다 —
        #   **게이트가 빌드와 다른 런타임에서 돌았다.** 위 셋(web/*.js)은 22 그대로 둔다.
        run: |
          cd web/navi
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: web/data 용량 검사
        run: |
          SIZE=$(du -sm web/data | cut -f1)
          echo "web/data ${SIZE}MB"
          if [ "$SIZE" -ge 40 ]; then
            echo "::error::web/data 가 40MB 를 넘었다. 타일 줌 단계를 줄이거나 외부 호스팅으로 옮길 것"
            exit 1
          fi

      - name: 계약 테스트 — 파트 경계
        # ★ 여기가 CV·API 파트가 GIS 코드를 안 보고 붙을 수 있는 근거다.
        run: uv run pytest tests/test_contract.py -v

      - name: 전체 테스트
        run: uv run pytest tests/ -q

  # ── 단독 소유 경로만. 강도를 유지하는 자리 ───────────────────
  contract-strict:
    name: contract-strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # ★ 정본은 `.python-version` 하나다 (W3-17).
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 의존성
        run: uv sync --frozen --all-extras

      - name: 검사 범위 표시
        # ★ 범위가 0건이면 이 job 은 아무것도 안 하고 초록불이 된다.
        #   tests/test_ownership.py::test_strict_scope_is_not_empty 가
        #   그것을 막지만, 여기서도 눈에 보이게 찍는다.
        run: |
          N=$(uv run python tools/owned_paths.py --py-only | wc -l)
          echo "엄격 검사 대상 ${N}개 파일"
          uv run python tools/owned_paths.py --py-only | head -40
          test "$N" -gt 0 || { echo "::error::엄격 검사 대상이 0건이다"; exit 1; }

      - name: 엄격 린트
        # ★ per-file-ignores 는 규칙을 **약하게** 하는 방향이라
        #   반대 용도로 못 쓴다. 그래서 파일 목록을 넘겨 별도 실행한다.
        #   ANN·D 는 지금 코드베이스와 안 맞아 뺀다. 나머지는 전부 켠다.
        run: |
          FILES=$(uv run python tools/owned_paths.py --py-only)
          test -n "$FILES" || exit 0
          # ★ 2026-08-30. `--select ALL` 을 폐기했다.
          #
          #   재보니 1,694건이었고 상위 5개가 전부 오탐이었다 —
          #   S101 445(테스트의 assert) · PLC0415 197(의도된 지연 import) ·
          #   PLR2004 142(params.py 가 정본인 상수) · N806 121(수학 관례 대문자) ·
          #   CPY001 101(안 쓰기로 한 저작권 헤더).
          #   규칙이 코드베이스를 못 따라간 것이지 코드가 나쁜 것이 아니다.
          #
          #   그래서 --ignore 110개짜리 손대장으로 덮었고, 그것이 곧
          #   "검사가 죽은 채 뜨는 초록불" 이었다. 8-27 의 한시 완화가 그것이다.
          #
          #   **끌 것을 나열하지 않고 켤 것을 고른다.** 손대장 110 → 8 이 되고
          #   남는 15건은 전부 실제 버그이거나 명백한 개선이었다 —
          #   DTZ011 은 어제 계약에서 막은 시간대 누락 버그가 코드에도 있던 것이다.
          # ★ 인자의 정본은 .ruff-strict.toml 다. 여기 적지 않는다 —
          #   적으면 tools/verify.sh 와 갈린다(2026-09-02).
          uv run ruff check $FILES --config .ruff-strict.toml

      - name: 문서 규약 · 재현성
        run: uv run pytest tests/test_doc_style.py tests/test_reproducibility.py -q

      - name: 방어 로직 · 계보
        run: uv run pytest tests/test_guards.py tests/test_declaration_sync.py -q

      - name: 문서 숫자 대조
        run: |
          # ★ 2026-09-10. 종전에는 이 조건 때문에 CI 에서
          #   **한 번도 안 돌았다**(F-211). 지금은 그 파일이
          #   우연히 추적돼 있어 돌지만, 예외를 지우면 또 죽는다.
          #   조건을 없앤다 — 없으면 docnum_check 가 그렇게 말한다.
          # ★ 2026-09-18. `if true; then … else … fi` 로 남아 있던 껍데기를
          #   지웠다. 조건이 상수라 else 는 도달 불가였고, 누가 `true` 를
          #   진짜 조건으로 되돌리면 F-211(CI 에서 한 번도 안 돎)이 재발한다.
          #   도달 불가 분기는 주석보다 위험하다 — 살아 있는 것처럼 보인다.
          uv run python tools/docnum_check.py

