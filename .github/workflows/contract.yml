# GIS ↔ UI 계약 검증
#
# 값(폭·판정)은 실측 후 바뀐다. 구조는 안 바뀐다. 그 경계를 여기서 지킨다.
# 깨지면 GIS 쪽이 UI 를 말없이 부순 것이다.
#
# job 이름을 contract 로 고정한다. 브랜치 보호의
# "Require status checks to pass" 목록에 이 이름으로 뜬다.
name: contract

on:
  push:
    branches: [gis, main]
  pull_request:
    branches: [gis, main]

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: JS 문법 검사
        run: |
          # app.js 가 문법 오류면 지도가 통째로 안 뜬다.
          for f in web/app.js web/config.js; do
            node --check "$f" && echo "OK  $f"
          done

      - name: web/data 용량 검사
        run: |
          # UI 담당이 raw 없이 작업하려면 web/data 를 커밋해야 한다.
          # 다만 타일이 늘면 저장소가 급격히 무거워진다. 상한을 둔다.
          SIZE=$(du -sm web/data | cut -f1)
          echo "web/data ${SIZE}MB"
          if [ "$SIZE" -ge 60 ]; then
            echo "::error::web/data 가 60MB 를 넘었다. 타일 줌 단계를 줄이거나 외부 호스팅으로 옮길 것"
            exit 1
          fi

      - name: web/data 계약 검증
        run: pytest tests/test_contract.py -v

      - name: 방어 로직 · 저장소 위생
        # ★ 계보 검사 / 낡은 산출물 격리 / 공간 커버리지 는 1093·1091 두 무효
        #   산출을 만든 원인에 대한 방어다. 8/18 까지 테스트가 없어서 누가
        #   지워도 초록불이었다. 여기서 회귀를 막는다.
        run: |
          pip install pytest shapely numpy
          pytest tests/test_guards.py tests/test_seg_*.py tests/test_static.py tests/test_reproducibility.py -v

      - name: 문서 숫자 대조
        # ★ 도구를 만들어놓고 수동 실행으로 두면 안 돌린다. 8/17 의 1093 은
        #   이것을 돌렸으면 그날 잡혔다. 산출물이 없는 러너에서는 건너뛴다.
        run: |
          if [ -f data/processed/segments.geojson ]; then
            python tools/docnum_check.py
          else
            echo "data/processed 없음 — 로컬에서 확인할 것"
          fi
