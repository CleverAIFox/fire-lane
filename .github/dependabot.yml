# dependabot.yml — 의존성 판 올리기를 **손에서 뺀다.**
#
# ★ 왜 생겼나 (2026-09-18 · W1)
#   버전 상한이 없는 코어 의존성이 여덟이다 — pandas · numpy · networkx ·
#   PyYAML · rasterio · pillow · ruamel-yaml · python-docx. 그중 `numpy>=1.26`
#   이 가장 위험하다: numpy 2.x ABI 전환이 rasterio · pyogrio · opencv 의
#   컴파일 확장과 충돌하는 축이고, 여기가 유일하게 상한 없는 ABI 의존이다.
#   `uv.lock` 이 재현성을 지키므로 **지금 당장** 위험한 것은 아니다. 문제는
#   올릴 때다 — 손으로 올리면 언제 무엇이 왜 올라갔는지가 아무 데도 안 남는다.
#
# ★ 이 저장소 철학과 같은 방향이다. 의존성으로 할 수 있는 것은 의존성으로 한다.
#   판 올리기는 GitHub 이 공짜로 해 주는 일이고, 손으로 하면 `sources.yaml`
#   대장처럼 또 하나의 손대장이 생긴다.
#
# ★ PR 로만 온다. 자동 머지는 켜지 않는다 — `contract` 가 초록이어야 하고,
#   `uv sync --frozen` 이라 lock 갱신은 사람이 본다. 판정 산출물이 움직이면
#   그것은 측정 배치이고 Dependabot 이 결정할 일이 아니다.
#
# ★ 2026-09-22 (DECISIONS §212-3). 주 1회 · 개별 PR 로 받았더니 월요일마다 봇 PR
#   아홉이 main 을 향해 열리고 아무도 안 머지한 채 쌓였다. 봇 PR 은 feat → part →
#   dev → main 흐름 밖이라 **그대로 머지할 수 있는 길이 애초에 없다** — 신호일
#   뿐이다. 신호로 쓰려면 적어야 읽힌다: 월 1회 · 생태계마다 한 PR 로 묶는다.
#   올릴 때는 그 PR 을 닫고 같은 내용을 feat 배치로 다시 낸다.
#   보안 업데이트는 이 파일과 별개로 온다(저장소 설정) — 줄지 않는다.
#
# ★ 2026-09-22 (DECISIONS §215-3). v0.33 뒤에 봇 PR 다섯이 또 쌓였고, 그중 navi-all(#173)은
#   다섯 패키지를 한꺼번에 올렸다. 메이저 판 올리기는 **정기 신호로 받지 않는다** — React ·
#   MapLibre · Vite 메이저는 코드를 고쳐야 하는 일이고, 봇 PR 로는 그 일을 못 한다(TS1192 사고).
#   메이저는 사람이 배치로 계획해서 올린다. 보안 업데이트는 이 무시와 무관하게 온다.
version: 2

updates:
  # ── 파이썬 (uv.lock) ────────────────────────────────────────
  # ★ uv 생태계는 `package-ecosystem: uv` 다. pyproject + uv.lock 을 같이 본다.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # ★ 메이저는 배치로 계획한다(§215-3). 보안 업데이트는 이 규칙과 무관하게 온다
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
    groups:
      # ★ ABI 로 묶인 것은 **같이** 올린다. 따로 올리면 numpy 만 2.x 가 되어
      #   rasterio 휠과 어긋나는 그 사고가 난다.
      geo-abi:
        patterns: ["numpy", "pandas", "rasterio", "pyogrio", "geopandas", "shapely", "pyproj"]
      dev-tools:
        patterns: ["ruff", "pytest*", "pre-commit"]
      # ★ 나머지를 하나로. 없으면 ultralytics 처럼 따로 하나씩 연다
      rest:
        patterns: ["*"]

  # ── 내비 (web/navi/package-lock.json) ───────────────────────
  # ★ maplibre-gl 5→6 · vite 5→6 이 PR 초록으로 main 에 들어가 TS1192 로 죽은
  #   사고가 있었다(contract.yml §186-2). 그 판 올리기가 PR 로 오면
  #   `내비 타입 검사` 게이트를 먼저 통과해야 한다.
  - package-ecosystem: npm
    directory: /web/navi
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # ★ 메이저는 배치로 계획한다(§215-3). 보안 업데이트는 이 규칙과 무관하게 온다
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(navi)"
    groups:
      navi-all:
        patterns: ["*"]

  # ── GitHub Actions ─────────────────────────────────────────
  # ★ `setup-uv@v3` 처럼 메이저만 박힌 것들. 액션이 조용히 바뀌면 CI 가
  #   어제와 다른 것을 검사한다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # ★ 액션은 메이저도 받는다 — 러너 노드 판 폐기로 강제되는 경우가 많고 코드 수정이 거의 없다
    commit-message:
      prefix: "ci"
    groups:
      actions-all:
        patterns: ["*"]

  # ── Docker (Dockerfile 의 python · uv 판) ───────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
