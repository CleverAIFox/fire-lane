# 사이트 짓기 — `web/` 을 배포할 모양으로 완성한다. `deploy.yml` 의 배포와 PR 시운전이 **같이** 쓴다.
#
# ★ 2026-09-22 (DECISIONS §217-5 · PLAN W3-15 닫음). 배포 넷의 본문은 `main` 에 닿기 전까지
#   **한 번도 안 돌았다**(`pull_request` 트리거 0). W1 이 `_deploy.yml` 을 하루 동안 깨뜨린 채 main 에
#   보냈고 v0.18 배포 넷이 다 죽었다(§196). 본문을 이 액션 하나로 빼고, PR 에서도 배포 직전까지
#   (업로드 · 배포만 빼고) 태운다. 같은 본문을 두 벌 적지 않는다 — 두 벌이면 한쪽만 고친다.
# ★ 2026-09-23 (DECISIONS §224). 배포 여섯을 `deploy.yml` 하나로 합쳤다. 시운전은 별도 워크플로가
#   아니라 **같은 파일의 `pull_request` 갈래**다. 배포가 아닌 것이 배포 목록에 서지 않는다.
name: 사이트 짓기
description: 협업 방침 렌더 · 내비 빌드 · 배포 준비(기획서 · 틀 빼기)

inputs:
  mapbox-token:
    description: Mapbox public token
    required: true

runs:
  using: composite
  steps:
    - name: MASTER §12 → web/workflow.html
      # ★ 넷 다 web/ 전체를 올리므로 여기서 생성하지 않으면 낡은 협업 방침이
      #   배포된다. 생성과 배포를 가르지 않는다(2026-08-31).
      shell: bash
      run: uv run python tools/render_workflow.py

    # ★ 2026-09-22. 「캐시 무효화 스탬프 주입」을 뺐다. `?v=BUILD` 를 들던 것은 옛 지도의
    #   index.html 이었고 지도를 걷어냈다. 지금 index.html 은 관제로 넘기는 입구라 스탬프가 없다.
    #   내비 자산은 vite 가 내용 해시 파일명으로 낸다.

    - uses: ./.github/actions/build-navi
      with:
        mapbox-token: ${{ inputs.mapbox-token }}

    - name: 배포 준비 (docs/proposal.docx → web/ · 틀 빼기)
      # ★ 2026-09-22. `web/key.js`(V-World 키) 생성을 뺐다 — 쓰던 것이 옛 지도 하나였다.
      # ★ 2026-09-22 (§216-5). `--deploy` 가 템플릿(playbook.html) · web/README.md 를 뺀다.
      #   협업 방침은 workflow.html 하나로 뜬다. 렌더(위 단계)가 템플릿을 다 읽은 뒤라 안전하다.
      shell: bash
      run: uv run python tools/stage_pages.py --deploy
