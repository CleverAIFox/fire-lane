# 사이트 짓기 — `web/` 을 배포할 모양으로 완성한다. `_deploy.yml` 의 배포와 PR 시운전이 **같이** 쓴다.
#
# ★ 2026-09-22 (DECISIONS §217-5 · PLAN W3-15 닫음). 배포 넷의 본문은 `main` 에 닿기 전까지
#   **한 번도 안 돌았다**(`pull_request` 트리거 0). W1 이 `_deploy.yml` 을 하루 동안 깨뜨린 채 main 에
#   보냈고 v0.18 배포 넷이 다 죽었다(§196). 본문을 이 액션 하나로 빼고, PR 에서는 `deploy-dry.yml` 이
#   배포 직전까지(업로드 · 배포만 빼고) 태운다. 같은 본문을 두 벌 적지 않는다 — 두 벌이면 한쪽만 고친다.
name: 사이트 짓기
description: 협업 방침 렌더 · 캐시 스탬프 · 내비 빌드 · 배포 준비(키 · 기획서 · 틀 빼기)

inputs:
  mapbox-token:
    description: Mapbox public token
    required: true
  vworld-key:
    description: V-World 키. 비면 배경지도 없이 짓는다(시운전)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: MASTER §12 → web/workflow.html
      # ★ 넷 다 web/ 전체를 올리므로 여기서 생성하지 않으면 낡은 협업 방침이
      #   배포된다. 생성과 배포를 가르지 않는다(2026-08-31).
      shell: bash
      run: uv run python tools/render_workflow.py

    - name: 캐시 무효화 스탬프 주입
      # ★ 저장소는 ?v=BUILD 로 두고 여기서 찍는다. 값은 view.json 의 build 로,
      #   publish_web.py 가 쓰고 js/data.js 가 읽는 그 값이다. 정본이 하나다.
      # ★ `grep -c` 를 남긴다. sed 가 아무것도 못 바꿔도 rc=0 이라, 치환이
      #   실제로 일어났는지는 세어봐야 안다. 종전에는 pages 에만 있었다.
      shell: bash
      run: |
        B=$(sed -n 's/.*"build": *"\([0-9a-f]*\)".*/\1/p' web/data/view.json)
        test -n "$B" || { echo "view.json 에 build 가 없다"; exit 1; }
        echo "스탬프 $B"
        sed -i "s/?v=BUILD/?v=$B/g" web/index.html
        grep -c "?v=$B" web/index.html

    - uses: ./.github/actions/build-navi
      with:
        mapbox-token: ${{ inputs.mapbox-token }}

    - name: 배포 준비 (docs/proposal.docx → web/ · web/key.js 생성)
      # ★ web/key.js 는 생성물이다. V-World 키를 저장소에 안 둔다.
      #   로컬은 .env, 여기는 Secrets — stage_pages.py 한 곳이 읽는다.
      # ★ 2026-09-18. 종전에는 이 env 가 pages.yml 에만 있었다.
      # ★ 2026-09-22 (§216-5). `--deploy` 가 템플릿(playbook.html) · web/README.md 를 뺀다.
      #   협업 방침은 workflow.html 하나로 뜬다. 렌더(위 단계)가 템플릿을 다 읽은 뒤라 안전하다.
      shell: bash
      run: uv run python tools/stage_pages.py --deploy
      env:
        VWORLD_KEY: ${{ inputs.vworld-key }}
