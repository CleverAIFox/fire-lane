# 내비(React) 빌드 — 배포 워크플로 넷이 공유하는 정본.
#
# ★ 왜 합성 액션인가
#   Pages 는 저장소당 사이트 하나라 배포 워크플로 넷이 전부 `web/` **전체**를
#   올린다(proposal.yml 머리말). 그런데 `web/navi/dist` 는 `.gitignore` 라
#   저장소에 없다 — **빌드하는 워크플로만 내비를 올린다.**
#
#   2026-09-05 에 내비를 붙이면서 `pages.yml` 에만 빌드를 넣었다. 그래서
#   `docs.yml`(협업 방침) 이나 `proposal.yml`(기획서) 이 나중에 돌면
#   `/navi/` 가 404 가 된다. `docs.yml` 머리말의 *"어느 쪽이 나중에 돌아도
#   결과가 완전하다"* 가 그날부터 거짓이었다. **2026-08-31 부분 배포 사고와
#   같은 형태다** — 그때는 파일이 빠졌고 이번엔 폴더가 빠진다.
#
#   같은 블록을 넷에 복붙하면 정본이 넷이 된다(R3). 한 곳에 둔다.
name: 내비 빌드
description: web/navi 를 빌드해 web/navi/dist 에 둔다. Pages 아티팩트에 실린다.

inputs:
  mapbox-token:
    description: Mapbox public token. 없으면 스냅(Map Matching)이 죽는다.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: web/navi/package-lock.json

    - name: 내비 빌드 (web/navi → web/navi/dist)
      shell: bash
      env:
        VITE_MAPBOX_TOKEN: ${{ inputs.mapbox-token }}
      run: |
        # ★ 토큰이 없으면 여기서 죽는다. 종전에는 빈 문자열이 들어가고
        #   `config.ts` 가 `?? ""` 로 받아 **빌드도 배포도 성공했다.**
        #   런타임에 Map Matching 만 죽는다 — 초록불인데 실제로는 안 되는,
        #   이 저장소가 반복해 겪은 그 형태다. 원인 자리에서 죽는 편이 낫다.
        test -n "$VITE_MAPBOX_TOKEN" || {
          echo "★ MAPBOX_TOKEN 시크릿이 없다."
          echo "  Settings > Secrets and variables > Actions > New repository secret"
          echo "  이름 MAPBOX_TOKEN · 값은 Mapbox 의 pk. 토큰"
          echo "  ★ 번들에 박히므로 Mapbox 쪽에서 URL 제한을 같이 걸어라."
          exit 1
        }

        # ★ base 는 `github.repository` 에서 온다. Pages 가
        #   `https://<user>.github.io/<repo>/` 로 서빙하므로 내비는
        #   `/<repo>/navi/` 아래에 산다. 저장소 이름을 손으로 박지 않는다.
        REPO="${GITHUB_REPOSITORY#*/}"
        echo "base = /$REPO/navi/"

        # ★ `npm ci` 다. `install` 은 package-lock 을 갱신할 수 있고,
        #   CI 가 잠금을 바꾸면 "내 기계에서는 됐는데" 가 재현된다.
        #   `uv sync --frozen` 과 같은 자리다.
        cd web/navi
        npm ci
        VITE_BASE="/$REPO/navi/" npm run build

        # ★ 빌드가 실패하면 배포가 멈춘다. 낡은 내비가 올라가면 그것이
        #   web/data 와 갈리고, 갈렸다는 것을 아무도 모른다.
        test -f dist/index.html || { echo "★ dist/index.html 이 없다"; exit 1; }
        echo "내비 빌드 $(du -sh dist | cut -f1)"

        # ★ 2026-09-07. **dist 를 navi/ 자리에 앉힌다.** 이 세 줄이 없어서
        #   09-05 부터 내비가 안 떴다.
        #
        #   `upload-pages-artifact` 는 `path: web` 을 올린다. 그러면
        #       web/navi/index.html       → /<repo>/navi/        소스
        #       web/navi/dist/index.html  → /<repo>/navi/dist/   빌드본
        #   이 되어 **소스가 빌드본을 가린다.** 브라우저가 받는 것은 Vite
        #   개발용 `index.html` 이고 `<script src="/src/main.tsx">` 를 그대로
        #   요청한다 — 404 다. 게다가 `VITE_BASE` 가 `/navi/` 라 `/navi/dist/`
        #   로 직접 들어가도 자산 경로가 안 맞는다.
        #
        #   `pages_add_navi.py` 는 빌드 스텝만 넣고 **결과 URL 을 확인하지
        #   않았다.** 빌드는 내내 성공하고 있었다. 자리가 틀렸을 뿐이다.
        #
        #   ★ 워킹트리를 부수지만 CI 는 일회용이고, 이 뒤 단계는 `web/navi`
        #     소스를 읽지 않는다(stage_pages 는 docs/proposal.docx 만 만진다).
        cd "$GITHUB_WORKSPACE/web"
        mv navi/dist navi.dist
        rm -rf navi
        mv navi.dist navi

        # ★ 자리가 맞는지 여기서 본다. 배포된 뒤에 브라우저로 확인하면
        #   늦고, 캐시 때문에 원인도 안 갈린다.
        grep -q 'src="/[^"]*/navi/assets/' navi/index.html || {
          echo "★ navi/index.html 이 빌드본이 아니다 — 자리 바꾸기가 실패했다"
          grep -o '<script[^>]*>' navi/index.html || true
          exit 1
        }
        echo "자리 확인 OK  $(grep -o 'src=\"[^\"]*\"' navi/index.html | head -1)"
