# 내비(React) 빌드 — 내비 빌드의 정본. `stage-site` 가 부른다.
#
# ★ 왜 합성 액션인가
#   Pages 는 저장소당 사이트 하나라 배포는 `web/` **전체**를 올린다. 그런데
#   `web/navi/dist` 는 `.gitignore` 라 저장소에 없다 — **빌드하지 않고 올리면
#   `/navi/` 가 404 가 된다.**
#
#   2026-09-05 에 내비를 붙이면서 당시 배포 넷 중 `pages.yml` 에만 빌드를
#   넣었다. 그래서 `docs.yml`(협업 방침)이나 `proposal.yml`(기획서)이 나중에
#   돌면 `/navi/` 가 404 가 됐다. `docs.yml` 머리말의 *"어느 쪽이 나중에 돌아도
#   결과가 완전하다"* 가 그날부터 거짓이었다. **2026-08-31 부분 배포 사고와
#   같은 형태다** — 그때는 파일이 빠졌고 그때는 폴더가 빠졌다.
#
#   같은 블록을 워크플로마다 복붙하면 정본이 여럿이 된다(R3). 한 곳에 둔다.
#   ★ 2026-09-23 (DECISIONS §224) — 배포 워크플로가 **하나**가 됐다. 그래도 이
#     액션은 남는다: 배포와 PR 시운전이 둘 다 이것을 거쳐야 같은 것을 짓는다.
name: 내비 빌드
description: web/navi 를 빌드해 web/navi/dist 에 둔다. Pages 아티팩트에 실린다.

inputs:
  mapbox-token:
    description: Mapbox public token. 없으면 스냅(Map Matching)이 죽는다.
    required: true
  ops-url:
    # ★ 2026-10-01 (DECISIONS §342 · §343). 관제 ↔ 내비 중개자의 주소.
    #   **비어도 빌드는 된다** — 전송이 `BroadcastChannel` 로 떨어지고 그것은
    #   같은 브라우저의 탭끼리만 닿는다. 그러면 배포된 화면에서 둘이 **안
    #   이어진다**. 그래서 비면 요란하게 적는다(아래 단계).
    description: 중개자 주소. 배포는 `wss://` 여야 한다(https 페이지).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        # ★ 2026-09-18 (DECISIONS §186-2). 정본은 `web/navi/.nvmrc` 하나다.
        #   종전에는 여기가 20, `contract` 의 내비 타입 검사가 22 였다 —
        #   **게이트와 빌드가 다른 런타임에서 돌았다.** 그 게이트는
        #   maplibre 5→6 이 PR 초록으로 통과해 main 에서 죽은 사고 때문에
        #   생긴 것인데(contract.yml), 런타임이 다르면 같은 형태가 또 난다.
        node-version-file: web/navi/.nvmrc
        cache: npm
        cache-dependency-path: web/navi/package-lock.json

    - name: 내비 빌드 (web/navi → web/navi/dist)
      shell: bash
      env:
        VITE_MAPBOX_TOKEN: ${{ inputs.mapbox-token }}
        VITE_OPS_URL: ${{ inputs.ops-url }}
      run: |
        # ★ 토큰이 없으면 여기서 죽는다. 종전에는 빈 문자열이 들어가고
        #   `config.ts` 가 `?? ""` 로 받아 **빌드도 배포도 성공했다.**
        #   런타임에 Map Matching 만 죽는다 — 초록불인데 실제로는 안 되는,
        #   이 저장소가 반복해 겪은 그 형태다. 원인 자리에서 죽는 편이 낫다.
        test -n "$VITE_MAPBOX_TOKEN" || {
          echo "★ MAPBOX_TOKEN 시크릿이 없다."
          echo "  Settings > Secrets and variables > Actions > New repository secret"
          echo "  이름 MAPBOX_TOKEN · 값은 Mapbox 의 pk. 토큰"
          echo "  ★ 번들에 박히므로 Mapbox 쪽에서 URL 제한을 같이 걸어라."
          exit 1
        }

        # ★ 2026-10-01 (DECISIONS §343-3). **`ws://` 를 여기서 죽인다.**
        #   Pages 는 https 이고 https 페이지는 평문 `ws://` 연결을 **브라우저가
        #   거부한다**(mixed content). 빌드는 성공하고 배포도 성공하고, 런타임에
        #   관제와 내비만 안 이어진다 — 토큰이 빈 문자열로 들어가던 그 형태다
        #   (바로 위 ★). 원인 자리에서 죽는 편이 낫다.
        case "$VITE_OPS_URL" in
          "")  echo "★ 중개자 주소가 없다 — 관제와 내비가 **같은 브라우저의 탭끼리만** 이어진다."
               echo "  Settings > Secrets and variables > Actions > Variables"
               echo "  이름 FIRE_LANE_OPS_URL · 값 wss://<중개자>/  (토큰이 아니라 주소다)" ;;
          wss://*) echo "중개자 주소 OK (wss)" ;;
          *)   # ★ 겹따옴표 안에서 백틱을 쓰지 않는다 — 그것은 **명령 치환**이고
               #   `wss://` 를 실행하려 든다. §323 이 백틱으로 당한 그 자리다.
               echo '★ 중개자 주소가 wss:// 가 아니다.' 
               echo "  Pages 는 https 다 — 평문 ws:// 는 브라우저가 거부하고,"
               echo "  빌드와 배포는 성공한 채 **런타임에만** 안 이어진다."
               exit 1 ;;
        esac

        # ★ base 는 `github.repository` 에서 온다. Pages 가
        #   `https://<user>.github.io/<repo>/` 로 서빙하므로 내비는
        #   `/<repo>/navi/` 아래에 산다. 저장소 이름을 손으로 박지 않는다.
        REPO="${GITHUB_REPOSITORY#*/}"
        echo "base = /$REPO/navi/"

        # ★ `npm ci` 다. `install` 은 package-lock 을 갱신할 수 있고,
        #   CI 가 잠금을 바꾸면 "내 기계에서는 됐는데" 가 재현된다.
        #   `uv sync --frozen` 과 같은 자리다.
        cd web/navi
        npm ci
        VITE_BASE="/$REPO/navi/" npm run build

        # ★ 빌드가 실패하면 배포가 멈춘다. 낡은 내비가 올라가면 그것이
        #   web/data 와 갈리고, 갈렸다는 것을 아무도 모른다.
        test -f dist/index.html || { echo "★ dist/index.html 이 없다"; exit 1; }
        echo "내비 빌드 $(du -sh dist | cut -f1)"

        # ★ **산출물 검사를 여기 적지 않는다.** 2026-09-30 (DECISIONS §323).
        #
        #   종전에는 「워커 자산이 산출물에 있는가」를 이 자리의 셸 한 줄이
        #   들었고, 그 한 줄이 **진입 청크(`dist/assets/index-*.js`)만** 읽었다.
        #   §313 이 청크를 가르자 워커 참조가 `maplibre-*.js` 로 옮겨갔다 —
        #   없어진 것은 워커가 아니라 **검사의 시야**였다. 어느 청크에 놓을지는
        #   번들러가 정하는데 검사가 자리를 박고 있었다.
        #
        #   그리고 그것이 **CI 에만 살았다.** 로컬 전수 verify 82/82 초록에서
        #   CI 가 빨갰다(3족 · 관문이 갈림). 게다가 진단이 한 줄도 안 나왔다 —
        #   `shell: bash` 는 `-eo pipefail` 이고, grep 이 미탐으로 1 을 내면
        #   **`echo "★ …"` 에 닿기 전에** `set -e` 가 단계를 죽인다. 사람이 본
        #   것은 `Error: Process completed with exit code 1.` 하나였다.
        #
        #   그래서 판정을 `tools/naviweight.py` 로 내렸다. 그것은 이미 `dist/` 를
        #   읽고, `verify.sh` 의 「내비 무게」가 **같은 도구**를 부른다. 문 하나다 —
        #   셸에 다시 적으면 그 문이 둘이 된다.
        #   ★ `uv` 는 `deploy.yml` 의 두 작업(`deploy` · `dry`)이 `stage-site`
        #     앞에서 깐다. `tests/test_navi_worker.py` 가 그 순서를 든다.
        cd "$GITHUB_WORKSPACE"
        uv run python tools/naviweight.py --build

        # ★ 2026-09-07. **dist 를 navi/ 자리에 앉힌다.** 이 세 줄이 없어서
        #   09-05 부터 내비가 안 떴다.
        #
        #   `upload-pages-artifact` 는 `path: web` 을 올린다. 그러면
        #       web/navi/index.html       → /<repo>/navi/        소스
        #       web/navi/dist/index.html  → /<repo>/navi/dist/   빌드본
        #   이 되어 **소스가 빌드본을 가린다.** 브라우저가 받는 것은 Vite
        #   개발용 `index.html` 이고 `<script src="/src/main.tsx">` 를 그대로
        #   요청한다 — 404 다. 게다가 `VITE_BASE` 가 `/navi/` 라 `/navi/dist/`
        #   로 직접 들어가도 자산 경로가 안 맞는다.
        #
        #   `pages_add_navi.py` 는 빌드 스텝만 넣고 **결과 URL 을 확인하지
        #   않았다.** 빌드는 내내 성공하고 있었다. 자리가 틀렸을 뿐이다.
        #
        #   ★ 워킹트리를 부수지만 CI 는 일회용이고, 이 뒤 단계는 `web/navi`
        #     소스를 읽지 않는다(stage_pages 는 docs/proposal.docx 만 만진다).
        cd "$GITHUB_WORKSPACE/web"
        mv navi/dist navi.dist
        rm -rf navi
        mv navi.dist navi

        # ★ 자리가 맞는지 여기서 본다. 배포된 뒤에 브라우저로 확인하면
        #   늦고, 캐시 때문에 원인도 안 갈린다.
        grep -q 'src="/[^"]*/navi/assets/' navi/index.html || {
          echo "★ navi/index.html 이 빌드본이 아니다 — 자리 바꾸기가 실패했다"
          grep -o '<script[^>]*>' navi/index.html || true
          exit 1
        }
        echo "자리 확인 OK  $(grep -o 'src=\"[^\"]*\"' navi/index.html | head -1)"

        # ★ 2026-09-25 (§258). **관제를 루트에 앉힌다.**
        #   배포면은 둘이다 — 관제(`/<repo>/`) · 내비(`/<repo>/navi/`). 종전에는
        #   관제의 공개 주소가 `navi/?view=ops` 였고 루트는 거기로 튕기는
        #   리다이렉트였다. 쿼리스트링은 주소가 아니고, 리다이렉트를 「화면」이라
        #   부른 문서가 석 달 낡아 있었다.
        #
        #   자산 경로가 절대(`/<repo>/navi/assets/`)라 **같은 빌드본을 루트에
        #   두면 그대로 뜬다.** 화면 선택은 `window.__FL_VIEW` 로 박는다 —
        #   경로로 판정하면 dev 서버(루트가 web/navi)에서 기본 화면이 뒤집힌다.
        #   ★ 히어독을 안 쓴다. YAML 블록 안에서는 들여쓰기가 그대로 딸려가
        #     파이썬이 IndentationError 를 낸다. `sed` 한 줄이면 된다.
        sed 's#</head>#<script>window.__FL_VIEW="ops"</script></head>#' \
          navi/index.html > index.html

        grep -q '__FL_VIEW="ops"' index.html \
          || { echo "★ 루트 index.html 에 관제 표시가 없다"; exit 1; }
        grep -q 'src="/[^"]*/navi/assets/' index.html \
          || { echo "★ 루트 index.html 이 빌드본이 아니다"; exit 1; }
        echo "루트 = 관제 OK"
