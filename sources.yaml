# ===== /AUTO =====
# ── 산출물 ────────────────────────────────────────────────────
# consumers 가 "이 데이터를 지금 누가 쓰고 있나"다.
# 이게 없으면 소스 하나를 못 건드린다. datalog.py impact 가 이걸 읽는다.
outputs:
  segments_schema:
    produced_by: src/firelane/segments.py
    path: data/processed/segments.schema.json
    inputs: [segments]
    consumers:
    - src/firelane/publish_web.py
    - src/firelane/contract.py
    - tests/test_contract.py
    note: |
      segments.geojson 의 컬럼 계약. publish 가 web/data 로 사본을 낸다.
      ★ 2026-09-04 등재. `Step('segments').writes` 에는 있었고
        `layers.processed.committed_exceptions` 에도 이름이 있었는데
        **`outputs` 에만 없었다** — 같은 파일을 세 곳이 각자 들고 있고
        강제는 한 곳에만 걸려 있었다.
      ★ `test_step_writes_are_declared_in_the_ledger` 가 잡았다.
        종전 `test_no_undeclared_output` 은 디스크를 훑어서 파이프라인
        820초를 태우고 나서야 알았고, 이 파일은 그때도 안 잡혔다 —
        committed_exceptions 의 이름을 등재로 오인할 여지가 있었다.
  scope:
    produced_by: src/firelane/segments.py
    path: data/processed/scope_5186.gpkg
    inputs: [boundary_emd, fire_station]
    consumers:
    - src/firelane/ortho.py
    - src/firelane/publish_web.py
    note: |
      표출 스코프. 동명동 경계 60m 버퍼 ∪ 접근 회랑 70m ∪ 안전센터 300m.
      ★ 2026-09-04 신설. 종전에는 publish_web 이 계산해
        `web/data/scope.geojson` 으로 냈는데, `ortho` 가 그것을 읽었다 —
        STEPS 순서가 … → ortho → publish 라 **뒤 단계 산출을 앞 단계가
        읽고 있었다.** 늘 지난 실행의 스코프로 정사영상을 구웠다.
      ★ 재료(corridor_5186.gpkg · boundary_emd · fire_station)가 전부
        segments 시점에 있어 계산을 그리로 올렸다. 순방향이 됐다.
      ★ `web/data/scope.geojson` 은 발행하지 않는다. 처음부터 화면이
        읽지 않았고 ortho 전용 중간 산출물이었다.
  segments:
    produced_by: src/firelane/segments.py
    path: data/processed/segments.geojson
    inputs: [ngii1k, ngii_road, road_rw, road_link, building, building_entrance, boundary_emd, cctv, fire_station, node_link, turn_restriction]
    stable_key: seg_uid
    consumers:
    - web/js/data.js
    - src/firelane/publish_web.py
    - src/firelane/sample_design.py
    - tests/test_contract.py
    # ★ 2026-09-03. 셋을 더했다. `test_declaration_reality` 가 실물에서
    #   찾아냈다 — 손대장이라 읽는 쪽이 늘어도 아무도 안 적었다.
    - src/firelane/guards.py
    - src/firelane/pipeline.py
    - tools/width_fn.py
    what: 구간 단위 통행 판정. verdict 4종 + 폭 + CCTV 가시성
    verified: false
    known_issues:
    - 폭 실측 검증 0건. 소방서 7구간 대조는 학습셋이라 검증이 아니다
    - width>30m 24건 중 19건은 필문대로. 대로=40m 이상이라 정상값
    - 실질 잔여 3건은 본선+측도 병합. 도로대장 정보공개청구(17337943)는
      2026-08-24 부존재 종결 — "취합·가공" 사유. 재청구 중이나 전건이
      아니다. 분리는 ngii1k_center 중심선으로 한다(PLAN §1-26 · §4-7)

    derives:
      - path: data/processed/segments_5186.gpkg
        what: 같은 구간의 5186 판. QGIS·공간연산용. geojson 은 4326 이라 거리 계산이 안 된다
      - path: data/processed/width_samples.csv
        what: 구간별 폭 표본 원자료. 채택 전 전량이라 w(s) 함수로 다룰 수 있다(tools/width_fn.py)
      - path: data/processed/uncovered_units.json
        what: 폭 소스가 못 덮은 산출단위. width_cov 0.5 미만 추적용(PLAN §3-1)
  ngii1k_center:
    produced_by: src/firelane/ngii1k.py
    path: data/processed/ngii1k_center_5186.gpkg
    inputs: [ngii1k]
    consumers: [src/firelane/segments.py]
    what: |
      도로중심선 A0020000. 측량 성과 도로폭·일방통행·차로수 속성 보유.
      우리 기하 계산과 독립이라 대조 검증에 쓴다(절대편차 중앙 0.32m, n=909).
    verified: true
    known_issues:
    - 도로폭 0.500 은 차량 통행 불가 통로 코드. 스코프 내 7건 전수 확인
    - 짧은 링크에는 본선 폭이 붙는다. 검증 기준으로는 긴 구간만 쓸 것

  ngii1k_walk:
    produced_by: src/firelane/ngii1k.py
    path: data/processed/ngii1k_walk_5186.gpkg
