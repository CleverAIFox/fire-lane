# ── 산출물 ────────────────────────────────────────────────────
# consumers 가 "이 데이터를 지금 누가 쓰고 있나"다.
# 이게 없으면 소스 하나를 못 건드린다. datalog.py impact 가 이걸 읽는다.
outputs:
  segments:
    produced_by: src/firelane/segments.py
    path: data/processed/segments.geojson
    inputs: [ngii1k, ngii_road, road_rw, road_link, building, building_entrance, boundary_emd, cctv, fire_station, node_link, turn_restriction]
    stable_key: seg_uid
    consumers:
    - web/app.js
    - src/firelane/publish_web.py
    - src/firelane/sample_design.py
    - tests/test_contract.py
    what: 구간 단위 통행 판정. verdict 4종 + 폭 + CCTV 가시성
    verified: false
    known_issues:
    - 폭 실측 검증 0건. 소방서 7구간 대조는 학습셋이라 검증이 아니다
    - width>30m 24건 중 19건은 필문대로. 대로=40m 이상이라 정상값
    - 실질 잔여 3건은 본선+측도 병합. 도로대장 청구 중(2026-08-14)

  ngii1k_center:
    produced_by: src/firelane/ngii1k.py
    path: data/processed/ngii1k_center_5186.gpkg
    inputs: [ngii1k]
    consumers: [src/firelane/segments.py]
    what: |
      도로중심선 A0020000. 측량 성과 도로폭·일방통행·차로수 속성 보유.
      우리 기하 계산과 독립이라 대조 검증에 쓴다(절대편차 중앙 0.32m, n=909).
    verified: true
    known_issues:
    - 도로폭 0.500 은 차량 통행 불가 통로 코드. 스코프 내 7건 전수 확인
    - 짧은 링크에는 본선 폭이 붙는다. 검증 기준으로는 긴 구간만 쓸 것

  ngii1k_walk:
    produced_by: src/firelane/ngii1k.py
    path: data/processed/ngii1k_walk_5186.gpkg
    inputs: [ngii1k]
    consumers: []
    what: 보도 A0033320. 차도폭 분리용
    verified: false
    known_issues:
    - 772건이나 구간 커버율 13%. 전면 차감 불가

  ngii1k_xsec:
    produced_by: src/firelane/ngii1k.py
    path: data/processed/ngii1k_xsec_5186.gpkg
    inputs: [ngii1k]
    consumers: [src/firelane/segments.py]
    what: |
      평면교차점 A0080000. 교차부 실제 형상.
      XSEC_EXCL(노드 반경 5m) 눈대중을 대체한다.
      등가반경 중앙 3.2m · p90 7.5m 라 고정 반경은 양쪽으로 틀렸다.
    verified: true

  seg_uid_map:
    produced_by: src/firelane/segkey.py
    path: data/processed/seg_uid_map.csv
    inputs: [segments]
    consumers: [tests/test_contract.py]
    what: 런 간 seg_uid 유지율 대조 이력. 게이트 90%
    verified: true

  field_sample:
    produced_by: src/firelane/sample_design.py
    path: data/field/sample_segments.csv
    inputs: [segments]
    stable_key: seg_uid
    consumers: [data/field/fieldsheet.md]
    what: 실측 대상 25구간(트랙 A12/B8/C5) + 관측점 75. 시드 20260814
    verified: false
    known_issues:
    - 트랙 C 5구간은 봉인. 분석에 쓰면 외부 검증 수단이 다시 0이 된다
