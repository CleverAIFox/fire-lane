# ============================================================
# sources.yaml — raw 데이터 대장 (single source of truth)
#
# 규칙
#   * 여기 없는 파일은 파이프라인에 들어오지 않는다.
#   * crs 는 실제 확인값이다. .prj를 믿지 말고 probe.py crs 로 검증한 값을 적는다.
#   * data/raw/ 안의 파일은 절대 수정·리네임하지 않는다.
#   * 확보일(retrieved)을 비워두지 않는다. 발표에서 출처 질문이 반드시 나온다.
#
# 2026-08-17 전량 재확보. 원본은 외장 SSD fire-lane-data/ (landing) 에 있고
# acquire 로 raw 에 편입한다. 대장에 없는 파일은 _quarantine 으로 격리한다.
#
# 메타 항목 (URL 은 적지 않는다. 자주 깨지고 provider+scope 면 다시 찾는다)
#   provider  어느 사이트에서 받았나
#   updated   데이터 갱신일 (다운로드일 아님)
#   acquired  우리가 받은 날
#   scope     공간 범위 + 건수
#   crs       좌표계. ★ "명시"와 "추정"을 구분해서 적을 것
#
# contract  는 편입 후 inventory.py 가 생성한다. MASTER §18-3b
# ============================================================

project: fire-lane
target_area: 전남광주통합특별시 동구 동명동
bbox_4326: [126.907, 35.140, 126.940, 35.162]   # 임시. 행정구역경계 확보 시 교체
standard_crs:
  metric: EPSG:5186     # 거리·면적·버퍼 계산은 무조건 이쪽
  display: EPSG:4326    # 웹 표출 / GeoJSON

datasets:

  # ── 도로 그래프 뼈대 ─────────────────────────────────────
  # ★ road_link / road_rw 는 juso_road_geom(291MB, 6월) 을 보고 있으나
  #   juso_elctrnmap(7MB, 7월) 의 TL_SPRD_MANAGE / TL_SPRD_RW 와 동일하다.
  #   전자지도로 통일하면 291MB 를 받지 않아도 되고 기준월도 맞는다.
  #   전환 시 file 을 juso/juso_elctrnmap_jngj_20260711.zip 으로 바꾸면 된다.
  road_link:
    what: 도로명주소 도로구간 (선형). RN·ROAD_BT 보유
    crs_native: 5179
    vintage: 2026
    desc: 도로명주소 도로구간 (선형). RN·ROAD_BT 보유
    kind: shp_zip
    file: juso/juso_elctrnmap_jngj_20260711.zip
    layer: TL_SPRD_MANAGE.shp
    crs: EPSG:5179
    encoding: cp949
    url: https://business.juso.go.kr/addrlink/elctrnMapProvd/geoDBDwldList.do
    license: 도로명주소법 시행령 제46조 심사 승인
    retrieved: 2026-08-09
    note: |
      ★ .prj 파일이 zip에 없다. CRS 미정의 상태로 읽힌다.
        좌표값 7자리+7자리 → EPSG:5179 확정. set_crs로 강제 정의할 것.
      ★ ROAD_BT는 판정에 쓰지 않는다(§도로폭 참조). 골격과 rds_man_no만 사용.
      ★ ROAD_LT도 쓰지 않는다. 클리핑 전 원본 연장이라 최대 5.5배 과대.
      2026-07-01 전남광주통합특별시 개편 반영본. SIG_CD가 12xxx로 변경됨
      (구 광주 동구 29110 → 12210). 기존 코드 필터 전부 수정 필요.

    contract:
      encoding: cp949
      layer_must_exist: true
  road_rw:
    what: 도로명주소 실폭도로 (면). 도로폭 폴백 소스
    crs_native: 5179
    vintage: 2026
    license: TODO
    desc: 도로명주소 실폭도로 (면). 도로폭 폴백 소스
