      쓸 수 있는 것: 표고 33.3~75.3m, 기복 42m 라는 배경 서술 + 3D 입체감.
      A* 경사 비용함수에는 5m DEM 이 필요하나, 안심구역은 원본 반출이 안 된다.

      ★ 2026-08-25 정정. 종전 기록은 "등판 한계(11~17°)를 넘지 않는다" 였다.
        **그 11~17° 는 출처가 없다.** 공식값은 KFS 5종 §4.4.1 이 정하는
        18 % 등판 = **10.204°** 이며, 가정했던 하한 11° 보다도 낮다.

            공개DEM 90m 최대 경사   9.0°
            KFS §4.4.1 등판 한계   10.2°
            여유                    1.2°

        위 두 줄이 "평활화로 경사가 실제보다 낮게 나온다" 고 적고 있다.
        낮게 나오는 값이 한계선 1.2° 아래에 있다 — 경사 배제 결론의 근거는
        종전에 적힌 것보다 훨씬 얇다. 결론을 뒤집지는 않되, 정밀 DEM 보류
        판단(PLAN §8-3)은 이 숫자로 다시 봐야 한다.

