    kind: csv_points
    file: gjcity/gjcity_parking_dongu_20260811.csv
    crs: EPSG:4326
    encoding: utf-8-sig
    x_col: 경도
    y_col: 위도
    retrieved: 2026-08-11
    note: |
      광주 동구 + 광주도시공사 주차장정보 병합본.
      스코프 안 65개(동명동 6개). 노외 64 / 노상 1.
      ★ 유효폭 산출에는 쓸 수 없다. 대부분 노외주차장이라 골목 노면과 무관하다.
      쓸 수 있는 것: 주차 부족이 골목 주차로 이어진다는 논거, 소방활동 전개 공간.

  ortho:
    desc: 항공정사영상 2025 (도엽 35616037/038/047/048). 지상표본거리 25cm
    kind: raw_only
    file: ngii/ngii_ortho_gj*.tif
    crs: EPSG:5186
    url: https://map.ngii.go.kr
    license: 국토지리정보원
    retrieved: 2026-08-11
    note: |
      원본 TIF 에 geotransform 이 없다. 메타데이터 XML 에
      "TM 중부원점 / GRS80 / Easting 200000 / Northing 600000" (= EPSG:5186) 만 적혀 있다.
      src/etl/ortho.py 가 도엽 격자로 좌표를 역산해 붙인다.
      검증: 같은 도엽 수치지도(5179)와 도엽 간격 일치 (동서 2277.2m · 남북 2772.5m).
      정사영상은 도엽보다 2379x2874m 로 커서 사방 약 51m 오버랩이다.
      ★ 배경 텍스처 전용이다. 판정에는 쓰지 않는다.
        래스터에서 도로 경계를 읽으려면 세그멘테이션이 필요하고
        그림자·처마·주차 차량 때문에 정확도가 안 나온다.
        폭은 벡터(실폭도로·건물 폴리곤)로 잰다.
      산출: web/data/ortho/{z}/{x}/{y}.jpg (388장, z15~18, 8.3MB)
      4도엽 전량 1.25GB. ingest 는 읽지 않는다(raw_only).

