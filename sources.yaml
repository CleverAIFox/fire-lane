# ============================================================
# sources.yaml — raw 데이터 대장 (single source of truth)
#
# 규칙
#   * 여기 없는 파일은 파이프라인에 들어오지 않는다.
#   * crs 는 실제 확인값이다. .prj를 믿지 말고 probe.py crs 로 검증한 값을 적는다.
#   * data/raw/ 안의 파일은 절대 수정·리네임하지 않는다.
#   * 확보일(retrieved)을 비워두지 않는다. 발표에서 출처 질문이 반드시 나온다.
#
# 2026-08-09 기준 전량 확보 완료. 미확보는 pending 섹션 참조.
# ============================================================

project: fire-lane
target_area: 전남광주통합특별시 동구 동명동
bbox_4326: [126.907, 35.140, 126.940, 35.162]   # 임시. 행정구역경계 확보 시 교체
standard_crs:
  metric: EPSG:5186     # 거리·면적·버퍼 계산은 무조건 이쪽
  display: EPSG:4326    # 웹 표출 / GeoJSON

datasets:

  # ── 도로 그래프 뼈대 ─────────────────────────────────────
  # ★ road_link / road_rw 는 juso_road_geom(291MB, 6월) 을 보고 있으나
  #   juso_elctrnmap(7MB, 7월) 의 TL_SPRD_MANAGE / TL_SPRD_RW 와 동일하다.
  #   전자지도로 통일하면 291MB 를 받지 않아도 되고 기준월도 맞는다.
  #   전환 시 file 을 juso/juso_elctrnmap_jngj_20260711.zip 으로 바꾸면 된다.
  road_link:
    desc: 도로명주소 도로구간 (선형). RN·ROAD_BT 보유
    kind: shp_zip
    file: juso/juso_elctrnmap_jngj_20260711.zip
    layer: TL_SPRD_MANAGE.shp
    crs: EPSG:5179
    encoding: cp949
    url: https://business.juso.go.kr/addrlink/elctrnMapProvd/geoDBDwldList.do
    license: 도로명주소법 시행령 제46조 심사 승인
    retrieved: 2026-08-09
    note: |
      ★ .prj 파일이 zip에 없다. CRS 미정의 상태로 읽힌다.
        좌표값 7자리+7자리 → EPSG:5179 확정. set_crs로 강제 정의할 것.
      ★ ROAD_BT는 판정에 쓰지 않는다(§도로폭 참조). 골격과 rds_man_no만 사용.
      ★ ROAD_LT도 쓰지 않는다. 클리핑 전 원본 연장이라 최대 5.5배 과대.
      2026-07-01 전남광주통합특별시 개편 반영본. SIG_CD가 12xxx로 변경됨
      (구 광주 동구 29110 → 12210). 기존 코드 필터 전부 수정 필요.

  road_rw:
    desc: 도로명주소 실폭도로 (면). 도로폭 폴백 소스
    kind: shp_zip
    file: juso/juso_elctrnmap_jngj_20260711.zip
    layer: TL_SPRD_RW.shp
    crs: EPSG:5179
    encoding: cp949
    retrieved: 2026-08-09
    note: |
      winding order 오류 폴리곤 포함. make_valid + buffer(0) 없이 unary_union 하면
      GEOS TopologyException 발생. 실제로 터졌음.
      수치지도가 안 그리는 최협소 골목을 메우는 용도.

  spotaddr_geom:
    desc: 사물주소 도형 (전남광주통합특별시 동구, 2026-08-01 승인분)
    kind: raw_only
    file: juso/juso_spotaddr_geom_jngj_20260801.zip
    crs: 5179
    license: 도로명주소법 시행령 제46조 심사 승인
    url: https://business.juso.go.kr/addrlink/elctrnMapProvd/geoDBDwldList.do
    feeds: 미투입 — STEP 4 관측점 랜드마크 후보
    note: |
      동구 전체 27유형 중 실데이터 15유형. 동명동은 26건뿐이다.
      공중전화 8 · 버스정류장 6 · 무더위쉼터 4 · 민방위대피소 4 ·
      비상소화장치 1 · 우체통 1 · 자전거보관소 1 · 어린이보호구역 1.
      폭 판정 · 그래프 · 영상판정 어디에도 기여하지 않는다.
      쓸 자리는 §7-2 관측점 랜드마크 후보 하나뿐이며 STEP 4 이전에는
      파이프라인에 붙이지 않는다.
      ⚠ .prj 없음 → set_crs(5179) 명시 필요. TXT/DBF 는 CP949.
      ⚠ 0건 유형 파일의 내용이 "No Data" 한 줄이라 파서가 죽는다.
      ⚠ OutFireHydr(옥외소화전) 0건. 소화전 588개 좌표 문제는 그대로다.

  spotaddr_ref:
    desc: 사물주소 기준점 (동일 승인분)
    kind: raw_only
    file: juso/juso_spotaddr_ref_jngj_20260801.zip
    crs: 5179
    license: 도로명주소법 시행령 제46조 심사 승인
    feeds: 미투입 — STEP 4 관측점 랜드마크 후보
    note: |
      파이프 구분 TXT. _M(사물) / _ADRES(주소·좌표) 짝이다.
      좌표 정밀도가 m급이라 호모그래피 대응점으로는 쓸 수 없다.
      landmark_desc 초안과 관측점 후보 선정에만 쓴다.

  ngii1k:
    desc: 수치지형도 1:1,000 도로경계 A0010000 — 폭 산출 주 소스
    kind: ngii1k
    file: ngii1k/
    crs: 5186
    url: https://map.ngii.go.kr/ms/map/NlipMap.do
    note: |
      도엽 하나가 456 x 555m. 스코프를 덮으려면 12장 이상 필요하다.
      2022년~ SHP(N1A_/N1L_) · ~2020년 NGI 텍스트. GDAL 에 NGI 드라이버가
      없어 src/etl/ngii1k.py 가 직접 파싱한다. 같은 도엽은 최신 연도 채택.

  streetlight:
    desc: 전남광주통합특별시 동구 가로등현황 (2024-04-15)
    kind: csv_points
    file: gjcity/*streetlight*.csv
    crs: 4326
    encoding: cp949
    x_col: 경도
    y_col: 위도
    note: |
      동구 3,805행 / 고유 좌표 264곳. 동명동 159등 / 13곳.
      지번 단위 회로 대표점이라 개별 폴 위치가 아니다.
      지도 마커로 쓰면 없는 위치를 그리는 것이 된다.
      세그먼트 반경 50m 내 등수 합(light_count)으로만 쓴다.

  ngii_road:
    desc: 국가기본공간정보 수치지도 도로경계면 NF_A_A01000 (1:5,000) — 도로폭 주 소스
    kind: shp_zip_multi
    file: ngii/ngii_basemap_gj*.zip      # 광주 037/038/047/048 4도엽
    layer: NF_A_A01000.shp
    crs: EPSG:5179
    encoding: utf-8                        # ★ cp949 아님. .cpg가 UTF-8
    url: https://map.ngii.go.kr
    license: 국토지리정보원
    retrieved: 2026-08-09
    note: |
      ★ 좌표계 EPSG:5179. (정사영상 도곽표는 5186이므로 겹칠 때 통일 필요)
      ★ rvwd 컬럼 = 도로폭 속성. 1.5~46.0m, 정수 76%.
        ROAD_BT(정수 90%, 2.0에 30% 몰림)보다 세분화됨. 교차검증용으로 반드시 병행.
      ★ 최협소 골목을 도로면으로 그리지 않음. 표본 100개 중 70개만 커버.
        나머지는 road_rw 폴백.
      도엽 커버리지(5179): X 945,332~949,918 / Y 1,681,228~1,686,800

  node_link:
    desc: 표준노드링크 MOCT_LINK. 위상 정답지 + LANES/MAX_SPD
    kind: shp_zip
    file: its/its_nodelink_kr_20260810.zip
    layer: MOCT_LINK.shp
    crs: EPSG:5186
    url: https://www.its.go.kr/nodelink/nodelinkRef
    license: 공공누리 제1유형
    retrieved: 2026-08-09
    note: |
      교차로에서 위상이 정리되어 있음(미분할 접점 7 vs 도로구간 2,338).
      단, 골목을 담지 않음 — 폭 2m 이하 링크가 3%뿐.
      그래프 뼈대로 쓰지 말고 위상 검증·간선망 대조용으로 쓸 것.
      REST_W(제한폭)는 전량 0. 미기입 필드.

  node_point:
    desc: 표준노드링크 MOCT_NODE. 교차로 노드
    kind: shp_zip
    file: its/its_nodelink_kr_20260810.zip
    layer: MOCT_NODE.shp
    crs: EPSG:5186
    retrieved: 2026-08-09

  turn_restriction:
    desc: 회전제한 TURNINFO. D-07 방향성 / D-08 회전 판정 근거
    kind: dbf_in_zip
    file: its/its_nodelink_kr_20260810.zip
    layer: TURNINFO.dbf
    crs: none
    retrieved: 2026-08-09

  # ── 공간 조인 레이어 ─────────────────────────────────────
  cctv:
    desc: 전남광주통합특별시 CCTV. 촬영방면·설치연도 포함
    kind: csv_points
    file: safety/safety_cctv_jngj_20260630.csv
    crs: EPSG:4326
    encoding: utf-8
    x_col: 경도
    y_col: 위도
    url: https://www.data.go.kr/data/15084631/fileData.do
    license: 공공누리 제1유형
    retrieved: 2026-08-09
    note: |
      ★ 설치연도별로 행이 분리되어 있다. 행 수를 개소 수로 세면 안 된다.
        동명동 52행 = 고유 27지점 / 카메라 86대.
        기존 문서의 "CCTV 53개소"는 근거 불명. 폐기하고 27로 통일할 것.
      촬영방면 전량 360도(PTZ) → 관측 방향 제약 없음.

  fire_station:
    desc: 소방청 전국소방서 좌표현황. 소방서 + 119안전센터
    kind: csv_points
    file: safety/safety_firestation_kr_20240901.csv
    crs: EPSG:4326
    encoding: utf-8
    x_col: Y좌표          # ★ 컬럼명이 반대다. X좌표에 위도, Y좌표에 경도가 들어있음
    y_col: X좌표
    url: https://www.data.go.kr/data/15138232/fileData.do
    retrieved: 2026-08-09
    note: |
      ★ 출동은 소방서가 아니라 119안전센터에서 나간다.
        동명동 관할: 대인119안전센터(35.154579, 126.914765, 동부소방서와 동일 주소)
                    지산119안전센터(35.149963, 126.938531)
        D-28 시나리오 출발점은 이 둘이다.

  poi_store:
    desc: 소상공인 상가(상권)정보 광주권. 상가 밀집도 = 주차압력 프록시
    kind: csv_points_in_zip
    file: sbiz/sbiz_store_kr_20260630.zip
    inner_contains: 광주
    note_inner: |
      전국판 zip 이라 시도별 CSV 가 들어 있다. 광주 파일만 고른다.
      기존 광주권 개별 파일과 내용은 같다.
    crs: EPSG:4326
    x_col: 경도
    y_col: 위도
    url: https://www.data.go.kr/data/15083033/fileData.do
    license: 공공누리 제1유형
    retrieved: 2026-08-09
    note: |
      건물관리번호로 건물 폴리곤과 조인 가능(구 코드 2911... 유지).
      ★ 행정동명 '동명동'으로 필터하면 목포시 동명동이 섞인다.
        시군구코드 12210(동구) 조건 필수.
      동명동 1,070건 / 음식 421 소매 275.

  # -- 행정경계·건물 (도로명주소 전자지도, 2026-08-11 승인) --
  boundary_emd:
    desc: 읍면동 행정구역경계. 동명동 정식 폴리곤 (EMD_CD 12210108)
    kind: shp_zip
    file: juso/juso_elctrnmap_jngj_20260711.zip
    layer: TL_SCCO_EMD.shp
    crs: EPSG:5179
    encoding: cp949
    url: https://business.juso.go.kr/addrlink/elctrnMapProvd/geoDBDwldList.do
    license: 도로명주소법 시행령 제46조 심사 승인
    retrieved: 2026-08-11
    note: |
      pending.boundary 해소. bbox_4326 대신 이 폴리곤으로 클립할 것.
      동구 34개 읍면동 중 동명동 = EMD_CD 12210108, 면적 0.4289 km2.
      레이어별 .prj 없음. 동봉 GRS80_UTMK.prj가 EPSG:5179와 파라미터 완전일치.
      datum명이 ESRI식 D_ITRF_2000이라 to_epsg() 자동인식만 실패. set_crs로 강제할 것.
      동 경계로 도로를 clip하면 그래프가 깨진다(연결요소 70개 / 최대 34%).
      분석 대상은 동명동, 그래프는 buffer(200m) 포함으로 만들 것.

  building:
    desc: 건물 폴리곤. GRO_FLO_CO(지상층수) 보유 - 3D extrusion 재료
    kind: shp_zip
    file: juso/juso_elctrnmap_jngj_20260711.zip
    layer: TL_SPBD_BULD.shp
    crs: EPSG:5179
    encoding: cp949
    retrieved: 2026-08-11
    note: |
      pending.building 해소. raw_only.building_change(변동분 865건)는 폐기.
      동명동 2,085동. GRO_FLO_CO 결측 0, 평균 1.43층, 1층이 55%(1,138동).
      EMD_CD가 3자리('108')로 저장됨. 8자리 '12210108'과 직접 조인하면 0건.
      0층 291동(14%) 존재. 무허가·부속건물 추정. 높이 환산 시 1층으로 클리핑.

  building_entrance:
    desc: 건물출입구 포인트. 소방차 도달 목표점
    kind: shp_zip
    file: juso/juso_elctrnmap_jngj_20260711.zip
    layer: TL_SPBD_ENTRC.shp
    crs: EPSG:5179
    encoding: cp949
    retrieved: 2026-08-11
    note: |
      동명동 1,313개. 도달점을 건물 중심점이 아니라 실제 출입구로 잡을 수 있다.
      D-28 우회비용 비교의 목적지는 이 레이어다.

  hydrant_point:
    desc: 전국소방용수시설 표준데이터. 소화전 좌표
    kind: csv_points
    file: safety/safety_hydrant_point_kr_20260811.csv
    crs: EPSG:4326
    encoding: utf-8
    x_col: 경도
    y_col: 위도
    url: https://www.data.go.kr/data/15065056/standard.do
    license: 공공누리 제1유형
    retrieved: 2026-08-09
    note: |
      pending.hydrant_point 부분 해소. 단 공개율 5%.
      hydrant_summary(집계표) 기준 동부소방서 관할 588개 중 공개 31개.
      전량 확보는 여전히 D-30 인터뷰 필요. "588 중 31"은 그대로 발표 논거.

  # -- 검증·보조 (2026-08-11) --
  fire_access:
    desc: 동부소방서 소방통로확보대상 지역 현황. 소방서가 직접 지정·관리하는 구간
    kind: csv_table
    file: safety/safety_fire_access_gj_dong_20250731.csv
    encoding: cp949
    url: https://www.data.go.kr
    license: 공공누리 제1유형
    retrieved: 2026-08-11
    note: |
      ★ 이 프로젝트의 사실상 정답 데이터다.
        20구간 / 연장 7,120m / 3,452세대. 구간거리와 폭(m)이 기록돼 있다.
        동명동 2건: 동명로20번길 31(200m, 5m, 400세대) / 동계로9번길 12(220m, 6m, 320세대)
      ★ 좌표가 없다. 지역명의 도로명으로만 매칭 가능하다.
        도로명 전체 연장(1,807m)과 지정 구간(200m)이 달라 중앙값 비교는 부정확하다.
        정밀 대조에는 기초구간(TL_SPRD_INTRVL) 또는 D-30 인터뷰의 구간 좌표가 필요하다.
      ★ 8/9에 "미연결 파편"으로 분류했던 동명로20번길이 실제 소방서 지정 구간이었다.
        데이터 결함으로 본 곳이 위험구간이다.

  dem_public:
    desc: 국토지리정보원 공개DEM 도엽 35616
    kind: raw_only
    file: ngii/ngii_dem_gj35616_20251117.zip
    crs: EPSG:5179
    retrieved: 2026-08-11
    note: |
      ★ 해상도 90m. 동명동 전체가 12x12 픽셀이다. 세그먼트별 경사 산출 불가.
        한 픽셀이 골목 20개를 덮는다. 평활화로 경사가 실제보다 낮게 나온다.
      ★ 판정에는 쓰지 않는다. 표현용으로만 쓴다.
        src/etl/terrain.py 가 스코프로 클립 + 8배 이중선형 보간 후
        data/processed/dem_scope.tif 와 각 레이어의 z 컬럼을 만든다.
        보간은 없는 정보를 만드는 게 아니라 계단 현상을 없애는 것이다.
      쓸 수 있는 것: 표고 33.3~75.3m, 기복 42m 라는 배경 서술 + 3D 입체감.
      A* 경사 비용함수에는 5m DEM 이 필요하나, 안심구역은 원본 반출이 안 된다.
      다만 90m 로도 최대 경사 9.0°가 나와 소방차 등판 한계(11~17°)를 넘지 않는다.
      → 경사는 진입 제약 요인이 아님을 확인했고, 정밀 DEM 확보는 보류한다.

