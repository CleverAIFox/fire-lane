    what: 국토정보플랫폼 수치지도에 딸려오던 xlsx 12개
    at: 2026-08-17
    reason: |
      ISO 19115 메타데이터 작성 서식. 도엽 본체가 아니다.
      12개가 전부 440KB 로 내용이 거의 같고 파이프라인이 읽은 적 없다.

  cctv_spatialmarket:
    what: 공간데이터마켓 CCTV 설치정보
    at: 2026-08-16
    reason: |
      "전남"이 전라남도였다. 18,685건 중 광주 1건 · 동명동 0건.
      좌표계 명시·설치목적 속성이 매력적이나 스코프 불일치.
      광주 판이 올라오면 재검토.

  precise_road_map:
