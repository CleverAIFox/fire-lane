# ── 스코프 통제 어휘 ──────────────────────────────────────────
# ★ 신설. 종전에는 `scope: 전국` 처럼 산문이었고, 파일명 토큰은 여섯
#   갈래가 **세 개 축**을 한 자리에 뭉개고 있었다 —
#
#     행정구역   kr · jngj · gjdonggu · dongu · (없음)
#     관할기관   gj_dong          ← 동부소방서다. 동구가 아니다
#     도엽       gj9708 · gj35616 · gj037
#
#   `gj_dong` 과 `dongu` 가 눈으로 안 갈리는 것이 제일 나쁘다. 관할서
#   자료를 행정구역으로 클립하면 결손이 조용히 난다.
#
#   축을 셋으로 가른다 — scope(여기) · authority(항목 필드) · part(파일명).
#   `firelane.scope` 가 이 블록을 읽고 `firelane.naming` 이 파일명 문법의
#   고정점으로 쓴다. **별칭 안에 언더스코어를 쓰지 않는다** — 그것이
#   파일명 필드 구분자라 `gj_dong` 처럼 경계를 못 찾게 된다.
scopes:
  kr:
    level: nation
    code: null
    label: 전국
    parent: null
  jngj:
    level: sido
    code: '12'
    label: 전남광주통합특별시
    parent: kr
  jngj-donggu:
    level: sigungu
    code: '12210'
    label: 전남광주통합특별시 동구
    parent: jngj
    former_code: '29110'
    note: 2026-07-01 개편. 구 광주 동구 29110 → 12210
  jngj-dongmyeong:
    level: emd
    code: '12210108'
    label: 전남광주통합특별시 동구 동명동
    parent: jngj-donggu
    # ★ 2026-08-31 확인. 이 별칭을 쓰는 항목이 0건이다. 결손이 아니다 —
    #   대상은 동명동이지만 **읍면동 단위로 배포되는 원천이 없다.** 전부
    #   시도(jngj) 또는 시군구(jngj-donggu) 로 받아 코드가 클립한다.
    #   지금 raw 46건의 scope 토큰은 jngj-donggu 13 · kr 3 · jngj 3 뿐이고
    #   `jngj-dong-*` 변종은 0건이다(인수인계의 매칭 재확인 항목은 닫힘).
    #   어휘로만 예약해 둔다. emd 단위 원천이 생기면 그때 쓴다.

# ── 계층 ──────────────────────────────────────────────────────
# ★ 2026-08-24 신설. MASTER §18-1 이 계층을 산문으로 선언하고 `paths.py` 가
#   경로를 따로 잡고 있었다. 둘이 어긋나도 아무도 몰랐고, `interim` 은
#   **양쪽 다 없어서** 탐색 도구가 프로젝트 루트에 산출물을 떨궜다
#   (`jijeok_probe._side()` → `RAW.parent.parent`, 11.7MB).
#
#   역할을 나눈다. 중복이 아니라 분리다 —
#     paths.py       경로 해석의 정본. 환경변수를 탄다(기계마다 다르다)
#     여기           정책의 정본. 기계와 무관하다
#     layers.py      둘을 이름으로 묶는다. 이 블록은 거기서만 읽는다
#     datalog fsck   선언과 실물을 대조한다
#
#   `params.py`(임계값 정본) ↔ `config.js`(표시용 사본) 와 같은 구조다.
#
# base        data = $FIRE_LANE_DATA 아래 · repo = 저장소 안
# required    없으면 파이프라인을 세운다. 조용한 폴백을 금지한다
# mutable     사람이 파일을 넣고 빼도 되는가
# committed   git 이 추적하는가. .gitignore 와 대조된다
# backup      datalog backup 대상인가
# regenerable 한 명령으로 다시 만들 수 있는가 (R2)
#             ★ regenerable:false 인데 committed:false 면 소실 대기다
# naming      파일명 규칙. 위반 목록을 fsck 가 낸다
# status      미구현이면 적는다. 격차를 산문이 아니라 데이터로 둔다
# ── 백업 정책 ────────────────────────────────────────────────
# ★ 2026-08-27. `backup: true` 인 계층이 셋인데 `_backup_index.json` 이
#   없어서 `doctor ④ 백업` 이 매번 경고를 냈다. 근거 없이 우는 검사는
#   사람이 무시하게 되고, 무시가 습관이 되면 **진짜 경보도 같이 죽는다**
#   (DECISIONS §73 "잘못된 경보가 진짜 경보를 죽인다").
#
#   그래서 판단을 여기 적는다. 검사를 지우는 것이 아니라 **판단을
#   선언에 올려** 검사가 그것을 읽게 한다.
#
#     결정   raw 2.4GB 는 외장 SSD 한 벌로 둔다. 추가 백업을 뜨지 않는다
#     근거   sources.yaml 의 url 로 전량 재취득 가능하고, `_acquire.json`
#            40건의 sha 가 재취득본의 동일성을 증명한다. 사본을 늘리는
#            것보다 **재취득 경로를 살려 두는 것**이 이 자료의 성질에 맞다
#     한계   재취득에 걸리는 시간(1.8GB 정사영상 포함)은 측정한 적이 없다.
#            `field/` 는 실측이라 재취득이 **불가능**하지만 저장소 안에
#            있어 git 이 사본을 보관한다
#     재검토 raw 가 5GB 를 넘거나, 재취득 불가 자산이 레이크에 생기면
#     결정자 오창준 · 2026-08-27
backup_policy:
  state: single_copy
  decided: 2026-08-27
  by: 오창준
  what: 외장 SSD 한 벌. 추가 백업 없음
  why: sources.yaml 의 url 로 재취득 가능하고 sha 대장이 동일성을 증명한다
  revisit: raw 5GB 초과 · 재취득 불가 자산 편입 · 팀 인원 증가

layers:
  landing:
    base: data
    sub: landing
    required: false
    mutable: true
    committed: false
    backup: false
    regenerable: false
    naming: null
    what: 다운로드 원본 수집소. 규칙 없음. acquire.py 가 raw 로 편입한다

  raw:
    base: data
    sub: raw
    required: true
    mutable: false
    committed: false
    backup: true
    regenerable: false
    naming: '^(eais|gjcity|its|juso|nfa|ngii|nsdi|safety|sbiz|vworld)/'
    what: 받은 그대로. 인코딩조차 고치지 않는다
    depth: 2
    # ★ provider 폴더의 정본. 2026-08-27 까지 이 목록이 네 곳에 있었다 —
    #   위 naming 정규식 · normalize_raw 머리말(7종) · normalize_raw.ORG(9종) ·
    #   테스트 두 곳의 하드코딩. §18-2a 정정 때 "세 곳에서 달랐다" 고 적어
    #   놓고도 네 번째를 만들었다. 여기가 정본이고 나머지는 firelane.providers
    #   를 통해 읽는다. naming 정규식은 test_provider_registry 가 대조한다.
    #
    #   state — 폴더가 존재해도 되는 근거다. 폴더는 대장 항목이 없어서
    #           아무 검사도 대조하지 않는다. 근거를 여기 적는다.
    #     active    대장 datasets 가 실제로 읽는다. 파일 0건이면 결손이다
    #     reserved  등재만 돼 있다. 파일 0건이 정상이고 폴더도 없어야 한다
    providers:
      juso:    {org: 도로명주소 안내시스템,        state: active}
      its:     {org: 국가교통정보센터,             state: active}
      ngii:    {org: 국토지리정보원,               state: active}
      vworld:  {org: 브이월드,                     state: active}
      safety:  {org: 소방청·행정안전부,            state: active}
      gjcity:  {org: 전남광주통합특별시,           state: active}
      sbiz:    {org: 소상공인시장진흥공단,         state: active}
      eais:    {org: 건축행정시스템 세움터,        state: active}
      nfa:
        org: 소방청
        state: active
        # ★ 2026-09-03 신설. 소방안전 빅데이터 플랫폼(119 신고접수 · 구조 ·
        #   화재 · 소방대상물)과 정보공개(주력소방차 제원), 그리고 나라장터
        #   제작 규격서가 전부 여기로 들어온다.
        #
        # ★ **이것이 없어서 반입이 통째로 막혔다.** `intake` 는 파일명이
        #   맞아도 제공기관 폴더를 모르면 건너뛴다 — 2026-09-03 에
        #   nfa_* 15개가 전부 "대장에 없다" 로 걸렀다. 대장에 있었는데도.
        #   ★ 등재 순서가 있다 — 제공기관이 먼저고 datasets 가 나중이다.
      nsdi:
        org: 국가공간정보포털
        state: active
        # ★ 2026-08-30 실물 확인. `nsdi_jijeok_jngj_20260808.zip` 1.0GB 가
        #   raw/nsdi/ 에 있고 대장 `jijeok` 이 등재하고 있다. ingest 가
        #   24,183건을 낸다. **reserved 가 아니다.**
        #
        #   종전 선언은 2026-08-19 격리 시점에 멈춰 있었고, 주석이
        #   "빈 폴더로 남아 있을 것으로 본다 — 아직 실물로 확인하지
        #   않았다" 고 적은 채 굳었다. 8-29 에 대장 등재로 복귀했는데
        #   아무도 이 줄로 돌아오지 않았다.
        #
        #   ★ 이것이 오늘 여섯 번 나온 병의 한 얼굴이다 —
        #     선언이 실물보다 늦고, 늦었다는 것을 알려주는 것이 없다.
        #     DEM 경로 · MISSING 2건 · landing 처분 · JUNK 사본 ·
        #     글롭 사본 10벌이 전부 같은 형태였다.
        #     **판단에는 근거 실물을 적고, 검사가 그 근거를 확인해야 한다.**
    caveats:
      - 2026-08-11 에 심링크를 git 이 추적해 exFAT 에서 2.5GB 를 날렸다
      - 무결성 검사가 파일만 세고 디렉터리를 안 본다(doctor 의 p.is_file()).
        빈 폴더는 대장 항목이 없어 대조 대상도 아니다 — tools/treecheck.py 신설

  norm:
    base: data
    sub: norm
    required: false
    mutable: false
    committed: false
    backup: false
    regenerable: true
    # ★ 2026-09-01. 종전 규칙 '^\w+_[a-z-]+_[a-z0-9]+_\d{4}_v\d+\.' 은
    #   실물 16건이 **전건 위반**이었다. 둘이 틀렸다 — 날짜가 8자리인데
    #   \d{4} 로 4자리를 요구했고, 쓴 적 없는 _v\d+ 버전 접미사를 요구했다.
    #   d094622「계층을 선언으로」에서 layers 를 선언할 때 같이 들어왔고
    #   한 번도 강제된 적이 없다. **죽은 규칙을 살려두면 raw 의 naming 까지
    #   못 믿게 된다**(DECISIONS §73). 규칙을 실물에 맞춘다.
    #
    #   버전이 필요해지면 _prep.json 이 이미 실행 이력을 갖고 있으므로
    #   파일명이 아니라 거기서 찾는다.
    naming: '^\w+_[a-z0-9-]+_[a-z0-9-]+_\d{8}\.'
    encoding: utf-8
    # ★ 2026-08-31. status 는 통제 어휘다 — layers.implemented() 가
    #   "미구현" 하나만 본다. 한 번 "미배선" 으로 바꿨다가 되돌렸다.
    #   어휘를 바꾸면 test_layers::test_unimplemented_layers_declare_it 이
    #   norm 을 구현된 것으로 읽는다. 뜻을 나누고 싶으면 어휘를 먼저 넓힌다.
    #
    #   그리고 파이프라인 입장에서는 미구현이 맞다. 실물 17건이 있어도
    #   아무도 안 읽으면 계층이 없는 것과 같다(DECISIONS §77).
    status: 진행중
    # ★ 2026-08-31. 실물 17건이 norm 에 있고 _prep.json 도 정합하다.
    #   그런데 `ingest.build()` 가 `ledger.paths_of(e, RAW)` 로 raw 를
    #   직접 읽는다 — `prep.source_path()` 를 아무도 안 부른다(PLAN #44).
    #   **migrated 를 채워도 아무 일이 안 난다.** 한 번 16종을 적었다가
    #   되돌렸다. 선언만 채우면 다음 사람이 '이관됐다' 로 읽는다.
    #   배선 지점 ingest.py:176 · 238 · 495. 한 건씩 옮기고 매 건 golden.
    migrated: [bin_cloth, bin_trash, cctv, enforce_cam, fire_access, fire_station, hydrant_point, hydrant_summary, node_link_changelog, parking_lot, parking_zone, school_zone, station_jurisdiction, streetlight]
    what: raw 를 형식만 정규화한 것. 값은 안 바꾼다
    caveats:
      - 디렉터리 문제가 아니라 변환 문제다. ingest 입력 경로가 전부 바뀐다
      - 소스 하나씩 옮기고 매 건 golden.py check. migrated 에 키를 쌓는다

  interim:
    base: data
    sub: interim
    required: false
    mutable: true
    committed: false
    backup: false
    regenerable: true
    naming: null
    what: 탐색·대조 산출물. 대장에 없고 지워도 된다
    caveats:
      - 2026-08-24 신설. 그전까지 없어서 SSD 루트에 11.7MB 가 떨어졌다

  processed:
    base: repo
    sub: data/processed
    required: false
    mutable: false
    committed: false
    committed_exceptions:
      # ★ 폴더는 ignore 하고 이 넷만 추적한다(.gitignore 의 `!` 예외).
      #   UI 담당·심사위원이 raw 2.6GB 없이 지도를 띄울 수 있어야 하고,
      #   재현 증적이 저장소 안에 남아야 한다.
      - segments.geojson
      - segments.schema.json
      - _manifest.json
      - seg_uid_map.csv
    backup: false
    regenerable: true
    naming: null
    what: 파이프라인 정본. 사람이 손으로 만들지 않는다
    caveats:
      - SSD 에 두지 않는다. drvfs 는 파일당 I/O 가 경계를 넘어 크게 느리다

