# ============================================================
# sources.yaml — raw 데이터 대장 (single source of truth)
#
# 규칙
#   * 여기 없는 파일은 파이프라인에 들어오지 않는다.
#   * crs 는 실제 확인값이다. .prj를 믿지 말고 probe.py crs 로 검증한 값을 적는다.
#   * data/raw/ 안의 파일은 절대 수정·리네임하지 않는다.
#   * 확보일(retrieved)을 비워두지 않는다. 발표에서 출처 질문이 반드시 나온다.
#
# 2026-08-09 기준 전량 확보 완료. 미확보는 pending 섹션 참조.
# ============================================================

project: fire-lane
target_area: 전남광주통합특별시 동구 동명동
bbox_4326: [126.907, 35.140, 126.940, 35.162]   # 임시. 행정구역경계 확보 시 교체
standard_crs:
  metric: EPSG:5186     # 거리·면적·버퍼 계산은 무조건 이쪽
  display: EPSG:4326    # 웹 표출 / GeoJSON

datasets:

  # ── 도로 그래프 뼈대 ─────────────────────────────────────
  road_link:
    desc: 도로명주소 도로구간 (선형). RN·ROAD_BT 보유
    kind: shp_zip
    file: juso/juso_road_geom_jngj_20260701.zip
    layer: TL_SPRD_MANAGE.shp
    crs: EPSG:5179
    encoding: cp949
    url: https://business.juso.go.kr/addrlink/elctrnMapProvd/geoDBDwldList.do
    license: 도로명주소법 시행령 제46조 심사 승인
    retrieved: 2026-08-09
    note: |
      ★ .prj 파일이 zip에 없다. CRS 미정의 상태로 읽힌다.
        좌표값 7자리+7자리 → EPSG:5179 확정. set_crs로 강제 정의할 것.
      ★ ROAD_BT는 판정에 쓰지 않는다(§도로폭 참조). 골격과 rds_man_no만 사용.
      ★ ROAD_LT도 쓰지 않는다. 클리핑 전 원본 연장이라 최대 5.5배 과대.
      2026-07-01 전남광주통합특별시 개편 반영본. SIG_CD가 12xxx로 변경됨
      (구 광주 동구 29110 → 12210). 기존 코드 필터 전부 수정 필요.

  road_rw:
    desc: 도로명주소 실폭도로 (면). 도로폭 폴백 소스
    kind: shp_zip
    file: juso/juso_road_geom_jngj_20260701.zip
    layer: TL_SPRD_RW.shp
    crs: EPSG:5179
    encoding: cp949
    retrieved: 2026-08-09
    note: |
      winding order 오류 폴리곤 포함. make_valid + buffer(0) 없이 unary_union 하면
      GEOS TopologyException 발생. 실제로 터졌음.
      수치지도가 안 그리는 최협소 골목을 메우는 용도.

  ngii_road:
    desc: 국가기본공간정보 수치지도 도로경계면 NF_A_A01000 (1:5,000) — 도로폭 주 소스
    kind: shp_zip_multi
    file: ngii/ngii_basemap_gj*.zip      # 광주 037/038/047/048 4도엽
    layer: NF_A_A01000.shp
    crs: EPSG:5179
    encoding: utf-8                        # ★ cp949 아님. .cpg가 UTF-8
    url: https://map.ngii.go.kr
    license: 국토지리정보원
    retrieved: 2026-08-09
    note: |
      ★ 좌표계 EPSG:5179. (정사영상 도곽표는 5186이므로 겹칠 때 통일 필요)
      ★ rvwd 컬럼 = 도로폭 속성. 1.5~46.0m, 정수 76%.
        ROAD_BT(정수 90%, 2.0에 30% 몰림)보다 세분화됨. 교차검증용으로 반드시 병행.
      ★ 최협소 골목을 도로면으로 그리지 않음. 표본 100개 중 70개만 커버.
        나머지는 road_rw 폴백.
      도엽 커버리지(5179): X 945,332~949,918 / Y 1,681,228~1,686,800

  node_link:
    desc: 표준노드링크 MOCT_LINK. 위상 정답지 + LANES/MAX_SPD
    kind: shp_zip
    file: its/its_nodelink_gwangju_20260716.zip
    layer: MOCT_LINK.shp
    crs: EPSG:5186
    url: https://www.its.go.kr/nodelink/nodelinkRef
    license: 공공누리 제1유형
    retrieved: 2026-08-09
    note: |
      교차로에서 위상이 정리되어 있음(미분할 접점 7 vs 도로구간 2,338).
      단, 골목을 담지 않음 — 폭 2m 이하 링크가 3%뿐.
      그래프 뼈대로 쓰지 말고 위상 검증·간선망 대조용으로 쓸 것.
      REST_W(제한폭)는 전량 0. 미기입 필드.

  node_point:
    desc: 표준노드링크 MOCT_NODE. 교차로 노드
    kind: shp_zip
    file: its/its_nodelink_gwangju_20260716.zip
    layer: MOCT_NODE.shp
    crs: EPSG:5186
    retrieved: 2026-08-09

  turn_restriction:
    desc: 회전제한 TURNINFO. D-07 방향성 / D-08 회전 판정 근거
    kind: dbf_in_zip
    file: its/its_nodelink_gwangju_20260716.zip
    layer: TURNINFO.dbf
    crs: none
    retrieved: 2026-08-09

  # ── 공간 조인 레이어 ─────────────────────────────────────
  cctv:
    desc: 전남광주통합특별시 CCTV. 촬영방면·설치연도 포함
    kind: csv_points
    file: safety/safety_cctv_jngj_20260630.csv
    crs: EPSG:4326
    encoding: utf-8
    x_col: 경도
    y_col: 위도
    url: https://www.data.go.kr/data/15084631/fileData.do
    license: 공공누리 제1유형
    retrieved: 2026-08-09
    note: |
      ★ 설치연도별로 행이 분리되어 있다. 행 수를 개소 수로 세면 안 된다.
        동명동 52행 = 고유 27지점 / 카메라 86대.
        기존 문서의 "CCTV 53개소"는 근거 불명. 폐기하고 27로 통일할 것.
      촬영방면 전량 360도(PTZ) → 관측 방향 제약 없음.

  fire_station:
    desc: 소방청 전국소방서 좌표현황. 소방서 + 119안전센터
    kind: csv_points
    file: safety/safety_firestation_kr_20240901.csv
    crs: EPSG:4326
    encoding: utf-8
    x_col: Y좌표          # ★ 컬럼명이 반대다. X좌표에 위도, Y좌표에 경도가 들어있음
    y_col: X좌표
    url: https://www.data.go.kr/data/15138232/fileData.do
    retrieved: 2026-08-09
    note: |
      ★ 출동은 소방서가 아니라 119안전센터에서 나간다.
        동명동 관할: 대인119안전센터(35.154579, 126.914765, 동부소방서와 동일 주소)
                    지산119안전센터(35.149963, 126.938531)
        D-28 시나리오 출발점은 이 둘이다.

  poi_store:
    desc: 소상공인 상가(상권)정보 광주권. 상가 밀집도 = 주차압력 프록시
    kind: csv_points_in_zip
    file: sbiz/sbiz_store_gwangju_20260630.zip
    inner_contains: sbiz_store
    crs: EPSG:4326
    x_col: 경도
    y_col: 위도
    url: https://www.data.go.kr/data/15083033/fileData.do
    license: 공공누리 제1유형
    retrieved: 2026-08-09
    note: |
      건물관리번호로 건물 폴리곤과 조인 가능(구 코드 2911... 유지).
      ★ 행정동명 '동명동'으로 필터하면 목포시 동명동이 섞인다.
        시군구코드 12210(동구) 조건 필수.
      동명동 1,070건 / 음식 421 소매 275.

  # -- 행정경계·건물 (도로명주소 전자지도, 2026-08-11 승인) --
  boundary_emd:
    desc: 읍면동 행정구역경계. 동명동 정식 폴리곤 (EMD_CD 12210108)
    kind: shp_zip
    file: juso/juso_elctrnmap_jngj_20260811.zip
    layer: TL_SCCO_EMD.shp
    crs: EPSG:5179
    encoding: cp949
    url: https://business.juso.go.kr/addrlink/elctrnMapProvd/geoDBDwldList.do
    license: 도로명주소법 시행령 제46조 심사 승인
    retrieved: 2026-08-11
    note: |
      pending.boundary 해소. bbox_4326 대신 이 폴리곤으로 클립할 것.
      동구 34개 읍면동 중 동명동 = EMD_CD 12210108, 면적 0.4289 km2.
      레이어별 .prj 없음. 동봉 GRS80_UTMK.prj가 EPSG:5179와 파라미터 완전일치.
      datum명이 ESRI식 D_ITRF_2000이라 to_epsg() 자동인식만 실패. set_crs로 강제할 것.
      동 경계로 도로를 clip하면 그래프가 깨진다(연결요소 70개 / 최대 34%).
      분석 대상은 동명동, 그래프는 buffer(200m) 포함으로 만들 것.

  building:
    desc: 건물 폴리곤. GRO_FLO_CO(지상층수) 보유 - 3D extrusion 재료
    kind: shp_zip
    file: juso/juso_elctrnmap_jngj_20260811.zip
    layer: TL_SPBD_BULD.shp
    crs: EPSG:5179
    encoding: cp949
    retrieved: 2026-08-11
    note: |
      pending.building 해소. raw_only.building_change(변동분 865건)는 폐기.
      동명동 2,085동. GRO_FLO_CO 결측 0, 평균 1.43층, 1층이 55%(1,138동).
      EMD_CD가 3자리('108')로 저장됨. 8자리 '12210108'과 직접 조인하면 0건.
      0층 291동(14%) 존재. 무허가·부속건물 추정. 높이 환산 시 1층으로 클리핑.

  building_entrance:
    desc: 건물출입구 포인트. 소방차 도달 목표점
    kind: shp_zip
    file: juso/juso_elctrnmap_jngj_20260811.zip
    layer: TL_SPBD_ENTRC.shp
    crs: EPSG:5179
    encoding: cp949
    retrieved: 2026-08-11
    note: |
      동명동 1,313개. 도달점을 건물 중심점이 아니라 실제 출입구로 잡을 수 있다.
      D-28 우회비용 비교의 목적지는 이 레이어다.

  hydrant_point:
    desc: 전국소방용수시설 표준데이터. 소화전 좌표
    kind: csv_points
    file: safety/safety_hydrant_point_jngj_20260809.csv
    crs: EPSG:4326
    encoding: utf-8
    x_col: 경도
    y_col: 위도
    url: https://www.data.go.kr/data/15065056/standard.do
    license: 공공누리 제1유형
    retrieved: 2026-08-09
    note: |
      pending.hydrant_point 부분 해소. 단 공개율 5%.
      hydrant_summary(집계표) 기준 동부소방서 관할 588개 중 공개 31개.
      전량 확보는 여전히 D-30 인터뷰 필요. "588 중 31"은 그대로 발표 논거.

  # ── 좌표 없는 표 (참조용) ────────────────────────────────
  enforcement:
    desc: 동구 불법주정차 단속 85,380건 (2022-01 ~ 2023-10)
    kind: csv_table
    file: safety/safety_parking_enforce_dongu_20240108.csv
    crs: none
    encoding: utf-8
    retrieved: 2026-08-09
    note: |
      ★ 기존 문서의 "동명동 3,228건"은 근거 불명. 원본은 85,380건.
      ★ 좌표 없음. 위반장소명이 도로명주소 → RN으로 road_link에 조인.
        단 절반이 랜드마크 명칭("문화전당 부설주차장" 3,137 등). 필터 필수.
        동명동권 도로명 1차 매칭 2,379건.
      ★ 위반시간 필드 오염. 14시가 전체의 39%(33,412건) = 입력 기본값.
        시간대 분석에 쓸 수 없다. D-21 시간대 근거는 답사 촬영으로만.
      엣지 속성은 건수가 아니라 enforce_per_100m(길이 정규화)로 붙일 것.

  hydrant_summary:
    desc: 소방용수시설 관할서별 집계
    kind: csv_table
    file: safety/safety_hydrant_summary_jngj_20251231.csv
    crs: none
    encoding: utf-8
    retrieved: 2026-08-09
    note: |
      ★ 좌표 없음. 집계표다.
        동부소방서 관할 지상식 431 + 지하식 157 = 588개.
        그런데 전국소방용수시설표준데이터의 광주 동구는 31개뿐 = 공개율 5%.
        동명동은 1개(동계로13번길 18-2).
      → 소화전 레이어는 발표에서 제외. 대신 "588개 중 31개만 공개"를
        D-30 인터뷰 협조요청 근거이자 발표 논거로 사용.

# ── 파이프라인 미투입 (원본만 보관) ─────────────────────────
raw_only:
  ortho:
    desc: 항공정사영상 2025, GSD 0.25m, 광주 037/038/047/048
    files:
      - _B060_정사영상_2025_35616037.tif    # 9516 x 11496
      - _B060_정사영상_2025_35616038.tif    # 9516 x 11508
      - _B060_정사영상_2025_35616047.tif    # 9516 x 11508
      - _B060_정사영상_2025_35616048.tif    # 9528 x 11496
      - _B060_정사영상메타데이터_*.xml
    size: 1.3 GB
    note: |
      ★ GeoTIFF 아님. 지오태그 없음, .tfw 미동봉, XML에도 도곽좌표 없음.
        복원 규칙과 도엽별 X0/Y0는 docs/마스터_문서.md §10 참조 (EPSG:5186).
      Phase 3-A(정사영상 DL 세그멘테이션) 재료. 우선순위 4위.
      현 단계 파이프라인 미투입. S3에만 두고 로컬에서 지워도 무방.

  building_change:
    desc: GIS건물통합정보 일변동분
    files: [CH_D010_00_20260806.zip]
    crs: EPSG:5186
    note: 변동분 865건(동명동 1건). 전체분이 아니라 사용 불가. 전자지도 승인 대기.

  nodelink_manifest:
    desc: 표준노드링크 갱신 내역서
    files: [내역서.csv]
    note: 이번 갱신분 노선 목록. 참고용.

# ── 미확보 ──────────────────────────────────────────────────
pending:
  - key: boundary
    desc: 행정구역경계 (읍면동) — 동명동 정식 폴리곤
    source: business.juso.go.kr → 도로명주소 전자지도
    status: 해소 2026-08-11 → datasets.boundary_emd
    blocking: |
      ★ 이게 없으면 bbox로 자를 수밖에 없고 세그먼트 수가 확정되지 않는다.
        기존 문서의 "222구간"은 근거 불명이고 bbox 노딩 시 4,336개가 나온다.
        정식 경계 확보 후 재산출하여 전 문서의 222를 교체할 것.
  - key: building
    desc: 건물 폴리곤 (전체분)
    source: 동일 (전자지도 11종에 포함)
    status: 해소 2026-08-11 → datasets.building
  - key: hydrant_point
    desc: 소화전 좌표 (동부소방서 관할 588개)
    source: D-30 소방서 인터뷰 협조요청
    status: 부분해소 2026-08-11 → datasets.hydrant_point (공개 31개, 5%)
  - key: streetlight
    desc: 가로등·보안등
    status: 공개 데이터 없음 확정. 야간 답사로 대체 (D-13)
  - key: fire_incident
    desc: 화재 출동 이력 (동명동)
    source: data.go.kr 소방청 화재현황 오픈API (읍면동까지 제공)
    status: 활용신청 미착수

# ── 배경지도 (다운로드 아님, 런타임 타일) ───────────────────
basemap:
  provider: V-World
  key: 95E47552-4B32-36AB-885B-E9DC3FCB5352
  service_url: 등록 필요 (Netlify 배포 후)
  tiles:
    base: https://api.vworld.kr/req/wmts/1.0.0/{KEY}/Base/{z}/{y}/{x}.png
    satellite: https://api.vworld.kr/req/wmts/1.0.0/{KEY}/Satellite/{z}/{y}/{x}.jpeg
    hybrid: https://api.vworld.kr/req/wmts/1.0.0/{KEY}/Hybrid/{z}/{y}/{x}.png
  note: |
    ★ WMTS 축 순서가 {z}/{y}/{x}다. {z}/{x}/{y}로 쓰면 타일이 어긋난다.
    ★ 인증키 신청서에 WMTS/TMS API + 배경지도 API 체크 필요.
    ★ 브라우저 호출 시 &domain=등록URL 파라미터 필수. 문자열 정확히 일치해야 함.
    렌더러는 MapLibre GL JS (Mapbox GL v1 포크라 기존 Mapbox 코드 호환).
