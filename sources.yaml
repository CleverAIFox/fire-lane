    feeds: 미투입 — STEP 4 관측점 랜드마크 후보
    note: |
      동구 전체 27유형 중 실데이터 15유형. 동명동은 26건뿐이다.
      공중전화 8 · 버스정류장 6 · 무더위쉼터 4 · 민방위대피소 4 ·
      비상소화장치 1 · 우체통 1 · 자전거보관소 1 · 어린이보호구역 1.
      폭 판정 · 그래프 · 영상판정 어디에도 기여하지 않는다.
      쓸 자리는 §7-2 관측점 랜드마크 후보 하나뿐이며 STEP 4 이전에는
      파이프라인에 붙이지 않는다.
      ⚠ .prj 없음 → set_crs(5179) 명시 필요. TXT/DBF 는 CP949.
      ⚠ 0건 유형 파일의 내용이 "No Data" 한 줄이라 파서가 죽는다.
      ⚠ OutFireHydr(옥외소화전) 0건. 소화전 588개 좌표 문제는 그대로다.

