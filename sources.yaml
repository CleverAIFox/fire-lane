    at: 2026-08-17
    successor: ngii1k (vworld)
    reason: |
      V-WORLD 판으로 교체. vintage 2020/2022 → 2026-03, 도엽 20 → 74,
      NGI/NDA 텍스트 → 전부 SHP(GDAL 직독), 도로명 빈값 → 채워짐,
      자동차전용 속성 추가. 좌표계는 둘 다 5186 으로 동일.
      전용 파서 src/etl/ngi.py 가 불필요해진다.

