# ============================================================
# sources.yaml — raw 데이터 대장 (single source of truth)
#
# 규칙
#   * 여기 없는 파일은 파이프라인에 들어오지 않는다.
#   * crs 는 실제 확인값이다. .prj를 믿지 말고 probe.py crs 로 검증한 값을 적는다.
#   * data/raw/ 안의 파일은 절대 수정·리네임하지 않는다.
#   * 확보일(retrieved)을 비워두지 않는다. 발표에서 출처 질문이 반드시 나온다.
#
# 2026-08-17 전량 재확보. 원본은 외장 SSD fire-lane-data/ (landing) 에 있고
# acquire 로 raw 에 편입한다. 대장에 없는 파일은 _quarantine 으로 격리한다.
#
# 메타 항목 (URL 은 적지 않는다. 자주 깨지고 provider+scope 면 다시 찾는다)
#   provider  어느 사이트에서 받았나
#   updated   데이터 갱신일 (다운로드일 아님)
#   acquired  우리가 받은 날
#   scope     공간 범위 + 건수
#   crs       좌표계. ★ "명시"와 "추정"을 구분해서 적을 것
#
# contract  는 편입 후 inventory.py 가 생성한다. MASTER §18-3b
# ============================================================

# ── raw 취급 주의 (2026-08-23, data/raw/README.md 흡수분) ──────
# 파일별 주의는 각 datasets 의 note 에 있다. 아래는 전역이다.
#
#   juso zip        내부 .dbf 가 CP949 · .prj 없음 → EPSG:5179 로 set_crs
#                   내부 한글 파일명이 CP437 로 깨진다. CP949 로 되돌려 매칭
#   ngii basemap    .cpg 는 UTF-8 이다(cp949 아님). EPSG:5179
#   ngii1k          같은 도엽이 여러 해로 오면 최신 채택. 연도는 _YYYYMMDD 에서
#                   뽑는다. ★ 다운로드 zip 을 추출본 옆에 두면 zip 이 우선
#                   선택돼 **0건이 조용히 나온다**
#   정사영상        GeoTIFF 가 아니다. .tfw · 도곽좌표 없음. EPSG:5186 이며
#                   수치지도(5179)와 다르다. ortho.py 가 도엽 격자로 역산한다
#   Bessel 계열     5174~5178 은 proj4 문자열을 손으로 쓰지 않는다. EPSG 코드로
#                   정의할 것. towgs84 누락 시 약 390m, 5174 를 5181 로 잘못
#                   정의하면 약 316m 어긋난다. 축척을 줄이면 정상으로 보여
#                   발견이 늦다 (firelane.krgis.crs.offset_between 로 정량화)
#
# 명명규칙 · kind 목록 · 등록 절차는 src/firelane/README.md 가 정본이다.
# 계층 · 백업 · 그라운드 룰은 docs/MASTER.md §18 이 정본이다.

project: fire-lane
target_area: 전남광주통합특별시 동구 동명동
bbox_4326: [126.907, 35.140, 126.940, 35.162]   # 임시. 행정구역경계 확보 시 교체
standard_crs:
  metric: EPSG:5186     # 거리·면적·버퍼 계산은 무조건 이쪽
  display: EPSG:4326    # 웹 표출 / GeoJSON

# ── 차량 제원 ─────────────────────────────────────────────────
# ★ 2026-08-23. 경로 비용(`seg/vehicle.py`)이 이 값을 읽는다.
#   판정을 바꾸는 값이므로 **출처 없이는 쓰지 않는다** — 없으면 모듈이 죽는다.
#
# ── 출처 ──────────────────────────────────────────────────────
#   소방청 「소방장비 기본규격」 소방펌프차 KFS-1-0073-2025-00 §3.3
#   고시 2025-12-24. 영문판 원문 표기는 "or less"(이하).
#
#       구분   전장(m)    전폭(m)    전고(m)   물탱크(ℓ)
#       대형   8.5 이하   2.5 이하   3.4 이하   4,500 이상
#       중형   8.0 이하   2.5 이하   3.2 이하   2,800 이상
#       소형   6.8 이하   2.2 이하   2.8 이하   1,200 이상
#       경형   5.2 이하   1.9 이하   2.8 이하     500 이상
#
#   소형사다리차 KFS-1-0030-2025-01 §3.3 (작업높이 15~25m)
#       전장 8.5 이하 · 전폭 2.5 이하 · 전고 3.8 이하
#
# ★ **규격은 상한만 정한다.** "2.5 이하" 는 실제 차폭이 아니라 제작 한계다.
#   보수적으로 상한을 쓴다 — 실제 차가 그보다 좁으면 판정이 안전한 쪽으로
#   틀린다.
#
# ★ **축거와 최소회전반경은 공식 규격에 없다.** KFS-1-0073 · KFS-1-0030 ·
#   2025년 MAS 차종별 제작규격 셋을 전수 확인했으나 규정하지 않는다.
#   내륜차 계산에 그 둘이 필요하므로 지금 값은 **추정**이고
#   `wheelbase_verified: false` 가 그 표시다.
#
#   확정 경로: D-30 동부소방서 인터뷰 — 보유 차종의 제작사 제원표
#
# ★ 차종은 동부소방서가 동명동에 실제로 보내는 것으로 정해야 한다.
#   폭 3m 골목에 대형(전폭 2.5m)은 여유가 0.5m 뿐이라 실제로는
#   소형(2.2m)이나 경형(1.9m)이 나갈 수 있다. 그러면 판정이 크게 바뀐다.
vehicle_spec:
  what: 소방펌프차 제원 — 판정·경로 비용의 기준 차량
  kind: 중형펌프차
  width_m: 2.5              # KFS-1-0073 §3.3 중형 "2.5 이하"
  length_m: 8.0             # 같은 표 중형
  height_m: 3.2             # 같은 표 중형
  wheelbase_m: 4.0          # ★ 추정. 공식 규격에 없다
  turn_radius_m: 8.0        # ★ 추정. 공식 규격에 없다
  clearance_m: 0.5          # ★ 추정. width_m + 이 값 = params.TRUCK 3.0
  verified: false
  wheelbase_verified: false
  source: |
    소방청 「소방장비 기본규격」
      · 소방펌프차 KFS-1-0073-2025-00 §3.3 (2025-12-24 고시) — 전장·전폭·전고
      · 소형사다리차 KFS-1-0030-2025-01 §3.3 — 전장 8.5 · 전폭 2.5 · 전고 3.8
      · 2025년 소방자동차 다수공급자 계약(MAS) 차종별 제작규격
    raw/nfa/ 에 원본을 둔다.

    ★ 축거 · 최소회전반경 · 여유(clearance_m)는 위 셋 어디에도 없다.
      지금 값은 추정이며 D-30 동부소방서 인터뷰로 확정한다.
  caveats: |
    규격은 **상한**만 정한다("이하"). 실제 차폭은 그보다 작을 수 있고,
    그 경우 판정은 안전한 쪽으로 틀린다.

    차종에 따라 결과가 크게 달라진다. 폭 3m 골목에 중형(2.5m)은 여유가
    0.5m 뿐이다. 실제로는 소형(2.2m) · 경형(1.9m)이 나갈 수 있고,
    그러면 통과 판정 구간이 늘어난다. 동부소방서 보유 차종 확인이 선행이다.

    사다리차 · 화학차 · 구조차는 제원이 다르다.
  feeds: seg/vehicle.py 통행 비용 · 내륜차 · 회전 가능 판정
  verified_note: |
    width_m · length_m · height_m 은 공식 규격 확인 완료(2026-08-23).
    wheelbase_m · turn_radius_m · clearance_m 은 미확정.


# ── 계층 ──────────────────────────────────────────────────────
# ★ 2026-08-24 신설. MASTER §18-1 이 계층을 산문으로 선언하고 `paths.py` 가
#   경로를 따로 잡고 있었다. 둘이 어긋나도 아무도 몰랐고, `interim` 은
#   **양쪽 다 없어서** 탐색 도구가 프로젝트 루트에 산출물을 떨궜다
#   (`jijeok_probe._side()` → `RAW.parent.parent`, 11.7MB).
#
#   역할을 나눈다. 중복이 아니라 분리다 —
#     paths.py       경로 해석의 정본. 환경변수를 탄다(기계마다 다르다)
#     여기           정책의 정본. 기계와 무관하다
#     layers.py      둘을 이름으로 묶는다. 이 블록은 거기서만 읽는다
#     datalog fsck   선언과 실물을 대조한다
#
#   `params.py`(임계값 정본) ↔ `config.js`(표시용 사본) 와 같은 구조다.
#
# base        data = $FIRE_LANE_DATA 아래 · repo = 저장소 안
# required    없으면 파이프라인을 세운다. 조용한 폴백을 금지한다
# mutable     사람이 파일을 넣고 빼도 되는가
# committed   git 이 추적하는가. .gitignore 와 대조된다
# backup      datalog backup 대상인가
# regenerable 한 명령으로 다시 만들 수 있는가 (R2)
#             ★ regenerable:false 인데 committed:false 면 소실 대기다
# naming      파일명 규칙. 위반 목록을 fsck 가 낸다
# status      미구현이면 적는다. 격차를 산문이 아니라 데이터로 둔다
layers:
  landing:
    base: data
    sub: landing
    required: false
    mutable: true
    committed: false
    backup: false
    regenerable: false
    naming: null
    what: 다운로드 원본 수집소. 규칙 없음. acquire.py 가 raw 로 편입한다

  raw:
    base: data
    sub: raw
    required: true
    mutable: false
    committed: false
    backup: true
    regenerable: false
    naming: '^(juso|its|ngii|vworld|safety|gjcity|sbiz|eais|nsdi)/'
    what: 받은 그대로. 인코딩조차 고치지 않는다
    caveats:
      - 2026-08-11 에 심링크를 git 이 추적해 exFAT 에서 2.5GB 를 날렸다

  norm:
    base: data
    sub: norm
    required: false
    mutable: false
    committed: false
    backup: false
    regenerable: true
    naming: '^\w+_[a-z-]+_[a-z0-9]+_\d{4}_v\d+\.'
    encoding: utf-8
    status: 미구현
    migrated: []
    what: raw 를 형식만 정규화한 것. 값은 안 바꾼다
    caveats:
      - 디렉터리 문제가 아니라 변환 문제다. ingest 입력 경로가 전부 바뀐다
      - 소스 하나씩 옮기고 매 건 golden.py check. migrated 에 키를 쌓는다

  interim:
    base: data
    sub: interim
    required: false
    mutable: true
    committed: false
    backup: false
    regenerable: true
    naming: null
    what: 탐색·대조 산출물. 대장에 없고 지워도 된다
    caveats:
      - 2026-08-24 신설. 그전까지 없어서 SSD 루트에 11.7MB 가 떨어졌다

  processed:
    base: repo
    sub: data/processed
    required: false
    mutable: false
    committed: false
    committed_exceptions:
      # ★ 폴더는 ignore 하고 이 넷만 추적한다(.gitignore 의 `!` 예외).
      #   UI 담당·심사위원이 raw 2.6GB 없이 지도를 띄울 수 있어야 하고,
      #   재현 증적이 저장소 안에 남아야 한다.
      - segments.geojson
      - segments.schema.json
      - _manifest.json
      - seg_uid_map.csv
    backup: false
    regenerable: true
    naming: null
    what: 파이프라인 정본. 사람이 손으로 만들지 않는다
    caveats:
      - SSD 에 두지 않는다. drvfs 는 파일당 I/O 가 경계를 넘어 크게 느리다

  field:
    base: repo
    sub: data/field
    required: false
    mutable: true
    committed: true
    backup: true
    regenerable: false
    naming: null
    what: 실측 원자료. 사람이 만드는 유일한 데이터
    caveats:
      - 8월 20일 오전 10시의 그 골목은 다시 안 온다. raw 등급으로 보호한다
      - 저장소 안이 정본이다. clone 만으로 보여야 한다 (2026-08-23 정정)

  quarantine:
    base: data
    sub: _quarantine
    required: false
    mutable: true
    committed: false
    backup: true
    regenerable: false
    naming: null
    what: 대장에 없는 파일. 삭제하지 않고 격리한다
    caveats:
      - 격리는 판단 보류지 폐기가 아니다. 재생성 불가라 백업 대상이다
      - 2026-08-24 현재 연속지적도 970MB 가 여기 있다(PLAN #20 편입 대기)

  web:
    base: repo
    sub: web/data
    required: false
    mutable: false
    committed: true
    backup: false
    regenerable: true
    naming: null
    max_mb: 40
    what: 표출용 경량 사본. UI 담당이 raw 없이 작업할 수 있어야 한다

datasets:
  kfs_pumptruck:
    what: 소방장비 기본규격 — 소방펌프차 (KFS-1-0073-2025-00)
