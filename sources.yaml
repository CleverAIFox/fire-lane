# ============================================================
# sources.yaml — raw 데이터 대장 (single source of truth)
#
# 규칙
#   * 여기 없는 파일은 파이프라인에 들어오지 않는다.
#   * crs 는 실제 확인값이다. .prj를 믿지 말고 probe.py crs 로 검증한 값을 적는다.
#   * data/raw/ 안의 파일은 절대 수정·리네임하지 않는다.
#   * 확보일(retrieved)을 비워두지 않는다. 발표에서 출처 질문이 반드시 나온다.
#
# 2026-08-17 전량 재확보. 원본은 외장 SSD fire-lane-data/ (landing) 에 있고
# acquire 로 raw 에 편입한다. 대장에 없는 파일은 _quarantine 으로 격리한다.
#
# 메타 항목 (URL 은 적지 않는다. 자주 깨지고 provider+scope 면 다시 찾는다)
#   provider  어느 사이트에서 받았나
#   updated   데이터 갱신일 (다운로드일 아님)
#   acquired  우리가 받은 날
#   scope     공간 범위 + 건수
#   crs       좌표계. ★ "명시"와 "추정"을 구분해서 적을 것
#
# contract  는 편입 후 inventory.py 가 생성한다. MASTER §18-3b
# ============================================================

# ── raw 취급 주의 (2026-08-23, data/raw/README.md 흡수분) ──────
# 파일별 주의는 각 datasets 의 note 에 있다. 아래는 전역이다.
#
#   juso zip        내부 .dbf 가 CP949 · .prj 없음 → EPSG:5179 로 set_crs
#                   내부 한글 파일명이 CP437 로 깨진다. CP949 로 되돌려 매칭
#   ngii basemap    .cpg 는 UTF-8 이다(cp949 아님). EPSG:5179
#   ngii1k          같은 도엽이 여러 해로 오면 최신 채택. 연도는 _YYYYMMDD 에서
#                   뽑는다. ★ 다운로드 zip 을 추출본 옆에 두면 zip 이 우선
#                   선택돼 **0건이 조용히 나온다**
#   정사영상        GeoTIFF 가 아니다. .tfw · 도곽좌표 없음. EPSG:5186 이며
#                   수치지도(5179)와 다르다. ortho.py 가 도엽 격자로 역산한다
#   Bessel 계열     5174~5178 은 proj4 문자열을 손으로 쓰지 않는다. EPSG 코드로
#                   정의할 것. towgs84 누락 시 약 390m, 5174 를 5181 로 잘못
#                   정의하면 약 316m 어긋난다. 축척을 줄이면 정상으로 보여
#                   발견이 늦다 (firelane.krgis.crs.offset_between 로 정량화)
#
# 명명규칙 · kind 목록 · 등록 절차는 src/firelane/README.md 가 정본이다.
# 계층 · 백업 · 그라운드 룰은 docs/MASTER.md §18 이 정본이다.

project: fire-lane
target_area: 전남광주통합특별시 동구 동명동
bbox_4326: [126.907, 35.140, 126.940, 35.162]   # 임시. 행정구역경계 확보 시 교체
standard_crs:
  metric: EPSG:5186     # 거리·면적·버퍼 계산은 무조건 이쪽
  display: EPSG:4326    # 웹 표출 / GeoJSON

# ── 차량 제원 ─────────────────────────────────────────────────
# ★ 2026-08-23. 경로 비용(`seg/vehicle.py`)이 이 값을 읽는다.
#   판정을 바꾸는 값이므로 **출처 없이는 쓰지 않는다** — 없으면 모듈이 죽는다.
#
# ── 출처 ──────────────────────────────────────────────────────
#   소방청 「소방장비 기본규격」 소방펌프차 KFS-1-0073-2025-00 §3.3
#   고시 2025-12-24. 영문판 원문 표기는 "or less"(이하).
#
#       구분   전장(m)    전폭(m)    전고(m)   물탱크(ℓ)
#       대형   8.5 이하   2.5 이하   3.4 이하   4,500 이상
#       중형   8.0 이하   2.5 이하   3.2 이하   2,800 이상
#       소형   6.8 이하   2.2 이하   2.8 이하   1,200 이상
#       경형   5.2 이하   1.9 이하   2.8 이하     500 이상
#
#   소형사다리차 KFS-1-0030-2025-01 §3.3 (작업높이 15~25m)
#       전장 8.5 이하 · 전폭 2.5 이하 · 전고 3.8 이하
#
# ★ **규격은 상한만 정한다.** "2.5 이하" 는 실제 차폭이 아니라 제작 한계다.
#   보수적으로 상한을 쓴다 — 실제 차가 그보다 좁으면 판정이 안전한 쪽으로
#   틀린다.
#
# ★ **축거와 최소회전반경은 공식 규격에 없다.** KFS-1-0073 · KFS-1-0030 ·
#   2025년 MAS 차종별 제작규격 셋을 전수 확인했으나 규정하지 않는다.
#   내륜차 계산에 그 둘이 필요하므로 지금 값은 **추정**이고
#   `wheelbase_verified: false` 가 그 표시다.
#
#   확정 경로: D-30 동부소방서 인터뷰 — 보유 차종의 제작사 제원표
#
# ★ 차종은 동부소방서가 동명동에 실제로 보내는 것으로 정해야 한다.
#   폭 3m 골목에 대형(전폭 2.5m)은 여유가 0.5m 뿐이라 실제로는
#   소형(2.2m)이나 경형(1.9m)이 나갈 수 있다. 그러면 판정이 크게 바뀐다.
vehicle_spec:
  what: 소방펌프차 제원 — 판정·경로 비용의 기준 차량
  kind: 중형펌프차
  width_m: 2.5              # KFS-1-0073 §3.3 중형 "2.5 이하"
  length_m: 8.0             # 같은 표 중형
  height_m: 3.2             # 같은 표 중형
  wheelbase_m: 4.0          # ★ 추정. 미검증 — wheelbase_verified: false
  turn_radius_m: 12.0       # ★ 법정 상한이지 성능값이 아니다(DECISIONS 81)
  turn_radius_verified: false
  clearance_m: 0.5          # ★ 추정. width_m + 이 값 = params.TRUCK 3.0
  gradeability_pct: 18      # KFS 5종 §4.4.1 공통. 전진·후진 모두. = 10.2°
  verified: false
  wheelbase_verified: false
  source: |
    소방청 「소방장비 기본규격」
      · 소방펌프차 KFS-1-0073-2025-00 §3.3 (2025-12-24 고시) — 전장·전폭·전고
      · 소형사다리차 KFS-1-0030-2025-01 §3.3 — 전장 8.5 · 전폭 2.5 · 전고 3.8
      · 2025년 소방자동차 다수공급자 계약(MAS) 차종별 제작규격
    raw/nfa/ 에 원본을 둔다.

    ★ 여유(clearance_m)는 위 셋 어디에도 없다. 지금 값은 추정이며
      D-30 동부소방서 인터뷰로 확정한다.

    ★ **축거 — 2026-09-03 우지혜 조사. 전역값은 쓰지 않는다.**

      ★ **범주 최대는 그 범주 전량을 알 때만 최대다.** 한 대라도 모르면
        나머지가 그보다 클 수 있으므로 최대라고 장담할 수 없다.
        그래서 전역 `wheelbase_m` 에 특정 센터의 값을 넣지 않는다 —
        2026-09-03 에 4.3 을 전역에 넣었다가 되돌렸다. 기본 판정 차량이
        지산 펌프차인데 4.3 은 대인 파비스에서 나온 값이었다.

      ★ 판정 단위는 **센터 × 차종**이고 서로 독립이다. 그 조합의 보유
        대수만큼 차종을 전부 알 때만 그 조합의 최대가 확정된다.
        확정된 조합만 내륜차를 계산하고 나머지는 비활성이다.
        값은 `web/config.js` 의 `CONFIG.fleet` 항목이 든다.

      축거는 소방청이 아니라 **트럭 제조사**가 정한다. 섀시 제원이라
      소방 규격에 없는 것이 정상이다 — 회전반경이 KFS 가 아니라
      자동차규칙 제9조①에 있었던 것과 같은 구조다(DECISIONS §81).

      ★ **범주 최대를 쓰는 근거.** 도로폭은 구간의 **최소**로 판정한다 —
        제일 좁은 데를 못 지나면 못 지난다. 차량은 그 뒤집음이다.
        범주의 **최대** 축거로 판정하면 그 범주의 나머지는 전부 통과한다.
        보유 34대를 전수로 알므로 범주별 최대만 확정하면 그 범주가 닫힌다.
        전 차량 축거를 다 알 필요가 없다.

      섀시별 축거(mm) — 참고표
        현대 메가트럭   단축 3,845 · 장축 4,260 · 초장축 4,895
        현대 파비스     15.5t 샤시캡 단축 3,900 · 장축 4,300
        타타대우 구쎈   고하중 4x2 단축 3,730 · 장축 4,430 ·
                        초장축 4,930 · 초장축+ 5,330 · 극초장축 5,630 · 5,830

      확정된 조합(2026-09-03)
        대인 · 펌프차(중형) 2대 = 5호·6호 둘 다 파비스 → 최대 4,300
        대인 · 굴절사다리 27m 1대 = 11호 구쎈(2022~) → 사양 미확정(4,930~5,830)
      미확정
        지산 · 펌프차 2대 · 구급차 1대 — 0대 확인
        대인 · 물탱크 · 화학 · 직진사다리 · 구급 · 조연 — 0대 확인

      ★ 초장축(메가트럭 4,895 등)은 뺐다. 중형펌프차는 전장 8,000mm 이하
        (2025 MAS 제작규격)이고 초장축 섀시에 3,000L 물탱크 특장 공간이
        안 나온다. **배제 근거를 여기 적는다** — 안 적으면 다음 사람이
        왜 뺐는지 못 찾는다.

      ★ 값 4.0 은 후보 어느 것도 아니다. 방향도 나쁘다 —
        Δ = R − √(R² − L²) 는 L 이 클수록 크므로 축거를 작게 잡으면
        필요폭이 작게 나오고 그것은 **미탐**이다(MASTER §3-13).
          R=8m 기준   L 4.00 → Δ 0.98 → 필요폭 3.98
                      L 4.30 → Δ 1.15 → 필요폭 4.15     +17cm · 13코너(1.5%)

      ★ 특정된 것은 대인 5호(998더7382) · 6호(998더7376)이고 캡 측면
        `PAVISE` 워드마크로 파비스 확인이다. 단축/장축은 미확정.
        **판정 기준 차량은 지산 소속(CONFIG.fleetDefault = pump-js)이며
        그 2대는 아직 미확인이다.** 대인 차로 지산 차를 유추하지 않는다 —
        2019년 파비스가 메가트럭을 대체했으므로 도입 연도가 다르면 섀시가
        다르다. 그래서 `wheelbase_verified` 는 여전히 false 다.

      ★ **스키마 결함이 함께 드러났다.** `vehicle_profiles` 는 차종당 축거
        하나인데 같은 중형펌프차가 섀시 세대로 갈린다. 축거를 확보해도
        넣을 자리가 없다 — 값보다 스키마가 먼저다(PLAN #26).

      출처 등급 — 섀시 축거는 위키백과·카눈에서 왔고 **정본이 아니다.**
      현대 상용차 카탈로그 또는 이트럭스 제원 DB 로 갈아야 한다.

    ★ 최소회전반경은 2026-08-25 에 근거를 찾았다. **소방장비 규격이 아니라
      상위 법령에 있다** —

        「자동차 및 자동차부품의 성능과 기준에 관한 규칙」(국토교통부령)
        제9조(최소회전반경) ①
          "자동차의 최소회전반경은 바깥쪽 앞바퀴자국의 중심선을 따라
           측정할 때에 12미터를 초과하여서는 아니된다" <개정 2012. 12. 15.>

      KFS 가 이 값을 안 적은 이유가 이것이다. 상위 법령이 이미 정하므로
      중복 규정하지 않는다. "규격에 없다 = 근거가 없다" 가 아니었다.

    ★ **2026-09-03 정정. 확보 경로는 실측이 아니라 제작사 제원표다.**

      종전에 이 값을 "D-30 동부소방서 인터뷰로 확정" 으로 적었다. 그것이
      병목이 아니다 — 최소회전반경은 차량 카탈로그에 실린 **공개 수치**이며
      소방장비 규격도 법령도 아닌 별개 계층에 있다.

        관내 보유 차종·대수   gjfire_fleet_dongbu (동부소방서 소방차량현황
                             2026-05-14). **이미 대장에 있다**
        차종별 최소회전반경   제작사 제원표. 섀시 모델 단위로 공개된다

      근거 탐색이 kfs_* 7종과 상위 법령 둘만 뒤지고 이 계층을 안 봤다.
      `gjfire_fleet_dongbu.feeds_why` 가 "치수는 kfs_* 7종이 낸다" 로 적혀
      있어 탐색이 거기서 멈췄다. **제원 정합성을 의심한 적은 없다** —
      공식 제공처를 의심하기 시작하면 끝이 없고, 그런 논의는 없었다.

    ★ **높이는 판정하지 않는다. 값이 없어서가 아니라 대상이 없어서다.**
      `height_m: 3.2` 는 KFS-1-0073 §3.3 출처가 확실하다. 판정에 안 쓰는
      이유는 **상공 장애물 데이터가 없기 때문**이다 — 높이로 막으려면
      "차보다 낮은 지점" 을 알아야 하는데 전선·간판·처마 레이어가 없다.
      동명동에 터널·고가 하부는 없다. 없는 상대와 비교할 수 없으므로
      `height_m` 은 화면 표시용으로만 흐른다(publish_web.py:344).
      이것은 미완이 아니라 **결정**이다. 데이터가 생기면 그때 켠다.

      ★ 제9조② 의 5.3m/12.5m 동심원 규정은 **승합자동차** 전용이다.
        소방차는 특수자동차이므로 제1항이 적용된다.

    ★ gradeability_pct 는 추정이 아니다. KFS-1-0073 · 0074 · 0075 · 0076 ·
      0077 §4.4.1 이 전부 같은 문장을 갖는다(2026-08-25 원문 5종 확인) —
      "18 % gradient in both forward and reverse directions".
      tan⁻¹(0.18) = 10.204° 다.
  caveats: |
    규격은 **상한**만 정한다("이하"). 실제 차폭은 그보다 작을 수 있고,
    그 경우 판정은 안전한 쪽으로 틀린다.

    차종에 따라 결과가 크게 달라진다. 폭 3m 골목에 중형(2.5m)은 여유가
    0.5m 뿐이다. 실제로는 소형(2.2m) · 경형(1.9m)이 나갈 수 있고,
    그러면 통과 판정 구간이 늘어난다. 동부소방서 보유 차종 확인이 선행이다.

    사다리차 · 화학차 · 구조차는 제원이 다르다.

    turn_radius_m 12.0 도 **상한**이다. 전폭에 "2.5 이하" 를 그대로 쓴 것과
    같은 논리다 — 실제 차가 더 작게 돌면 `can_turn()` 이 못 돈다고 틀리고,
    그 방향의 오류는 안전하다. 다만 **법정 상한은 전 차종 공통이라 차종을
    가르지 못한다.** 차종별 회전반경 차이는 여전히 D-30 이 필요하다.
  feeds: seg/vehicle.py 통행 비용 · 내륜차 · 회전 가능 판정
  verified_note: |
    width_m · length_m · height_m 은 공식 규격 확인 완료(2026-08-23).
    gradeability_pct 는 KFS 5종 §4.4.1 확인 완료(2026-08-25).
    turn_radius_m 은 자동차규칙 제9조① 확인 완료(2026-08-25).
    ★ wheelbase_m · clearance_m 만 미확정으로 남는다.

# ── 차종별 제원 ───────────────────────────────────────────────
# ★ 2026-08-25 신설. 위 `vehicle_spec` 은 **판정 기준 차량 한 대**다.
#   여기는 KFS 7종에서 읽은 **차종별 표**이고 판정에 들어가지 않는다.
#   용도는 셋 — 화면 차종 선택 · D-30 질문지 · 차종 비교.
#
#   판정을 바꾸려면 `vehicle_spec` 을 바꾼다. 둘을 섞지 않는다.
#   섞으면 "어느 차로 낸 지도인가" 를 아무도 못 말한다.
#
# ★ 전부 **상한("이하")** 이다. 실측 제원이 아니다.
# ★ 축거 · 최소회전반경은 7개 문서 **전부 0건**이다. 그래서 여기에도 없다.
#   근거 없이 채우지 않는다(§16-2). D-30 인터뷰가 유일한 경로다.
vehicle_profiles:
  what: 차종별 전장·전폭·전고 — 표출·비교용. 판정은 vehicle_spec 이 한다
  default: pump_medium        # vehicle_spec 이 이것과 같은 값이어야 한다
  unit: m ("이하" 상한값)
  feeds: 미투입 — web 차종 선택 UI · D-30 질문지
  source: |
    소방청 「소방장비 기본규격」 7종. 고시 2025-12-24 (본문 부칙 2025-12-29).
    스코프 전국 단일 — 지역·소방서별로 다르지 않다.
    원문은 datasets 의 kfs_* 항목이 가리킨다.
  # ★ 2026-09-02. `absent` 는 **어느 출처에 없는가**를 든다. 스코프가
  #   없으면 "어디에도 없다" 로 읽히고, 실제로 그렇게 읽혀서 셋 다
  #   거짓 선언이 됐다(DECISIONS §91). 세 필드가 필수다 —
  #     in         이 출처에 없다
  #     elsewhere  값이 있는 곳. 있으면 "부재" 가 아니라 "출처 밖" 이다
  #     json_key   그 파일의 **실제 키**. 이름을 추측하지 않는다(§49)
  absent:
    wheelbase_m:
      in: KFS 7종 규격
      elsewhere: web/assets/vehicles/profiles.json
      json_key: wheelbase
      note: |
        규격 7종 전수 확인 0건. profiles.json 은 4,260 · 4,925mm 를 든다
        (구조공작차 · 구급차는 null). 강원 인제소방서 자료이며 미검증이고
        출처가 대장 밖이다(PLAN #59). 정본은 D-30 인터뷰다.
    turn_radius_m:
      in: KFS 7종 규격
      elsewhere: web/assets/vehicles/profiles.json
      json_key: turningRadius
      note: |
        KFS 7종에는 0건이다. 그러나 **없는 값이 아니다** — 두 곳에 있다.
          · 자동차규칙 제9조① 법정 상한 12m (vehicle_spec.turn_radius_m)
          · profiles.json 차종별 7,300~11,889mm
            (강원 인제소방서 자료 · 나라장터 공고. 미검증)
        ★ 2026-09-01 정정. 종전에 "0건" 이라고만 적어 대장이 거짓 선언을
          하고 있었다 — 화면은 그 값을 띄우는데 대장은 없다고 했다.
        ★ 2026-09-02. 그 정정은 산문뿐이었고 키는 `absent` 에 그대로 있었다.
          검사는 이름이 엇갈려(turn_radius_m ↔ turningRadius) 통과했다.
        D-30 은 여전히 필요하다. 위 둘 다 실측이 아니다.
    ambulance:
      in: KFS-1-0029-2025-01 §3.2.1
      elsewhere: web/assets/vehicles/profiles.json
      json_key: ambulance_current_example
      note: |
        특수구급차 §3.2.1「차량의 제원」이 "구급차 제작기준 또는 수요기관의
        정하는 바에 따른다" 한 줄뿐이다. 규격에 표가 없으므로 items 에
        넣지 않는다. profiles.json 은 나라장터 공고의 현행 예시
        (5,270 x 1,995 x 2,410)를 든다 — 규격값이 아니다.
        ★ §3.3 은 제원이 아니라 **환자실**이다. 조항 번호를 헷갈리지 않는다.
  notes: |
    ★ 전폭은 경형·소형펌프차(1.9 · 2.2)를 빼면 **전 차종 2.5 로 같다.**
      인터뷰(2026-08-24 전북소방)의 "물탱크차는 커서 못 들어간다" 는
      폭이 아니라 **전장**이다 — 물탱크 대형 10.0 대 펌프 중형 8.0.
      폭만 보는 지금 판정으로는 이 차이가 안 나온다.

    ★ 굴절차만 축 수를 적는다(6x4 3축 / 8x4 4축). KFS 7종 중 축 구성이
      적힌 유일한 문서다. D-30 질문지에 "보유 굴절차 몇 축이냐" 를 넣는다.

    ★ 구조차 원문 단위는 mm 다. 여기서 m 로 옮겼다.

    ★ 2025년 MAS 제작규격 본편(펌프·물탱크·화학·구조 4종)을 대조했다.
      네 차종 모두 KFS 고시값과 **일치**한다. 단 물탱크차만 MAS 가
      경형을 하나 더 둔다(water_light).

    ★ 소형사다리차 작업높이는 원문이 "15m 이상 25m 미만" 이다.
  items:
    pump_large:
      label: 펌프차 대형
      ledger: kfs_pumptruck
      doc: KFS-1-0073-2025-00
      length_m: 8.5
      width_m: 2.5
      height_m: 3.4
    pump_medium:
      label: 펌프차 중형
      ledger: kfs_pumptruck
      doc: KFS-1-0073-2025-00
      length_m: 8.0
      width_m: 2.5
      height_m: 3.2
    pump_small:
      label: 펌프차 소형
      ledger: kfs_pumptruck
      doc: KFS-1-0073-2025-00
      length_m: 6.8
      width_m: 2.2
      height_m: 2.8
    pump_light:
      label: 펌프차 경형
      ledger: kfs_pumptruck
      doc: KFS-1-0073-2025-00
      length_m: 5.2
      width_m: 1.9
      height_m: 2.8
    water_large:
      label: 물탱크차 대형
      ledger: kfs_watertank
      doc: KFS-1-0075-2025-00
      length_m: 10.0
      width_m: 2.5
      height_m: 3.7
    water_medium:
      label: 물탱크차 중형
      ledger: kfs_watertank
      doc: KFS-1-0075-2025-00
      length_m: 8.5
      width_m: 2.5
      height_m: 3.4
    water_small:
      label: 물탱크차 소형
      ledger: kfs_watertank
      doc: KFS-1-0075-2025-00
      length_m: 7.8
