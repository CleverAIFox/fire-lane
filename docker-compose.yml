# Fire-Lane 컨테이너 구성 — 로컬 개발과 배포가 같은 파일을 쓴다
#
# ★ 2026-09-03. 제목이 "로컬 개발 환경" 이었다. MASTER §12-8 이 이
#   파일을 **배포 근거**로 인용하는데(EC2 한 대 + Compose · DECISIONS §93)
#   제목이 그것을 부정하고 있었다. 아래 "DB 를 지금 넣지 않는 이유" 는
#   배포에도 그대로 적용되는 판단이므로 제목만 넓힌다.
#
# ★ 2026-08-21 교체. 이전 파일은 PostGIS 컨테이너 하나였고
#   POSTGRES_DB / POSTGRES_PASSWORD 가 `parkingeye` 였다 — 이전 프로젝트
#   잔해다. src/ 어디에도 sqlalchemy · psycopg · geoalchemy 를 import 하는
#   코드가 없어 아무도 쓰지 않고 있었고, 비밀번호만 평문으로 커밋돼 있었다.
#
# DB 를 지금 넣지 않는 이유
#   segments.geojson 은 996KB · 1,101구간이다. PostGIS 를 쓸 규모가 아니다.
#   파이프라인이 285초에 결정론적으로 전량 재생성되므로 DB 의 주 가치인
#   상태 보존이 필요 없다. 그리고 GeoJSON 은 git diff 가 되고 DB 는 안 된다 —
#   MASTER §3-9 의 "길이 0.0m 구간 40개" 를 잡아낸 것이 그 diff 다.
#
#   DB 가 필요해지는 시점은 PLAN §2-2 의 동적 계층이다. current_status 컬럼
#   하나가 수 초~분 단위로 갱신될 때. 그때도 PostGIS 가 아니라
#   seg_uid → status 한 테이블이면 된다. 공간 연산은 ETL 에서 끝나 있고
#   런타임에는 조회만 한다.
#
#   docker compose up web ops
#   docker compose --profile etl run --rm etl uv run fire-lane

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ★ 2026-10-01 (DECISIONS §342). 관제 ↔ 내비 중개자.
  #   **상시 서비스다** — `web` 은 정적 파일이고 이것은 프로세스다. MASTER
  #   §12-8 이 배포를 「EC2 한 대 + Compose」로 정했고(§93), 「api 이미지는
  #   슬림 · 상시 서비스가 될 것」이라고 적어 뒀다. 그 자리가 여기다.
  # ★ GDAL 을 안 넣는다. `Dockerfile.api` 가 그래서 따로 있다 — ETL 이미지는
  #   1.5GB 이고 중개자는 그걸 한 바이트도 안 쓴다(`Dockerfile` 머리말).
  ops:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      # ★ 컨테이너 안의 포트다. 바꾸려면 위 매핑도 같이 바꿔라 —
      #   `tests/test_ops.py::test_the_port_is_written_once` 가 둘을 대조한다.
      FIRE_LANE_OPS_PORT: "8000"
    healthcheck:
      # ★ `/health` 는 **사람이 아니라 이것을 위해** 있다. WebSocket 만 있는
      #   서버는 살았는지 죽었는지 밖에서 알 길이 없다.
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  etl:
    build: .
    profiles: ["etl"]
    env_file:
      - .env
    environment:
      # ★ 2026-08-23. FIRE_LANE_RAW 는 폐기됐다(MASTER §6-2). 심어두면
      #   paths.py 가 매 실행 경고를 찍고, 그 경고가 옳다 — 이 변수가
      #   FIRE_LANE_DATA 를 조용히 이긴다.
      FIRE_LANE_DATA: /data
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - "${FIRE_LANE_DATA:-./data}:/data:ro"
