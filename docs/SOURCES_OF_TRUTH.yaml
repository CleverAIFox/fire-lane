# docs/SOURCES_OF_TRUTH.yaml — 사실 하나 → 정본 파일 하나 → 그것을 따르는 자리들.
#
# ★ 2026-09-22 (DECISIONS §218-6 · 계급 가드 2 「정본은 하나」). 같은 값이 여러 파일에
#   literal 로 사는 것은 피할 수 없는 경우가 있다(YAML · Dockerfile · 셸은 서로를 import
#   못 한다). 피할 수 없으면 **목록으로 적고 기계가 맞춘다.** 이 파일이 그 목록이고
#   tests/test_sources_of_truth.py 가 강제한다.
#
# 모양
#   owner      {file, regex}   정본. regex 의 첫 그룹이 값이다. **정확히 한 번** 걸려야 한다
#   consumers  [{file, has} | {file, ref} | {file, regex, cmp}]
#                has    이 문자열이 있어야 한다. `{v}` 가 값으로 바뀐다(`{v:g}` 는 수로 서식)
#                ref    정본을 읽는다는 증거 문자열(값 대신 정본 경로·이름을 적는 자리)
#                regex  첫 그룹을 값과 cmp(`==` · `>=` 판 비교)로 견준다
#              ★ 공백은 무시하고 견준다(`Pretendard, system-ui` ≡ `Pretendard,system-ui`)
#   scan       [글롭]  아래 둘을 볼 범위. 없으면 안 본다
#   pins       [{find, regex}]  scan 안에서 `find` 가 나오는 자리마다 regex 가 그 자리에서
#              걸리고 첫 그룹이 값이어야 한다 · 그 파일은 owner/consumers 에 있어야 한다
#              (판을 안 적은 설치 줄도 여기서 걸린다)
#   exclusive  true 면 scan 안에서 값 literal 이 owner/consumers 밖에 나오면 실패
#
# ★ 값을 바꿀 때는 owner 를 고치고 시험이 가리키는 consumers 를 따라 고친다.
#   새 자리를 만들면 여기 consumers 에 더한다 — 안 더하면 exclusive/pins 가 운다.
# ★ 문서(docs/*.md)는 여기 안 든다. 커버리지 래칫의 문서 대조는 test_verify_citations 가,
#   판정 숫자의 문서 대조는 docnum_check 가 이미 한다.

facts:
  uv:
    what: uv 판 — CI · 배포 · 이미지 · devcontainer 가 같은 uv 로 uv.lock 을 푼다
    owner: {file: Dockerfile, regex: 'ghcr\.io/astral-sh/uv:([\w.]+)'}
    consumers:
      - {file: .github/workflows/contract.yml, has: 'version: "{v}"'}
      - {file: .github/workflows/_deploy.yml, has: 'version: "{v}"'}
      - {file: .devcontainer/setup.sh, has: 'astral.sh/uv/{v}/install.sh'}
    scan: [".github/**/*", "Dockerfile*", ".devcontainer/*"]
    pins:
      - {find: 'astral-sh/setup-uv@', regex: 'astral-sh/setup-uv@\S+\s*\n\s*with:\s*\n\s*version:\s*"([^"]*)"'}
      - {find: 'astral-sh/uv:', regex: 'astral-sh/uv:([\w.]+)'}
      - {find: 'astral.sh/uv/', regex: 'astral\.sh/uv/([\d.]+)/install\.sh'}
    exclusive: true

  node:
    what: 내비 빌드 · 타입 검사 노드 판 (DECISIONS §186-2 · test_ci_env)
    owner: {file: web/navi/.nvmrc, regex: '^(\d+)\s*$'}
    consumers:
      - {file: .github/actions/build-navi/action.yml, ref: 'node-version-file: web/navi/.nvmrc'}
      - {file: .github/workflows/contract.yml, ref: 'node-version-file: web/navi/.nvmrc'}
      - {file: .devcontainer/devcontainer.json, has: '"version": "{v}"'}

  python:
    what: 파이썬 판 (W3-17)
    owner: {file: .python-version, regex: '^([\d.]+)\s*$'}
    consumers:
      - {file: Dockerfile, has: 'FROM python:{v}-slim'}
      - {file: pyproject.toml, has: 'requires-python = ">={v}"'}
      - {file: .github/workflows/contract.yml, ref: 'python-version-file: .python-version'}
      - {file: .github/workflows/_deploy.yml, ref: 'python-version-file: .python-version'}
    scan: [".github/**/*", "Dockerfile*"]
    pins:
      - {find: 'python-version:', regex: 'python-version:\s*"?([\d.]+)'}
      - {find: 'FROM python:', regex: 'FROM python:([\d.]+)'}

  pytest:
    what: pytest 하한 — dev 그룹 한 곳(W3-1). 잠금이 하한 아래로 내려가면 안 된다
    owner: {file: pyproject.toml, regex: '"pytest>=([\d.]+)"'}
    consumers:
      - {file: uv.lock, regex: 'name = "pytest"\nversion = "([\d.]+)"', cmp: '>='}

  coverage_floor:
    what: 커버리지 래칫 문턱 — 명령줄은 숫자를 안 적고 변수를 읽는다(W3-11)
    owner: {file: tools/verify.sh, regex: '^COV_MIN=(\d+)\s*$'}
    consumers:
      - {file: tools/verify.sh, ref: '"$COV_MIN"'}
      - {file: tests/test_verify_citations.py, ref: 'COV_MIN='}

  truck_m:
    what: 통과 하한(m) — 판정 임계
    owner: {file: src/firelane/seg/params.py, regex: '^TRUCK\s*=\s*([\d.]+)'}
    consumers:
      - {file: web/config.js, has: '폭 {v}m 미만'}
      - {file: tools/render_figures.py, ref: '"TRUCK"'}
      - {file: tests/test_declaration_sync.py, ref: 'p["TRUCK"]'}

  park_m:
    what: 주차 1대 노면점유(m) — 여유선 = TRUCK + 2×PARK
    owner: {file: src/firelane/seg/params.py, regex: '^PARK\s*=\s*([\d.]+)'}
    consumers:
      - {file: tools/render_figures.py, ref: '"PARK"'}
      - {file: tests/test_declaration_sync.py, ref: 'p["PARK"]'}

  cctv_range_m:
    what: CCTV 유효 측정 반경(m)
    owner: {file: src/firelane/seg/params.py, regex: '^CCTV_RANGE\s*=\s*([\d.]+)'}
    consumers:
      - {file: web/config.js, has: '유효범위 {v:g}m 밖'}
      - {file: tools/render_figures.py, ref: '"CCTV_RANGE"'}

  code_owner:
    what: 저장소 단독 소유자(CODEOWNERS 기본 규칙 · 2026-09-09 개인 계정 이관)
    owner: {file: .github/CODEOWNERS, regex: '^\*\s+@(\S+)'}
    consumers:
      - {file: tools/navi_setup.py, has: 'default="@{v}"'}
      - {file: tools/ruleset_check.py, has: 'ADMINS = ["{v}"]'}
      - {file: tools/ruleset_check.py, has: 'FALLBACK_REPO = "{v}/fire-lane"'}

  font_stack:
    what: 그림 · 화면 글꼴 스택
    owner: {file: tools/render_figures.py, regex: '^FONT = "([^"]+)"'}
    consumers:
      - {file: web/navi/src/ui/tokens.ts, has: 'family: "{v}"'}
      - {file: web/proposal.html, has: '{v}'}
