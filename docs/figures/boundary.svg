<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" font-family="Pretendard, system-ui, sans-serif"><rect width="720" height="352" fill="#fff"/><defs><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs><text x="12" y="24" font-size="15" font-weight="700" fill="#0f172a">GIS ↔ 비전 모듈 경계 — 정본 src/contracts/vision.py</text><rect x="14" y="44" width="165" height="100" rx="6" fill="#dcfce7" stroke="#22c55e"/><text x="96.5" y="66" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">GIS 모듈</text><text x="96.5" y="88" font-size="10" fill="#64748b" text-anchor="middle">세그먼트 도형</text><text x="96.5" y="103" font-size="10" fill="#64748b" text-anchor="middle">width_min_m</text><text x="96.5" y="118" font-size="10" fill="#64748b" text-anchor="middle">tier · 커버리지</text><text x="96.5" y="133" font-size="10" fill="#64748b" text-anchor="middle">그래프 · 경로탐색</text><rect x="541" y="44" width="165" height="100" rx="6" fill="#fee2e2" stroke="#ef4444"/><text x="623.5" y="66" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">비전 모듈</text><text x="623.5" y="88" font-size="10" fill="#64748b" text-anchor="middle">호모그래피</text><text x="623.5" y="103" font-size="10" fill="#64748b" text-anchor="middle">세그멘테이션</text><text x="623.5" y="118" font-size="10" fill="#64748b" text-anchor="middle">유효 통행폭 측정</text><path d="M183 76 L537 76" stroke="#64748b" marker-end="url(#m8)"/><text x="360" y="68" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">① 관측점 선정</text><path d="M537 120 L183 120" stroke="#64748b" marker-end="url(#m8)"/><text x="360" y="112" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">② 판정 결과</text><text x="14" y="172" font-size="10" font-weight="700" fill="#0f172a">① GIS → 비전 · ObsSpec (5)</text><text x="14" y="187" font-size="9" fill="#64748b">obs_id · seg_uid · bearing_deg · length_m · ref_points</text><text x="14" y="211" font-size="10" font-weight="700" fill="#0f172a">② 비전 → GIS · VisionResult (14)</text><text x="14" y="226" font-size="9" fill="#64748b">obs_id · seg_uid · passable_width_m · passable_width_hard_m · at_offset_m · observed_at · n_frames</text><text x="14" y="239" font-size="9" fill="#64748b">confidence · masked · calib_id · h_id · params_ver · n_ref · h_rms_px</text><rect x="14" y="254" width="692" height="64" rx="6" fill="#fffbeb" stroke="#f59e0b"/><text x="26" y="274" font-size="11" fill="#78350f">※ 반대 방향이 없다. GIS 도로폭은 호모그래피 입력으로 안 들어간다.</text><text x="26" y="290" font-size="11" fill="#78350f">   흐름이 있다고 보면 지적도 캘리브레이션 시도로 되돌아간다(§19-2).</text><text x="26" y="308" font-size="11" fill="#78350f">※ 비전은 판정(verdict)을 안 넘긴다 — 임계값이 두 군데에 박힌다(§19-1).</text><text x="14" y="338" font-size="10" fill="#94a3b8">★ 접점은 이 둘뿐이다. 필드는 계약 모델에서 읽는다 — 계약이 바뀌면 이 그림이 따라 바뀐다.</text></svg>
