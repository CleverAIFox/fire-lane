<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 325" width="720" height="325" font-family="Pretendard, system-ui, sans-serif"><rect width="720" height="325" fill="#fff"/><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><text x="12" y="28" font-size="15" font-weight="700" fill="#0f172a">배포 — 정본 MASTER §12-8 · workflows · compose</text><rect x="20" y="55" width="170" height="90" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="105.0" y="75" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">main 푸시</text><text x="105.0" y="93" font-size="10" fill="#64748b" text-anchor="middle">contract</text><text x="105.0" y="108" font-size="10" fill="#64748b" text-anchor="middle">docs</text><text x="105.0" y="123" font-size="10" fill="#64748b" text-anchor="middle">pages</text><text x="105.0" y="138" font-size="10" fill="#64748b" text-anchor="middle">proposal</text><rect x="230" y="55" width="150" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="305.0" y="75" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">GitHub Pages</text><text x="305.0" y="93" font-size="10" fill="#64748b" text-anchor="middle">지도 · 협업 방침</text><text x="305.0" y="108" font-size="10" fill="#64748b" text-anchor="middle">플레이북 · 기획서</text><text x="305.0" y="123" font-size="10" fill="#64748b" text-anchor="middle">정적 파일</text><rect x="420" y="55" width="150" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="495.0" y="75" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">ECR</text><text x="495.0" y="93" font-size="10" fill="#64748b" text-anchor="middle">이미지 태그 =</text><text x="495.0" y="108" font-size="10" fill="#64748b" text-anchor="middle">커밋 해시</text><rect x="610" y="55" width="90" height="90" rx="6" fill="#dcfce7" stroke="#22c55e"/><text x="655.0" y="75" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">EC2 한 대</text><text x="655.0" y="93" font-size="10" fill="#64748b" text-anchor="middle">Compose</text><rect x="420" y="175" width="280" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="560.0" y="195" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">docker compose</text><text x="560.0" y="213" font-size="10" fill="#64748b" text-anchor="middle">web · etl</text><text x="560.0" y="228" font-size="10" fill="#64748b" text-anchor="middle">restart: unless-stopped</text><path d="M190 100 L228 100" stroke="#94a3b8" marker-end="url(#b)"/><path d="M380 100 L418 100" stroke="#94a3b8" marker-end="url(#b)"/><path d="M570 100 L608 100" stroke="#94a3b8" marker-end="url(#b)"/><path d="M655 145 L600 173" stroke="#94a3b8" marker-end="url(#b)"/><text x="20" y="285" font-size="11" fill="#64748b">★ ECS 가 아니다. 상시 서비스가 API 하나이고 ETL 은 배치이며 DB 가 없다. 되돌릴 조건은 DECISIONS §93-4 가 든다.</text><text x="20" y="305" font-size="11" fill="#64748b">★ 한 대는 단일 장애점이다. 자동 복구는 restart 하나이고 인스턴스가 죽으면 사람이 띄운다.</text></svg>
