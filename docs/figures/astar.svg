<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" font-family="Pretendard, system-ui, sans-serif"><rect width="720" height="344" fill="#fff"/><text x="12" y="30" font-size="15" font-weight="700" fill="#0f172a">A* 와 다익스트라 — 전개한 상태 수 (노드 1,139)</text><text x="12" y="50" font-size="11" fill="#64748b">정본 data/golden/astar.json · web/navi/test/astarbench.test.ts 가 잰다</text><text x="12" y="80" font-size="12" font-weight="700" fill="#2563eb">① 내비 — 출발 1 → 도착 1 (무작위 200쌍 합)</text><rect x="190" y="92" width="149.0" height="26" fill="#2563eb" rx="3"/><text x="12" y="110" font-size="11" fill="#475569">A*</text><text x="624" y="110" font-size="12" fill="#0f172a">41,281</text><rect x="190" y="124" width="408.3" height="26" fill="#64748b" rx="3"/><text x="12" y="142" font-size="11" fill="#475569">다익스트라</text><text x="624" y="142" font-size="12" fill="#0f172a">113,094</text><text x="12" y="172" font-size="12" fill="#2563eb">→ A* 가 2.7배 적게 연다. 이것이 A* 를 쓰는 이유다</text><text x="12" y="208" font-size="12" font-weight="700" fill="#0f172a">② 현재 산출 — 안전센터 1 → 전 노드 (목표 692)</text><rect x="190" y="220" width="420.0" height="26" fill="#64748b" rx="3"/><text x="12" y="238" font-size="11" fill="#475569">A* 를 목표마다</text><text x="624" y="238" font-size="12" fill="#0f172a">116,333</text><rect x="190" y="252" width="4.5" height="26" fill="#2563eb" rx="3"/><text x="12" y="270" font-size="11" fill="#475569">다익스트라 한 번</text><text x="624" y="270" font-size="12" fill="#0f172a">1,246</text><text x="12" y="300" font-size="12" fill="#0f172a">→ 다익스트라는 한 번에 전부 푼다. A* 는 93배 더 연다 — 여기서는 이득이 없다</text><text x="12" y="326" font-size="11" fill="#64748b">휴리스틱은 목표 하나를 향하므로 목표가 바뀌면 다시 열어야 한다. 그래서 일감이 고르는 것이다</text></svg>
