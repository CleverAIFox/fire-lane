"202" x2="490" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="506" y1="202" x2="506" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="522" y1="202" x2="522" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="538" y1="202" x2="538" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="554" y1="202" x2="554" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="570" y1="202" x2="570" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="586" y1="202" x2="586" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="602" y1="202" x2="602" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="618" y1="202" x2="618" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="634" y1="202" x2="634" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="650" y1="202" x2="650" y2="262" stroke="#16a34a" stroke-width="2"/><line x1="666" y1="202" x2="666" y2="262" stroke="#16a34a" stroke-width="2"/><text x="12" y="28" font-size="15" font-weight="700" fill="#0f172a">도로폭 산출 — 법선 트랜섹트와 평면교차점 실형상 제외</text><text x="12" y="48" font-size="11" fill="#64748b">정본 src/firelane/seg/params.py · XSEC_EXCL — 규칙은 seg/width.py</text><text x="44" y="68" font-size="12" fill="#475569">폴백 — 평면교차점 실형상이 없는 교차로에서만. 노드에서 5m</text><text x="676" y="84" font-size="12" fill="#0f172a" text-anchor="end">표본 39 · 버림 5</text><text x="44" y="182" font-size="12" fill="#475569">실형상 — 평면교차점 폴리곤 안의 표본만 버린다. 이쪽이 규칙이다</text><text x="676" y="198" font-size="12" fill="#0f172a" text-anchor="end">표본 39 · 버림 3</text><text x="12" y="300" font-size="11" fill="#64748b">세로선 하나가 법선 트랜섹트 한 번이다 — 초록은 잰 것, 회색 점선은 버린 것이다.</text><text x="12" y="318" font-size="11" fill="#dc2626">※ 원은 규칙이 아니라 폴백이다. 반경 5m 는 작은 교차부를 과하게 도려내고 큰 교차부에는 오염을 남긴다.</text></svg>
